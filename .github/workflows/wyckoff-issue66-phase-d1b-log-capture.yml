name: Wyckoff Issue 66 Phase D1B Log Capture

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1b_log_capture_pine.py'
      - 'indicators/wyckoff-regime-radar/research/parse_issue66_phase_d1b_pine_logs.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_d1b_log_capture.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1_parity_pine.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-d1b-pine-log-capture-plan.md'
      - '.github/workflows/wyckoff-issue66-phase-d1b-log-capture.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1b_log_capture_pine.py'
      - 'indicators/wyckoff-regime-radar/research/parse_issue66_phase_d1b_pine_logs.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_d1b_log_capture.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1_parity_pine.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-d1b-pine-log-capture-plan.md'
      - '.github/workflows/wyckoff-issue66-phase-d1b-log-capture.yml'

permissions:
  contents: write

jobs:
  phase-d1b-log-capture-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile D1B tooling
        run: |
          python -m py_compile generate_issue66_phase_d1b_log_capture_pine.py
          python -m py_compile parse_issue66_phase_d1b_pine_logs.py
          python -m py_compile test_issue66_phase_d1b_log_capture.py
      - name: Run D1B contract
        run: python -m unittest -v test_issue66_phase_d1b_log_capture
      - name: Generate D1B Pine Logs harness
        run: |
          python generate_issue66_phase_d1b_log_capture_pine.py \
            --output generated/wyckoff-issue66-phase-d1b-c2-log-capture.pine
      - name: Commit generated D1B harness on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/wyckoff-issue66-phase-d1b-c2-log-capture.pine
          if git diff --cached --quiet; then
            echo "No generated D1B harness change"
          else
            git commit -m "research: generate Issue 66 D1B Pine log capture [skip ci]"
            git push
          fi
