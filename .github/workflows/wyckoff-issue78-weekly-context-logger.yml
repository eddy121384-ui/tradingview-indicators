name: Wyckoff Issue 78 weekly context logger

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-weekly-context-logger.yml'
      - 'indicators/wyckoff-regime-radar/src/chase-risk-market-regime-radar-issue68-rc.pine'
      - 'indicators/wyckoff-regime-radar/research/generate_issue78_weekly_context_logger_pine.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_daily_weekly_sizing.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_weekly_conflict_diagnostic.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_participation_ramp.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_economic_value_audit.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check research code
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/generate_issue78_weekly_context_logger_pine.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_participation_ramp.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_economic_value_audit.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_daily_weekly_sizing.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_weekly_conflict_diagnostic.py

      - name: Generate frozen-source weekly context logger
        run: |
          python indicators/wyckoff-regime-radar/research/generate_issue78_weekly_context_logger_pine.py \
            --output indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-weekly-context-logger.pine

      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-weekly-context-logger.pine
          grep -F 'Chase Risk Weekly Context Logger｜Issue #78' "$FILE"
          grep -F 'ctxDownExGate = math.min(downsideExhaustionGate, currentBearGate)' "$FILE"
          grep -F 'ctxUpExGate = math.min(upsideExhaustionGate, currentBullGate)' "$FILE"
          grep -F 'timeframe.isweekly and timeframe.multiplier == 1' "$FILE"
          grep -F 'f_issue78WeeklyEr(modelPrice, 13)' "$FILE"
          grep -F 'f_issue78WeeklyEr(modelPrice, 26)' "$FILE"
          grep -F 'f_issue78WeeklyEr(modelPrice, 52)' "$FILE"
          grep -F 'ta.percentrank(issue78Er13w, 156)' "$FILE"
          grep -F 'ISSUE78WEEKLY|schema=1' "$FILE"
          grep -F 'week_close_time=' "$FILE"
          grep -F 'wtrend=' "$FILE"
          grep -F 'week_close_time <= daily event_time' indicators/wyckoff-regime-radar/research/analyze_issue78_daily_weekly_sizing.py
          grep -F 'weekly_trendability_cap' indicators/wyckoff-regime-radar/research/analyze_issue78_daily_weekly_sizing.py
          grep -F 'DirectionalConflict' indicators/wyckoff-regime-radar/research/analyze_issue78_weekly_conflict_diagnostic.py
          ! grep -F 'strategy.entry' "$FILE"
          ! grep -F 'strategy.close' "$FILE"
          git diff --check

      - name: Commit generated Pine when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-weekly-context-logger.pine
          if git diff --cached --quiet; then
            echo 'Generated weekly context logger already current.'
          else
            git commit -m 'research: generate Issue #78 weekly context logger [skip ci]'
            git push
          fi
