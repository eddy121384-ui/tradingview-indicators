name: Wyckoff v0.6 Phase A Robustness

on:
  workflow_dispatch:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/v06_boundary_scores.py"
      - "indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_boundary_sensitivity.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_breakout20_sensitivity.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_a_report.py"
      - "indicators/wyckoff-regime-radar/research/test_v06_boundary_scores.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_boundary_sensitivity.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_breakout20_sensitivity.py"
      - "indicators/wyckoff-regime-radar/research/test_generate_issue57_phase_a_report.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.*"
      - ".github/workflows/wyckoff-v06-phase-a.yml"

permissions:
  contents: write

jobs:
  phase-a-boundary-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Phase A modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/v06_boundary_scores.py \
            indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_boundary_sensitivity.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_breakout20_sensitivity.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_a_report.py \
            indicators/wyckoff-regime-radar/research/test_v06_boundary_scores.py \
            indicators/wyckoff-regime-radar/research/test_diagnose_v06_boundary_sensitivity.py \
            indicators/wyckoff-regime-radar/research/test_diagnose_v06_breakout20_sensitivity.py \
            indicators/wyckoff-regime-radar/research/test_generate_issue57_phase_a_report.py
      - name: Run Phase A tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m unittest -v \
            test_v06_boundary_scores \
            test_diagnose_v06_boundary_sensitivity \
            test_diagnose_v06_breakout20_sensitivity \
            test_generate_issue57_phase_a_report
      - name: Generate deterministic Phase A report
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/reports
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_a_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_a_report.py \
            --json-output /tmp/issue-57-phase-a-boundary-robustness.json \
            --md-output /tmp/issue-57-phase-a-boundary-robustness.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.json /tmp/issue-57-phase-a-boundary-robustness.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.md /tmp/issue-57-phase-a-boundary-robustness.md
      - name: Commit Phase A report on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-a-boundary-robustness.md
          if git diff --cached --quiet; then
            echo "Issue #57 Phase A report already current."
          else
            git commit -m "Record Issue #57 Phase A robustness report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
