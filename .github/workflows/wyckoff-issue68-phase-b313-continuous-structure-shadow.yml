name: Wyckoff Issue 68 Phase B3.13 Continuous Structure Shadow
on:
  push:
    branches: [research/issue-68-lifecycle-retest-symmetry-repaired]
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b313_continuous_structure_shadow.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b313_continuous_structure_shadow.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b313-continuous-structure-shadow-preregistration.md'
      - '.github/workflows/wyckoff-issue68-phase-b313-continuous-structure-shadow.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b313_continuous_structure_shadow.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b313_continuous_structure_shadow.py'
      - '.github/workflows/wyckoff-issue68-phase-b313-continuous-structure-shadow.yml'
permissions: {contents: write}
jobs:
  continuous-structure-shadow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pandas
      - name: Compile and synthetic contracts
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m py_compile diagnose_issue68_phase_b313_continuous_structure_shadow.py test_issue68_phase_b313_continuous_structure_shadow.py
          python test_issue68_phase_b313_continuous_structure_shadow.py
      - name: Frozen-FX continuous Structure shadow forensic
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python diagnose_issue68_phase_b313_continuous_structure_shadow.py \
            --report-json reports/issue-68-phase-b313-continuous-structure-shadow.json \
            --report-md reports/issue-68-phase-b313-continuous-structure-shadow.md
      - name: Diagnostic-only guard
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import json
          data=json.load(open('reports/issue-68-phase-b313-continuous-structure-shadow.json'))
          text=json.dumps(data).lower()
          bad=[x for x in ('sharpe','sortino','profit_factor','net_profit','strategy_return') if x in text]
          assert not bad,bad
          print('B3.13 diagnostic-only boundary PASS')
          PY
      - name: Commit refreshed B3.13 report
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/reports/issue-68-phase-b313-continuous-structure-shadow.*
          git diff --cached --quiet || (git commit -m 'research(issue-68): refresh B3.13 continuous Structure report' && git push)
