name: Wyckoff Issue 61 Buy Hold Benchmark

on:
  push:
    branches:
      - research/issue-61-stage-aware-position-lifecycle
    paths:
      - 'indicators/wyckoff-regime-radar/research/evaluate_issue61_buy_hold_benchmark.py'
      - '.github/workflows/wyckoff-issue61-buy-hold-benchmark.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/evaluate_issue61_buy_hold_benchmark.py'
      - '.github/workflows/wyckoff-issue61-buy-hold-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buy-hold-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile benchmark
        run: python -m py_compile evaluate_issue61_buy_hold_benchmark.py
      - name: Evaluate buy-and-hold benchmark
        run: |
          python evaluate_issue61_buy_hold_benchmark.py \
            --json-output reports/issue-61-buy-hold-benchmark.json \
            --md-output reports/issue-61-buy-hold-benchmark.md
      - name: Commit report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-61-stage-aware-position-lifecycle'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-buy-hold-benchmark.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-buy-hold-benchmark.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record Issue #61 buy-hold benchmark"
            git push
          fi
