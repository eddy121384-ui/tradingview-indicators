name: Macro Pressure Map Issue 97 Phase A0 Source Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_97_phase_a0_*"
      - "indicators/macro-pressure-map/research/test_issue_97_phase_a0_*"
      - "indicators/macro-pressure-map/research/decisions/issue-97-phase-a0-*"
      - ".github/workflows/macro-pressure-map-issue-97-phase-a0.yml"
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install "numpy==2.4.6" "pandas==3.0.5" "pytest==9.1.1"
      - name: Unit test
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_97_phase_a0_source_audit.py
      - name: Audit official sources only
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-97-phase-a0
          python issue_97_phase_a0_source_audit.py --output-dir generated/issue-97-phase-a0
      - name: Enforce no-outcome boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("generated/issue-97-phase-a0/issue-97-phase-a0-source-audit.json")
          x=json.loads(p.read_text())
          assert x["policy_model_outcomes_computed"] is False
          assert x["treasury_outcomes_loaded"] is False
          assert x["portfolio_results_computed"] is False
          assert x["sources"]["effr"]["first_month"]=="1954-07"
          assert x["sources"]["effr"]["last_month"]=="2025-12"
          assert x["monthly_overlap"]["first_month"]=="1954-07"
          assert x["monthly_overlap"]["last_month"]=="2025-12"
          print(x["monthly_overlap"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-97-phase-a0-source-audit
          path: indicators/macro-pressure-map/research/generated/issue-97-phase-a0
          retention-days: 3
