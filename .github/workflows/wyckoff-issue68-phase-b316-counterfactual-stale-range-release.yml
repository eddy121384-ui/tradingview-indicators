name: Wyckoff Issue 68 Phase B3.16 Counterfactual Stale-Range Release
on:
  push:
    branches: [research/issue-68-lifecycle-retest-symmetry-repaired]
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b316_counterfactual_stale_range_release.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b316_counterfactual_stale_range_release.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue68_phase_b316_counterfactual_stale_range_release_audit_pine.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b316-counterfactual-stale-range-release-preregistration.md'
      - '.github/workflows/wyckoff-issue68-phase-b316-counterfactual-stale-range-release.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b316_counterfactual_stale_range_release.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b316_counterfactual_stale_range_release.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue68_phase_b316_counterfactual_stale_range_release_audit_pine.py'
      - '.github/workflows/wyckoff-issue68-phase-b316-counterfactual-stale-range-release.yml'
permissions: {contents: write}
jobs:
  counterfactual-stale-range-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pandas
      - name: Compile and synthetic contracts
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m py_compile diagnose_issue68_phase_b316_counterfactual_stale_range_release.py test_issue68_phase_b316_counterfactual_stale_range_release.py generate_issue68_phase_b316_counterfactual_stale_range_release_audit_pine.py
          python test_issue68_phase_b316_counterfactual_stale_range_release.py
      - name: Frozen-FX counterfactual stale-range release
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python diagnose_issue68_phase_b316_counterfactual_stale_range_release.py \
            --report-json reports/issue-68-phase-b316-counterfactual-stale-range-release.json \
            --report-md reports/issue-68-phase-b316-counterfactual-stale-range-release.md
      - name: Generate TradingView B3.16 shadow audit
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python generate_issue68_phase_b316_counterfactual_stale_range_release_audit_pine.py \
            --output generated/wyckoff-issue68-phase-b316-counterfactual-stale-range-release-audit.pine
          python - <<'PY'
          p='generated/wyckoff-issue68-phase-b316-counterfactual-stale-range-release-audit.pine'
          s=open(p,encoding='utf-8').read()
          assert 'strategy.' not in s
          for token in ('B316 SHADOW BREAK band','B316 SHADOW RAW band','B316 STALE OVERLAP band','B316 BREAK RELEASE band','B316 RAW ADVANCE band'):
              assert token in s,token
          print('B3.16 Pine shadow contract PASS')
          PY
      - name: Diagnostic-only guard
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import json
          data=json.load(open('reports/issue-68-phase-b316-counterfactual-stale-range-release.json'))
          text=json.dumps(data).lower()
          bad=[x for x in ('sharpe','sortino','profit_factor','net_profit','strategy_return') if x in text]
          assert not bad,bad
          assert data['aggregate']['primary_reproduction_delta']==0
          print('B3.16 diagnostic-only boundary PASS')
          PY
      - name: Commit refreshed B3.16 artifacts
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/reports/issue-68-phase-b316-counterfactual-stale-range-release.* \
                  indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-phase-b316-counterfactual-stale-range-release-audit.pine
          git diff --cached --quiet || (git commit -m 'research(issue-68): refresh B3.16 counterfactual artifacts' && git push)
