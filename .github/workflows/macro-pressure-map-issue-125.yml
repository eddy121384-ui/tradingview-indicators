name: Macro Pressure Map Issue 125 Reflation Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_125_reflation_bridge.py"
      - "indicators/macro-pressure-map/research/test_issue_125_reflation_bridge.py"
      - "indicators/macro-pressure-map/research/data/issue-64-frozen-regime-transitions.csv"
      - "indicators/macro-pressure-map/research/decisions/issue-125-*"
      - ".github/workflows/macro-pressure-map-issue-125.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "pandas==3.0.5" "pytest==9.1.1"

      - name: Validate Issue 125 preregistration and evaluator
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q test_issue_125_reflation_bridge.py
          python -m py_compile issue_125_reflation_bridge.py

      - name: Run Issue 125 bridge
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-125
          python issue_125_reflation_bridge.py --output-dir generated/issue-125

      - name: Validate result contract
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("generated/issue-125/issue-125-result.json").read_text())
          assert r["issue"] == 125
          assert len(r["gate"]) == 10
          assert r["bridge"]["years"] == 19
          assert r["source_hashes"]["exact_v66_transitions_sha256"] == "80446bbcb91be8b18eb0b95e62466edf892e4c04087696a04532f0fe214698af"
          assert r["verdict"] in {
              "bridge_supports_hmra_to_exact_v66_reflation_translation",
              "bridge_semantically_related_but_not_reflation_specific",
              "bridge_weak_or_mismatched",
              "bridge_inconclusive_small_overlap",
          }
          assert r["production_authorized"] is False
          print({
              "verdict":r["verdict"],
              "gate":r["gate"],
              "primary":r["bridge"]["primary"],
              "specificity":r["bridge"]["regime_specificity"],
              "binary":r["binary_monthly_diagnostic"],
          })
          PY

      - name: Upload Issue 125 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-125-reflation-bridge
          path: indicators/macro-pressure-map/research/generated/issue-125
          retention-days: 30
          if-no-files-found: error
