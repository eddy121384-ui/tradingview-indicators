name: Macro Pressure Map Issue 97 Phase A Policy Reaction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_97_phase_a_policy_reaction.py"
      - "indicators/macro-pressure-map/research/test_issue_97_phase_a_policy_reaction.py"
      - "indicators/macro-pressure-map/research/decisions/issue-97-phase-a-*"
      - ".github/workflows/macro-pressure-map-issue-97-phase-a.yml"
permissions:
  contents: read
jobs:
  policy-reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install "numpy==2.4.6" "pandas==3.0.5" "pytest==9.1.1"
      - name: Revalidate prereg
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_97_phase_a_prereg.py
      - name: Unit tests
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_97_phase_a_policy_reaction.py
      - name: Run policy reaction evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-97-phase-a
          python issue_97_phase_a_policy_reaction.py --output-dir generated/issue-97-phase-a
      - name: Enforce Phase A boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/issue-97-phase-a/issue-97-phase-a-manifest.json").read_text())
          assert m["preregistration_preceded_outcomes"] is True
          assert m["treasury_outcomes_loaded"] is False
          assert m["portfolio_results_computed"] is False
          assert m["production_v66_modified"] is False
          print(m["oos"])
          print(m["primary_M2_minus_M1"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-97-phase-a-policy-reaction
          path: indicators/macro-pressure-map/research/generated/issue-97-phase-a
          retention-days: 3
