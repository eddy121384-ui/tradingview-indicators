name: Wyckoff v0.6 Phase E Freeze Holdout

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/issue-57-phase-e-preregistration.md"
      - "indicators/wyckoff-regime-radar/research/freeze_issue57_phase_e_holdout.py"
      - "indicators/wyckoff-regime-radar/research/test_freeze_issue57_phase_e_holdout.py"
      - "indicators/wyckoff-regime-radar/research/data/issue-57-phase-e-holdout-manifest.json"
      - "indicators/wyckoff-regime-radar/research/data/frozen/issue-57-holdout-*-static-d1.csv"
      - ".github/workflows/wyckoff-v06-phase-e-freeze.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/issue-57-phase-e-preregistration.md"
      - "indicators/wyckoff-regime-radar/research/freeze_issue57_phase_e_holdout.py"
      - "indicators/wyckoff-regime-radar/research/test_freeze_issue57_phase_e_holdout.py"
      - "indicators/wyckoff-regime-radar/research/data/issue-57-phase-e-holdout-manifest.json"
      - "indicators/wyckoff-regime-radar/research/data/frozen/issue-57-holdout-*-static-d1.csv"
      - ".github/workflows/wyckoff-v06-phase-e-freeze.yml"

permissions:
  contents: write

jobs:
  freeze-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Phase E freeze modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/freeze_issue57_phase_e_holdout.py \
            indicators/wyckoff-regime-radar/research/test_freeze_issue57_phase_e_holdout.py
      - name: Run Phase E freeze contract tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m unittest -v test_freeze_issue57_phase_e_holdout
      - name: Freeze or verify sealed cross-market holdout
        run: |
          MANIFEST=indicators/wyckoff-regime-radar/research/data/issue-57-phase-e-holdout-manifest.json
          if [ -f "$MANIFEST" ]; then
            python indicators/wyckoff-regime-radar/research/freeze_issue57_phase_e_holdout.py verify
          else
            python indicators/wyckoff-regime-radar/research/freeze_issue57_phase_e_holdout.py freeze
          fi
      - name: Commit frozen sealed holdout on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/data/issue-57-phase-e-holdout-manifest.json \
            indicators/wyckoff-regime-radar/research/data/frozen/issue-57-holdout-*-static-d1.csv
          if git diff --cached --quiet; then
            echo "Issue #57 Phase E holdout already frozen and sealed."
          else
            git commit -m "Freeze Issue #57 Phase E independent FX holdout"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
