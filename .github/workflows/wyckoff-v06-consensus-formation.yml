name: Wyckoff v0.6 Consensus Formation Diagnostic

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-consensus-formation-preregistered-diagnostic.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_consensus_formation_and_formal_lag.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_consensus_formation_and_formal_lag.py'
      - '.github/workflows/wyckoff-v06-consensus-formation.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-consensus-formation-preregistered-diagnostic.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_consensus_formation_and_formal_lag.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_consensus_formation_and_formal_lag.py'
      - '.github/workflows/wyckoff-v06-consensus-formation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  burned-data-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic
        run: |
          python -m py_compile diagnose_consensus_formation_and_formal_lag.py
          python -m py_compile test_diagnose_consensus_formation_and_formal_lag.py
      - name: Run contract tests
        run: python -m unittest -v test_diagnose_consensus_formation_and_formal_lag
      - name: Run burned-data diagnostic
        run: |
          python diagnose_consensus_formation_and_formal_lag.py \
            --json-output reports/issue-57-consensus-formation-and-formal-lag.json \
            --md-output reports/issue-57-consensus-formation-and-formal-lag.md
      - name: Commit diagnostic reports on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-consensus-formation-and-formal-lag.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-consensus-formation-and-formal-lag.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record Issue 57 consensus-formation diagnostic"
            git push
          fi
