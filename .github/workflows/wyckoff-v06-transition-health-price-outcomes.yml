name: Wyckoff v0.6 Transition Health Price Outcomes

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_transition_health_price_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_transition_health_price_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-price-outcomes.md'
      - '.github/workflows/wyckoff-v06-transition-health-price-outcomes.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_transition_health_price_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_transition_health_price_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-price-outcomes.md'
      - '.github/workflows/wyckoff-v06-transition-health-price-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transition-health-price-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic
        run: |
          python -m py_compile diagnose_transition_health_price_outcomes.py
          python -m py_compile test_diagnose_transition_health_price_outcomes.py
      - name: Run contract tests
        run: python -m unittest -v test_diagnose_transition_health_price_outcomes
      - name: Map transition health price outcomes
        run: |
          python diagnose_transition_health_price_outcomes.py \
            --json-output reports/issue-57-transition-health-price-outcomes.json \
            --md-output reports/issue-57-transition-health-price-outcomes.md
      - name: Commit report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-health-price-outcomes.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-health-price-outcomes.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record transition health price outcomes"
            git push
          fi
