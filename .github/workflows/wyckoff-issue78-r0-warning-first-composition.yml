name: Wyckoff Issue 78 R0 warning-first composition

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-r0-warning-first-composition.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_r0_warning_first_composition.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_r0_warning_first_composition.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-r0-warning-first-composition-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-r0-warning-first-composition-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-r0-warning-first-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas scipy pytest

      - name: Syntax check
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_r0_warning_first_composition.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_r0_warning_first_composition.py

      - name: Composition causal tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m pytest -q test_issue78_r0_warning_first_composition.py

      - name: Static research-contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_r0_warning_first_composition.py
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'EXPECTED_B3_EVENTS = 997' "$FILE"
          grep -F 'EXPECTED_P12 = 236' "$FILE"
          grep -F 'R0_NoDerisk' "$FILE"
          grep -F 'R0_WarningFirst' "$FILE"
          grep -F 'warning_first' "$FILE"
          grep -F 'giveback >= 4.0' "$FILE"
          grep -F 'giveback >= 2.0' "$FILE"
          grep -F 'max(base.PROBE, earned[i] - 0.25 * reduction_steps)' "$FILE"
          git diff --check
