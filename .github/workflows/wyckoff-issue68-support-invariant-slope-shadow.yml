name: Wyckoff Issue 68 Support-Invariant Slope Shadow

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_support_invariant_slope_shadow_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_support_invariant_slope_shadow_pine_v2.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-support-invariant-slope-shadow-preregistration.md"
      - ".github/workflows/wyckoff-issue68-support-invariant-slope-shadow.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_support_invariant_slope_shadow_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_support_invariant_slope_shadow_pine_v2.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-support-invariant-slope-shadow-preregistration.md"
      - ".github/workflows/wyckoff-issue68-support-invariant-slope-shadow.yml"

permissions:
  contents: write

jobs:
  support-invariant-slope-shadow:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python -m py_compile generate_issue68_support_invariant_slope_shadow_pine.py generate_issue68_support_invariant_slope_shadow_pine_v2.py
      - name: Generate TradingView support-invariant shadow
        run: |
          python generate_issue68_support_invariant_slope_shadow_pine_v2.py \
            --output generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          test -s generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          grep -q 'Support-Invariant Slope-Dulling Shadow' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          grep -q 'Support-invariant shadow TOP' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          grep -q 'S2 EFF > S1' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          grep -q 'Common bp z avg' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          grep -q 'SHADOW ONLY' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          ! grep -q 'strategy\.' generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          echo 'Support-invariant slope shadow contract PASS'
      - name: Commit generated artifact on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-support-invariant-slope-shadow.pine
          if git diff --cached --quiet; then
            echo "Support-invariant slope shadow artifact already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 support-invariant slope shadow [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
