name: Wyckoff Issue 78 Equity Trendability Autopsy

on:
  push:
    branches:
      - research/issue-78-equity-trendability-autopsy
    paths:
      - '.github/workflows/wyckoff-issue78-equity-trendability-autopsy.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_equity_trendability_autopsy.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_equity_trendability_autopsy.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-equity-trendability-autopsy-preregistration.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue78-equity-trendability-autopsy.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_equity_trendability_autopsy.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_equity_trendability_autopsy.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-equity-trendability-autopsy-preregistration.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas scipy pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_equity_trendability_autopsy.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_equity_trendability_autopsy.py

      - name: Trendability tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m pytest -q test_issue78_equity_trendability_autopsy.py

      - name: Diff check
        run: git diff --check
