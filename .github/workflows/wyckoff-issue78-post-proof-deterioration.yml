name: Wyckoff Issue 78 post-proof deterioration

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-post-proof-deterioration.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_post_proof_deterioration.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-post-proof-deterioration-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-post-proof-deterioration-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-post-proof-deterioration-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check analyzer
        run: python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_post_proof_deterioration.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_post_proof_deterioration.py
          grep -F 'GIVEBACKS = (0.5, 1.0, 2.0, 4.0)' "$FILE"
          grep -F 'STALLS = (5, 10, 20)' "$FILE"
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'EXPECTED_ELIGIBLE = 1031' "$FILE"
          git diff --check
