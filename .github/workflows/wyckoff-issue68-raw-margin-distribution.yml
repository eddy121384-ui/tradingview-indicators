name: Wyckoff Issue 68 RAW Margin Distribution

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_cross_market_raw_margin_distribution_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-raw-margin-distribution-preregistration.md"
      - ".github/workflows/wyckoff-issue68-raw-margin-distribution.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_cross_market_raw_margin_distribution_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-raw-margin-distribution-preregistration.md"
      - ".github/workflows/wyckoff-issue68-raw-margin-distribution.yml"

permissions:
  contents: write

jobs:
  raw-margin-distribution:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python -m py_compile generate_issue68_cross_market_raw_margin_distribution_audit_pine.py
      - name: Generate TradingView RAW margin distribution audit
        run: |
          python generate_issue68_cross_market_raw_margin_distribution_audit_pine.py \
            --output generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          test -s generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          grep -q 'RAW Margin Distribution Audit' generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          grep -q 'S2 RAW lead' generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          grep -q 'S1-leading runs' generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          grep -q 'FIXED RAW BINS' generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          ! grep -q 'strategy\.' generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          echo 'RAW margin distribution audit contract PASS'
      - name: Commit generated artifact on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-cross-market-raw-margin-distribution-audit.pine
          if git diff --cached --quiet; then
            echo "RAW margin distribution artifact already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 RAW margin distribution audit [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
