name: Macro Pressure Map Asset Allocation Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/*.py"
      - "indicators/macro-pressure-map/research/data/issue-64-*"
      - "indicators/macro-pressure-map/research/decisions/issue-64-*"
      - "indicators/macro-pressure-map/research/issue-64-asset-allocation-spec.md"
      - "indicators/macro-pressure-map/research/requirements-issue-64-lock.txt"
      - ".github/workflows/macro-pressure-map-asset-allocation.yml"

permissions:
  contents: read

jobs:
  issue-64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install locked Issue 64 research environment
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --no-deps -r requirements-issue-64-lock.txt
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          lock = Path("requirements-issue-64-lock.txt")
          checked = {}
          for raw in lock.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, expected = line.split("==", 1)
              actual = version(name)
              assert actual == expected, (name, expected, actual)
              checked[name] = actual
          print({"locked_packages_verified": len(checked), "python_lock": "3.11.16", "pip_lock": "26.2.1"})
          PY

      - name: Run focused Issue 64 tests
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q \
            test_issue_64_outcome_snapshot.py \
            test_asset_allocation_phase_a.py \
            test_asset_allocation_phase_a_frozen.py \
            test_asset_allocation_relative.py \
            test_asset_allocation_phase_b.py \
            test_asset_allocation_phase_b_diagnostics.py \
            test_asset_allocation_phase_b_episode_diagnostics.py \
            test_asset_allocation_phase_c.py \
            test_asset_allocation_phase_c_diagnostics.py \
            test_asset_allocation_contribution_diagnostics.py

      - name: Generate Phase A evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-64-phase-a
          python asset_allocation_phase_a_snapshot.py \
            --start 2007-01-01 \
            --output-dir generated/issue-64-phase-a
          python asset_allocation_phase_a_segments.py \
            --output-dir generated/issue-64-phase-a

      - name: Validate Phase A manifest and durable decision provenance
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m json.tool generated/issue-64-phase-a/phase-a-manifest.json > /dev/null
          python -m json.tool generated/issue-64-phase-a/phase-a-outcome-prices-manifest.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(Path("decisions/issue-64-phase-a.json").read_text())
          frozen = json.loads(Path("data/issue-64-outcome-prices-manifest.json").read_text())
          generated = json.loads(Path("generated/issue-64-phase-a/phase-a-outcome-prices-manifest.json").read_text())

          bound = decision["outcomes"]["frozen_snapshot"]
          assert bound["csv_sha256"] == frozen["csv_sha256"]
          assert bound["archive_sha256"] == frozen["archive_sha256"]
          assert bound["rows"] == frozen["rows"]
          assert bound["first_date"] == frozen["first_date"]
          assert bound["last_date"] == frozen["last_date"]
          assert bound["source_artifact_run"] == frozen["source"]["source_artifact_run"]
          assert bound["source_phase_a_artifact"] == frozen["source"]["source_phase_a_artifact"]
          assert decision["latest_verified_workflow"]["frozen_snapshot_csv_sha256"] == frozen["csv_sha256"]

          # The generated artifact may serialize the same float panel differently,
          # so its own CSV digest is not required to equal the committed source CSV.
          # Provenance is established by the acquisition mode plus the runtime
          # manifest's immutable source digests/coverage.
          assert generated["rows"] == frozen["rows"]
          assert generated["first_date"] == frozen["first_date"]
          assert generated["last_date"] == frozen["last_date"]
          source = generated["source"]
          assert source["acquisition_mode"] == "committed_frozen_snapshot"
          runtime = source["runtime_manifest"]
          assert runtime["snapshot_csv_sha256"] == frozen["csv_sha256"]
          assert runtime["snapshot_archive_sha256"] == frozen["archive_sha256"]
          assert runtime["snapshot_rows"] == frozen["rows"]
          assert runtime["snapshot_first_date"] == frozen["first_date"]
          assert runtime["snapshot_last_date"] == frozen["last_date"]

          print({
              "decision_source_snapshot_sha256": bound["csv_sha256"],
              "source_artifact_run": bound["source_artifact_run"],
              "generated_artifact_sha256": generated["csv_sha256"],
              "runtime_source_snapshot_sha256": runtime["snapshot_csv_sha256"],
              "acquisition_mode": source["acquisition_mode"],
          })
          PY

      - name: Generate preregistered Phase B evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-64-phase-b
          python asset_allocation_phase_b_snapshot.py \
            --start 2007-01-01 \
            --output-dir generated/issue-64-phase-b
          python asset_allocation_phase_b_diagnostics.py \
            --phase-b-dir generated/issue-64-phase-b
          python asset_allocation_phase_b_episode_diagnostics.py \
            --phase-b-dir generated/issue-64-phase-b
          python asset_allocation_contribution_diagnostics.py \
            --phase-dir generated/issue-64-phase-b \
            --phase-prefix phase-b

      - name: Validate Phase B evidence JSON and durable episode counterfactual
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m json.tool generated/issue-64-phase-b/phase-b-manifest.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-outcome-prices-manifest.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-posthoc-exposure-match.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-posthoc-timing-concentration.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-contribution-manifest.json > /dev/null
          test -s generated/issue-64-phase-b/phase-b-asset-contribution.csv
          test -s generated/issue-64-phase-b/phase-b-regime-allocation-contribution.csv
          test -s generated/issue-64-phase-b/phase-b-contribution-reconciliation.csv
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(Path("decisions/issue-64-phase-b.json").read_text())
          generated = json.loads(Path("generated/issue-64-phase-b/phase-b-posthoc-timing-concentration.json").read_text())
          durable = decision["posthoc_episode_concentration"]
          rows = {row["segment"]: row for row in generated["summary_rows"]}
          tol = 1e-9

          assert generated["schema_version"] >= 4
          assert generated["phase_b_replay_max_abs_net_return_error"] <= durable["phase_b_replay_max_abs_net_return_error_bound"]
          assert generated["leaveout_semantics"] == (
              "selected whole Reflation override episode is disabled and the portfolio is rerun from "
              "inception; the leaveout evaluation segment then receives a fresh realized-exposure-matched "
              "control, so entry/exit costs, subsequent drift, and the exposure change caused by removal "
              "are not misattributed to timing"
          )

          for segment in ("development_pre2020", "post2019_reused_exploratory"):
              expected = durable[segment]
              actual = rows[segment]
              assert f"{actual['largest_positive_episode_start']} through {actual['largest_positive_episode_end']}" == expected["largest_positive_episode"]
              assert actual["reflation_episodes"] == expected["reflation_episodes"]
              assert actual["positive_reflation_episodes"] == expected["positive_reflation_episodes"]
              match = actual["leaveout_realized_exposure_matching"]
              assert match["matching_basis"] == "leaveout realized average invested_weight_* exposure"
              assert match["max_abs_invested_weight_mismatch"] <= durable["leaveout_control_max_abs_invested_weight_mismatch_bound"]
              assert abs(match["max_abs_invested_weight_mismatch"] - expected["leaveout_control_max_abs_invested_weight_mismatch"]) <= tol
              checks = {
                  "normal_active_log_return": actual["normal_active_log_return"],
                  "largest_positive_episode_active_log_including_exit_day": actual["screening_active_log_contribution_including_exit_day"],
                  "top1_share_of_positive_episode_contribution": actual["top1_share_of_positive_episode_contribution"],
                  "active_log_after_removing_largest_positive_episode": actual["active_log_after_removing_largest_positive_reflation_episode"],
                  "leaveout_delta_CAGR": actual["incremental_after_leaveout"]["delta_CAGR"],
                  "leaveout_delta_Sharpe": actual["incremental_after_leaveout"]["delta_Sharpe"],
              }
              for key, value in checks.items():
                  assert abs(value - expected[key]) <= tol, (segment, key, value, expected[key])

          assert decision["decision"]["recent_timing_robustness_demonstrated"] is False
          assert durable["development_pre2020"]["active_log_after_removing_largest_positive_episode"] > 0.0
          assert durable["post2019_reused_exploratory"]["active_log_after_removing_largest_positive_episode"] < 0.0
          print({
              "phase_b_replay_max_abs_net_return_error": generated["phase_b_replay_max_abs_net_return_error"],
              "development_leaveout_active_log": durable["development_pre2020"]["active_log_after_removing_largest_positive_episode"],
              "post2019_leaveout_active_log": durable["post2019_reused_exploratory"]["active_log_after_removing_largest_positive_episode"],
              "development_leaveout_match_error": durable["development_pre2020"]["leaveout_control_max_abs_invested_weight_mismatch"],
              "post2019_leaveout_match_error": durable["post2019_reused_exploratory"]["leaveout_control_max_abs_invested_weight_mismatch"],
          })
          PY

      - name: Generate preregistered Phase C evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-64-phase-c
          python asset_allocation_phase_c.py \
            --start 2007-01-01 \
            --output-dir generated/issue-64-phase-c
          python asset_allocation_phase_c_diagnostics.py \
            --phase-b-dir generated/issue-64-phase-b \
            --phase-c-dir generated/issue-64-phase-c
          python asset_allocation_contribution_diagnostics.py \
            --phase-dir generated/issue-64-phase-c \
            --phase-prefix phase-c

      - name: Validate Phase C regenerated evidence and final verdict contract
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m json.tool generated/issue-64-phase-c/phase-c-manifest.json > /dev/null
          python -m json.tool generated/issue-64-phase-c/phase-c-posthoc-diagnostics.json > /dev/null
          python -m json.tool generated/issue-64-phase-c/phase-c-contribution-manifest.json > /dev/null
          test -s generated/issue-64-phase-c/phase-c-incremental.csv
          test -s generated/issue-64-phase-c/phase-c-asset-contribution.csv
          test -s generated/issue-64-phase-c/phase-c-regime-allocation-contribution.csv
          test -s generated/issue-64-phase-c/phase-c-contribution-reconciliation.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          decision = json.loads(Path("decisions/issue-64-phase-c.json").read_text())
          manifest = json.loads(Path("generated/issue-64-phase-c/phase-c-manifest.json").read_text())
          diagnostics = json.loads(Path("generated/issue-64-phase-c/phase-c-posthoc-diagnostics.json").read_text())
          contribution = json.loads(Path("generated/issue-64-phase-c/phase-c-contribution-manifest.json").read_text())
          frozen = json.loads(Path("data/issue-64-outcome-prices-manifest.json").read_text())
          incremental = pd.read_csv("generated/issue-64-phase-c/phase-c-incremental.csv")
          binding = decision["regenerated_evidence_binding"]
          tol = 1e-12

          assert decision["schema_version"] >= 4
          assert manifest["issue"] == 64 and manifest["phase"] == "C"
          price = manifest["price_data"]
          assert price["source_mode"] == binding["price_source_mode"] == "committed_frozen_snapshot"
          assert price["snapshot_csv_sha256"] == binding["price_snapshot_csv_sha256"] == frozen["csv_sha256"]
          assert price["snapshot_archive_sha256"] == frozen["archive_sha256"]
          assert price["snapshot_rows"] == frozen["rows"]
          assert price["snapshot_first_date"] == frozen["first_date"]
          assert price["snapshot_last_date"] == frozen["last_date"]
          assert contribution["price_source_mode"] == binding["price_source_mode"]
          assert contribution["price_snapshot_csv_sha256"] == binding["price_snapshot_csv_sha256"]
          assert contribution["max_abs_asset_reconciliation_error"] <= tol
          assert contribution["max_abs_regime_reconciliation_error"] <= tol
          assert diagnostics["phase_c_replay_max_abs_net_return_error"] <= binding["phase_c_replay_max_abs_net_return_error_bound"]
          assert float(diagnostics["primary_cost_bps"]) == 5.0

          primary_rows = incremental.loc[
              incremental["comparison"].eq("phase_c_combined_minus_phase_b_reflation_only")
              & incremental["segment"].eq("full_reused_history")
          ]
          assert len(primary_rows) == 1
          primary = primary_rows.iloc[0]
          expected_primary = decision["primary_full_history_incremental_vs_phase_b"]
          for key in ("delta_CAGR", "delta_Sharpe", "delta_maximum_drawdown", "delta_Calmar", "delta_annualized_turnover"):
              actual = float(primary[key])
              expected = float(expected_primary[key])
              assert abs(actual - expected) <= tol, ("primary", key, actual, expected)

          for segment in ("full_reused_history", "development_pre2020", "post2019_reused_exploratory"):
              actual = diagnostics["exposure_match"][segment]
              expected = decision["realized_exposure_matched_attribution"][segment]
              assert actual["match"]["max_abs_invested_weight_mismatch"] <= binding["exposure_match_max_abs_invested_weight_mismatch_bound"]
              timing = actual["timing_delta"]
              for key in ("delta_CAGR", "delta_Sharpe", "delta_maximum_drawdown", "delta_Calmar", "delta_annualized_turnover"):
                  observed = float(timing[key])
                  durable = float(expected[key])
                  assert abs(observed - durable) <= tol, (segment, key, observed, durable)

          for segment in ("development_pre2020", "post2019_reused_exploratory"):
              actual = diagnostics["episode_concentration"][segment]
              expected = decision["episode_concentration"][segment]
              assert actual["largest_winning_episode_start"] == expected["largest_winning_episode_start"]
              assert actual["largest_winning_episode_end"] == expected["largest_winning_episode_end"]
              checks = {
                  "normal_active_log_return": actual["normal_active_log_return"],
                  "active_log_return_after_leaveout": actual["active_log_return_after_leaveout"],
                  "delta_CAGR_after_leaveout_vs_phase_b": actual["incremental_after_leaveout"]["delta_CAGR"],
                  "delta_Sharpe_after_leaveout_vs_phase_b": actual["incremental_after_leaveout"]["delta_Sharpe"],
              }
              for key, observed in checks.items():
                  durable = float(expected[key])
                  assert abs(float(observed) - durable) <= tol, (segment, key, observed, durable)
              assert actual["active_log_return_after_leaveout"] < 0.0
              assert actual["incremental_after_leaveout"]["delta_CAGR"] < 0.0
              assert actual["incremental_after_leaveout"]["delta_Sharpe"] < 0.0

          allowed = {
              "useful_for_regime_asset_allocation",
              "risk_management_value_only",
              "descriptive_cross_asset_structure_only",
              "no_material_allocation_value",
              "inconclusive_insufficient_evidence",
          }
          assert decision["verdict"] in allowed
          assert decision["verdict"] == "risk_management_value_only"
          assert decision["verdict_rationale"] == "stagflation_override_has_historical_risk_management_value_but_is_episode_concentrated"
          assert decision["decision"]["production_allocator_validated"] is False
          assert decision["decision"]["retain_as_exploratory_risk_overlay_candidate"] is True
          print({
              "final_verdict": decision["verdict"],
              "snapshot_sha256": binding["price_snapshot_csv_sha256"],
              "phase_c_replay_max_abs_net_return_error": diagnostics["phase_c_replay_max_abs_net_return_error"],
              "development_leaveout_active_log": diagnostics["episode_concentration"]["development_pre2020"]["active_log_return_after_leaveout"],
              "post2019_leaveout_active_log": diagnostics["episode_concentration"]["post2019_reused_exploratory"]["active_log_return_after_leaveout"],
          })
          PY

      - name: Validate complete Phase A/B/C durable evidence bindings
        working-directory: indicators/macro-pressure-map/research
        run: |
          python issue_64_completion_validation.py \
            --phase-a-dir generated/issue-64-phase-a \
            --phase-b-dir generated/issue-64-phase-b \
            --phase-c-dir generated/issue-64-phase-c

      - name: Upload Phase A research artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-64-phase-a
          path: indicators/macro-pressure-map/research/generated/issue-64-phase-a/
          if-no-files-found: error
          retention-days: 3

      - name: Upload Phase B research artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-64-phase-b
          path: indicators/macro-pressure-map/research/generated/issue-64-phase-b/
          if-no-files-found: error
          retention-days: 3

      - name: Upload Phase C research artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-64-phase-c
          path: indicators/macro-pressure-map/research/generated/issue-64-phase-c/
          if-no-files-found: error
          retention-days: 3
