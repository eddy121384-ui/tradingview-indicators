name: Macro Pressure Map Asset Allocation Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/asset_allocation_phase_a.py"
      - "indicators/macro-pressure-map/research/asset_allocation_phase_a_frozen.py"
      - "indicators/macro-pressure-map/research/asset_allocation_relative.py"
      - "indicators/macro-pressure-map/research/asset_allocation_phase_a_segments.py"
      - "indicators/macro-pressure-map/research/asset_allocation_phase_b.py"
      - "indicators/macro-pressure-map/research/asset_allocation_phase_b_diagnostics.py"
      - "indicators/macro-pressure-map/research/asset_allocation_phase_b_episode_diagnostics.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_phase_a.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_phase_a_frozen.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_relative.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_phase_b.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_phase_b_diagnostics.py"
      - "indicators/macro-pressure-map/research/test_asset_allocation_phase_b_episode_diagnostics.py"
      - "indicators/macro-pressure-map/research/build_issue_64_frozen_regimes.py"
      - "indicators/macro-pressure-map/research/verify_issue_64_axis_reconstruction.py"
      - "indicators/macro-pressure-map/research/data/issue-64-frozen-axis-audit.csv"
      - "indicators/macro-pressure-map/research/data/issue-64-frozen-regime-transitions.csv"
      - "indicators/macro-pressure-map/research/data/issue-64-frozen-regime-transitions-manifest.json"
      - "indicators/macro-pressure-map/research/decisions/issue-64-phase-a.json"
      - "indicators/macro-pressure-map/research/decisions/issue-64-phase-a.md"
      - "indicators/macro-pressure-map/research/decisions/issue-64-phase-b-preregistered.json"
      - "indicators/macro-pressure-map/research/decisions/issue-64-phase-b-preregistered.md"
      - "indicators/macro-pressure-map/research/issue-64-asset-allocation-spec.md"
      - ".github/workflows/macro-pressure-map-asset-allocation.yml"

permissions:
  contents: read

jobs:
  issue-64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn yfinance pytest

      - name: Run focused Issue 64 tests
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q \
            test_asset_allocation_phase_a.py \
            test_asset_allocation_phase_a_frozen.py \
            test_asset_allocation_relative.py \
            test_asset_allocation_phase_b.py \
            test_asset_allocation_phase_b_diagnostics.py \
            test_asset_allocation_phase_b_episode_diagnostics.py

      - name: Generate Phase A evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          set +e
          for attempt in 1 2 3; do
            rm -rf generated/issue-64-phase-a
            python asset_allocation_phase_a_frozen.py \
              --start 2007-01-01 \
              --output-dir generated/issue-64-phase-a
            status=$?
            if [ "$status" -eq 0 ]; then
              python asset_allocation_phase_a_segments.py \
                --output-dir generated/issue-64-phase-a
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "Phase A outcome-data attempt ${attempt} failed with exit ${status}."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit "$status"

      - name: Validate Phase A manifest
        working-directory: indicators/macro-pressure-map/research
        run: python -m json.tool generated/issue-64-phase-a/phase-a-manifest.json > /dev/null

      - name: Generate preregistered Phase B evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          set +e
          for attempt in 1 2 3; do
            rm -rf generated/issue-64-phase-b
            python asset_allocation_phase_b.py \
              --start 2007-01-01 \
              --output-dir generated/issue-64-phase-b
            status=$?
            if [ "$status" -eq 0 ]; then
              python asset_allocation_phase_b_diagnostics.py \
                --phase-b-dir generated/issue-64-phase-b
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              python asset_allocation_phase_b_episode_diagnostics.py \
                --phase-b-dir generated/issue-64-phase-b
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "Phase B outcome-data/diagnostic attempt ${attempt} failed with exit ${status}."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit "$status"

      - name: Validate Phase B evidence JSON
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m json.tool generated/issue-64-phase-b/phase-b-manifest.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-posthoc-exposure-match.json > /dev/null
          python -m json.tool generated/issue-64-phase-b/phase-b-posthoc-timing-concentration.json > /dev/null

      - name: Upload Phase A research artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-64-phase-a
          path: indicators/macro-pressure-map/research/generated/issue-64-phase-a/
          if-no-files-found: error
          retention-days: 3

      - name: Upload Phase B research artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-64-phase-b
          path: indicators/macro-pressure-map/research/generated/issue-64-phase-b/
          if-no-files-found: error
          retention-days: 3
