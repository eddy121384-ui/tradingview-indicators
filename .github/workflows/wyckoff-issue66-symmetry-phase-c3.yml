name: Wyckoff Issue 66 Symmetry Phase C3

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c3_residual_forensic.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c3_residual_forensic.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_c2_stage14_conflict_core.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c3-residual-forensic-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c3.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c3_residual_forensic.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c3_residual_forensic.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c3-residual-forensic-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase-c3-residual-forensic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile Phase C3 forensic
        run: |
          python -m py_compile diagnose_issue66_phase_c3_residual_forensic.py
          python -m py_compile test_issue66_phase_c3_residual_forensic.py
      - name: Reconfirm accepted Phase C2 contract
        run: python -m unittest -v test_issue66_phase_c2_stage14_conflict
      - name: Run Phase C3 residual forensic contract
        run: python -m unittest -v test_issue66_phase_c3_residual_forensic
      - name: Run Phase C3 residual forensic
        run: |
          python diagnose_issue66_phase_c3_residual_forensic.py \
            --json reports/issue-66-phase-c3-residual-forensic.json \
            --markdown reports/issue-66-phase-c3-residual-forensic.md
          cat reports/issue-66-phase-c3-residual-forensic.md
      - name: Commit Phase C3 reports on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-66-wyckoff-directional-symmetry-repair'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c3-residual-forensic.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c3-residual-forensic.md
          if git diff --cached --quiet; then
            echo "No Issue 66 Phase C3 report changes to commit"
          else
            git commit -m "research: record Issue 66 Phase C3 residual forensic [skip ci]"
            git push
          fi
