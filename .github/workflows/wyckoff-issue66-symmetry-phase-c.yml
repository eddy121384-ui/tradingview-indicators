name: Wyckoff Issue 66 Symmetry Phase C

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization_v2.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization_v3.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c_persistence_localization.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_b7_stage14_gate_core.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_b7_stage14_gate.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_b7_stage14_gate.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c-persistence-localization-plan.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c-persistence-contract-correction.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization_v2.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization_v3.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c_persistence_localization.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c-persistence-localization-plan.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c-persistence-contract-correction.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase-c-persistence-localization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile Phase C diagnostic
        run: |
          python -m py_compile diagnose_issue66_phase_c_persistence_localization.py
          python -m py_compile diagnose_issue66_phase_c_persistence_localization_v2.py
          python -m py_compile diagnose_issue66_phase_c_persistence_localization_v3.py
          python -m py_compile test_issue66_phase_c_persistence_localization.py
      - name: Reconfirm accepted Phase B7 contract
        run: python -m unittest -v test_issue66_phase_b7_stage14_gate
      - name: Run Phase C localization contract
        run: python -m unittest -v test_issue66_phase_c_persistence_localization
      - name: Run Phase C Candidate-to-Formal localization
        run: |
          python diagnose_issue66_phase_c_persistence_localization_v3.py \
            --json reports/issue-66-phase-c-persistence-localization.json \
            --markdown reports/issue-66-phase-c-persistence-localization.md
          cat reports/issue-66-phase-c-persistence-localization.md
      - name: Commit Phase C reports on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-66-wyckoff-directional-symmetry-repair'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c-persistence-localization.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c-persistence-localization.md
          if git diff --cached --quiet; then
            echo "No Issue 66 Phase C report changes to commit"
          else
            git commit -m "research: record Issue 66 Phase C persistence localization [skip ci]"
            git push
          fi
