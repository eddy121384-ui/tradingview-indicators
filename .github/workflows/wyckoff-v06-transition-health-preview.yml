name: Wyckoff v0.6 Transition Health Visual Preview

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/transition_health_online.py'
      - 'indicators/wyckoff-regime-radar/research/test_transition_health_online.py'
      - 'indicators/wyckoff-regime-radar/research/verify_transition_health_online_parity.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/finalize_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/test_generate_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-visual-preview-contract.md'
      - 'indicators/wyckoff-regime-radar/research/data/issue-57-transition-health-independent-oos-manifest.json'
      - 'indicators/wyckoff-regime-radar/research/data/issue-57-transition-health-oos-*.csv'
      - '.github/workflows/wyckoff-v06-transition-health-preview.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/transition_health_online.py'
      - 'indicators/wyckoff-regime-radar/research/test_transition_health_online.py'
      - 'indicators/wyckoff-regime-radar/research/verify_transition_health_online_parity.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/finalize_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/test_generate_v06_transition_health_preview_pine.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-visual-preview-contract.md'
      - '.github/workflows/wyckoff-v06-transition-health-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transition-health-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-57-wyckoff-v0.6-robustness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile preview tooling
        run: |
          python -m py_compile transition_health_online.py
          python -m py_compile verify_transition_health_online_parity.py
          python -m py_compile generate_v06_transition_health_preview_pine.py
          python -m py_compile finalize_v06_transition_health_preview_pine.py
          python -m py_compile test_transition_health_online.py
          python -m py_compile test_generate_v06_transition_health_preview_pine.py
      - name: Run frozen-contract tests
        run: |
          python -m unittest -v \
            test_transition_health_online \
            test_generate_v06_transition_health_preview_pine
      - name: Verify online state against frozen research extractor
        run: |
          python verify_transition_health_online_parity.py \
            --json-output reports/issue-57-transition-health-online-parity.json \
            --md-output reports/issue-57-transition-health-online-parity.md
      - name: Generate full TradingView visual preview
        run: |
          python finalize_v06_transition_health_preview_pine.py \
            --output generated/wyckoff-issue-57-v06-transition-health-preview.pine
          grep -F 'if na(v06ThContextWeightNow) or na(v06ThCarriedWeightNow) or not (v06ThCarriedWeightNow > v06ThContextWeightNow)' generated/wyckoff-issue-57-v06-transition-health-preview.pine
          if grep -Fq 'if not na(v06ThContextWeightNow) and not na(v06ThCarriedWeightNow) and v06ThContextWeightNow >= v06ThCarriedWeightNow' generated/wyckoff-issue-57-v06-transition-health-preview.pine; then
            echo 'stale undefined-lead semantics remain in generated Pine' >&2
            exit 1
          fi
      - name: Commit generated preview and parity evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-57-v06-transition-health-preview.pine
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-health-online-parity.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-health-online-parity.md
          if git diff --cached --quiet; then
            echo "No generated Transition Health changes to commit"
          else
            git commit -m "research: generate Transition Health visual preview"
            git push origin HEAD:feat/issue-57-wyckoff-v0.6-robustness
          fi