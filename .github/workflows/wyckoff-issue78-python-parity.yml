name: Wyckoff Issue 78 Python parity export

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-python-parity.yml'
      - 'indicators/wyckoff-regime-radar/research/generate_issue78_python_parity_export_pine.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_python_parity_export.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue78_rc_python.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_rc_python.py'
      - 'indicators/wyckoff-regime-radar/research/compare_issue78_python_parity.py'
      - 'indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-python-parity-export.pine'
      - 'indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-rc-python.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-python-classifier-parity-plan.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas pytest

      - name: Syntax checks
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/generate_issue78_python_parity_export_pine.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_python_parity_export.py
          python -m py_compile indicators/wyckoff-regime-radar/research/generate_issue78_rc_python.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_rc_python.py
          python -m py_compile indicators/wyckoff-regime-radar/research/compare_issue78_python_parity.py

      - name: Regenerate parity Pine
        run: python indicators/wyckoff-regime-radar/research/generate_issue78_python_parity_export_pine.py

      - name: Generate Python RC mirror
        run: python indicators/wyckoff-regime-radar/research/generate_issue78_rc_python.py

      - name: Parity engineering tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m pytest -q test_issue78_python_parity_export.py
          python -m pytest -q test_issue78_rc_python.py

      - name: Generated Pine is committed and current
        run: |
          git diff --exit-code -- indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-python-parity-export.pine
          git diff --check

      - name: Commit generated Python RC mirror when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue78-rc-python.py
          if git diff --cached --quiet; then
            echo 'Generated Python RC mirror already current.'
          else
            git commit -m 'research: generate Issue #78 Python RC mirror [skip ci]'
            git push
          fi
