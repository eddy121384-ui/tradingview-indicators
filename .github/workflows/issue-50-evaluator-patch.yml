name: Apply Issue 50 Evaluator Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-evaluator-patch.yml
      - indicators/hidden-regime-map/research/evaluate_rates_utility.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Repair evaluator source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('indicators/hidden-regime-map/research/evaluate_rates_utility.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'turnover = (position - prior).abs().sum(axis=1)': 'turnover = 0.5 * (position - prior).abs().sum(axis=1)',
              'return "\\\n".join(lines)': 'return chr(10).join(lines)',
              '+ "\\\n", encoding="utf-8"': '+ chr(10), encoding="utf-8"',
              'lineterminator="\\\n",': 'lineterminator=chr(10),',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement count for {old!r}: {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile indicators/hidden-regime-map/research/evaluate_rates_utility.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_rates_utility.py
          git commit -m "Repair Issue 50 evaluator source"
          git push origin HEAD:research/issue-50-rates-regime-utility
