name: Apply Issue 50 Evaluator Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-evaluator-patch.yml
      - indicators/hidden-regime-map/research/evaluate_rates_utility.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Apply portfolio turnover definition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('indicators/hidden-regime-map/research/evaluate_rates_utility.py')
          text = path.read_text(encoding='utf-8')
          old = 'turnover = (position - prior).abs().sum(axis=1)'
          new = 'turnover = 0.5 * (position - prior).abs().sum(axis=1)'
          if text.count(old) != 1:
              raise SystemExit(f'turnover replacement count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile indicators/hidden-regime-map/research/evaluate_rates_utility.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_rates_utility.py
          git commit -m "Define Issue 50 portfolio turnover"
          git push origin HEAD:research/issue-50-rates-regime-utility
