name: Apply Issue 50 Stability Promotion Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-stability-promotion-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Exclude unstable candidates from promotion
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator = Path('indicators/hidden-regime-map/research/evaluate_rates_utility.py')
          text = evaluator.read_text(encoding='utf-8')

          evaluate_anchor = 'def evaluate(panel: pd.DataFrame, input_sha: str) -> dict[str, Any]:\n'
          if text.count(evaluate_anchor) != 1:
              raise SystemExit(f'evaluate anchor count: {text.count(evaluate_anchor)}')
          helper = '''def state_occupancy_stable(
              fit_occupancy: list[float],
              final_occupancy: list[float],
              threshold: float = 0.01,
          ) -> bool:
              values = np.asarray([*fit_occupancy, *final_occupancy], dtype=float)
              return bool(
                  values.size > 0
                  and np.isfinite(values).all()
                  and float(values.min()) >= threshold
              )


          '''.replace('          ', '')
          text = text.replace(evaluate_anchor, helper + evaluate_anchor)

          old_stability = '''        final_occ = occupancy(ensemble["posterior"], slices["final_oos"])
              fit_occ = occupancy(ensemble["posterior"], slice(0, fit_end))
              if min(final_occ) < 0.01 or min(fit_occ) < 0.01:
                  unstable_candidates.append(candidate)
          '''.replace('          ', '')
          new_stability = '''        final_occ = occupancy(ensemble["posterior"], slices["final_oos"])
              fit_occ = occupancy(ensemble["posterior"], slice(0, fit_end))
              candidate_stable = state_occupancy_stable(fit_occ, final_occ)
              if not candidate_stable:
                  unstable_candidates.append(candidate)
          '''.replace('          ', '')
          if text.count(old_stability) != 1:
              raise SystemExit(f'stability replacement count: {text.count(old_stability)}')
          text = text.replace(old_stability, new_stability)

          old_winners = '''        if len(trading_passes) >= 2:
              trading_winners[candidate] = trading_passes
          if len(risk_passes) >= 2:
              risk_winners[candidate] = risk_passes
          '''.replace('          ', '')
          new_winners = '''        if candidate_stable and len(trading_passes) >= 2:
              trading_winners[candidate] = trading_passes
          if candidate_stable and len(risk_passes) >= 2:
              risk_winners[candidate] = risk_passes
          '''.replace('          ', '')
          if text.count(old_winners) != 1:
              raise SystemExit(f'winner replacement count: {text.count(old_winners)}')
          evaluator.write_text(text.replace(old_winners, new_winners), encoding='utf-8')

          tests = Path('indicators/hidden-regime-map/research/test_evaluate_rates_utility.py')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '    def test_trading_gate_requires_return_and_sharpe(self) -> None:\n'
          if test_text.count(anchor) != 1:
              raise SystemExit(f'test anchor count: {test_text.count(anchor)}')
          addition = '''    def test_state_occupancy_stability_threshold(self) -> None:
              self.assertTrue(
                  utility.state_occupancy_stable(
                      [0.01, 0.40, 0.59], [0.20, 0.30, 0.50]
                  )
              )
              self.assertFalse(
                  utility.state_occupancy_stable(
                      [0.0099, 0.40, 0.5901], [0.20, 0.30, 0.50]
                  )
              )
              self.assertFalse(
                  utility.state_occupancy_stable(
                      [0.10, float("nan"), 0.90], [0.20, 0.30, 0.50]
                  )
              )


          '''.replace('          ', '')
          tests.write_text(test_text.replace(anchor, addition + anchor), encoding='utf-8')
          PY
          python -m py_compile \
            indicators/hidden-regime-map/research/evaluate_rates_utility.py \
            indicators/hidden-regime-map/research/test_evaluate_rates_utility.py

      - name: Commit stability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_rates_utility.py \
                  indicators/hidden-regime-map/research/test_evaluate_rates_utility.py
          git commit -m "Exclude unstable rates candidates from promotion"
          git push origin HEAD:research/issue-50-rates-regime-utility
