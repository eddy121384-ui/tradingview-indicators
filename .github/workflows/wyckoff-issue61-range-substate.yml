name: Wyckoff Issue 61 Range Substate

on:
  push:
    branches:
      - research/issue-61-stage-aware-position-lifecycle
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_stage_lifecycle_range_substate.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_stage_lifecycle_range_substate.py'
      - '.github/workflows/wyckoff-issue61-range-substate.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_stage_lifecycle_range_substate.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_stage_lifecycle_range_substate.py'
      - '.github/workflows/wyckoff-issue61-range-substate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  range-substate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile audit
        run: |
          python -m py_compile diagnose_stage_lifecycle_range_substate.py
          python -m py_compile test_diagnose_stage_lifecycle_range_substate.py
      - name: Run contract tests
        run: python -m unittest -v test_diagnose_stage_lifecycle_range_substate
      - name: Run rangeScore substate audit
        run: |
          python diagnose_stage_lifecycle_range_substate.py \
            --json-output reports/issue-61-stage-lifecycle-range-substate.json \
            --md-output reports/issue-61-stage-lifecycle-range-substate.md
      - name: Commit report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-61-stage-aware-position-lifecycle'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-stage-lifecycle-range-substate.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-stage-lifecycle-range-substate.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record Issue #61 rangeScore substate audit"
            git push
          fi
