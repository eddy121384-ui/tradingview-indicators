name: Wyckoff Issue 66 Symmetry Phase B4 PreAudit

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_b4_raw_stage_pre_audit.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_b4_raw_stage_pre_audit.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_b3_trend_entry_gate_core.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_b3_trend_entry_gate.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_b3_trend_entry_gate.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-b4-raw-stage-preaudit-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-b4-preaudit.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_b4_raw_stage_pre_audit.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_b4_raw_stage_pre_audit.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-b4-raw-stage-preaudit-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-b4-preaudit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase-b4-raw-stage-preaudit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile Phase B4 pre-audit
        run: |
          python -m py_compile diagnose_issue66_phase_b4_raw_stage_pre_audit.py
          python -m py_compile test_issue66_phase_b4_raw_stage_pre_audit.py
      - name: Reconfirm accepted Phase B3 contract
        run: python -m unittest -v test_issue66_phase_b3_trend_entry_gate
      - name: Run Phase B4 decomposition contract
        run: python -m unittest -v test_issue66_phase_b4_raw_stage_pre_audit
      - name: Run Phase B4 residual localization
        run: |
          python diagnose_issue66_phase_b4_raw_stage_pre_audit.py \
            --json reports/issue-66-phase-b4-raw-stage-preaudit.json \
            --markdown reports/issue-66-phase-b4-raw-stage-preaudit.md
          cat reports/issue-66-phase-b4-raw-stage-preaudit.md
      - name: Commit Phase B4 report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-66-wyckoff-directional-symmetry-repair'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-b4-raw-stage-preaudit.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-b4-raw-stage-preaudit.md
          if git diff --cached --quiet; then
            echo "No Issue 66 Phase B4 report changes to commit"
          else
            git commit -m "research: record Issue 66 Phase B4 raw-stage pre-audit [skip ci]"
            git push
          fi
