name: Macro Pressure Map Issue 95 Phase 3 Overlay Evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_95_phase3_*"
      - "indicators/macro-pressure-map/research/test_issue_95_phase3_*"
      - "indicators/macro-pressure-map/research/decisions/issue-95-phase3-*"
      - ".github/workflows/macro-pressure-map-issue-95-phase3.yml"

permissions:
  contents: read

jobs:
  phase3-overlay-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Phase 3 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "pandas==3.0.5" "lxml==6.1.3" "openpyxl==3.1.5" "pytest==9.1.1"
      - name: Revalidate preregistration
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_95_phase3_prereg.py
      - name: Run Phase 3 unit tests
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_95_phase3_inflation_overlay.py
      - name: Generate Phase 3 evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-95-phase3
          python issue_95_phase3_inflation_overlay.py --output-dir generated/issue-95-phase3
      - name: Enforce research boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/issue-95-phase3/issue-95-manifest.json").read_text())
          assert m["preregistration_preceded_outcomes"] is True
          assert m["hmra_freeze_validated"] is True
          assert m["production_v66_modified"] is False
          assert m["hmra_modified"] is False
          assert m["base_policy_modified"] is False
          assert m["etfs_used"] is False
          assert m["sample"]["first_return_year"]==1975
          assert m["sample"]["last_return_year"]==2025
          assert m["sample"]["years"]==51
          assert m["primary"]=={"threshold_pct":4.0,"redirect_fraction":0.5,"cost_bps":5.0}
          assert m["matched_static_max_abs_exposure_mismatch"] <= 1e-9
          print(m["sample"])
          print(m["primary_deltas"])
          print(m["episode_concentration"])
          PY
      - name: Validate durable Phase 3 finding
        working-directory: indicators/macro-pressure-map/research
        run: python issue_95_phase3_completion_validation.py --evidence-dir generated/issue-95-phase3
      - name: Upload Phase 3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-95-phase3-overlay
          path: indicators/macro-pressure-map/research/generated/issue-95-phase3
          retention-days: 3
          if-no-files-found: error
