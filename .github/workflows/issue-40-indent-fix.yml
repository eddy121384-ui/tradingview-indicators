name: Apply Issue 40 Indent Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-40-indent-fix.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-40-trading-utility

      - name: Fix evaluator indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("indicators/hidden-regime-map/research/evaluate_trading_utility.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '        for _, episode in active_frame.groupby("episode_id", sort=True):\n'
          end_marker = '        completed_round_trips += 1\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = "\n".join([
              '        for _, episode in active_frame.groupby("episode_id", sort=True):',
              '            first_location = int(frame.index.get_indexer([episode.index[0]])[0])',
              '            last_location = int(frame.index.get_indexer([episode.index[-1]])[0])',
              '            episode_growth = float((1.0 + episode["net_return"]).prod())',
              '            if last_location < len(frame) - 1 and float(position.iloc[last_location + 1]) <= 0.0:',
              '                episode_growth *= 1.0 + float(frame["net_return"].iloc[last_location + 1])',
              '            episode_returns.append(episode_growth - 1.0)',
              '            episode_days.append(int(len(episode)))',
              '            if first_location > 0 and last_location < len(frame) - 1:',
              '                completed_round_trips += 1',
              '',
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Commit syntax fix
        run: |
          python -m py_compile indicators/hidden-regime-map/research/evaluate_trading_utility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_trading_utility.py
          git commit -m "Fix Issue 40 episode indentation"
          git push origin HEAD:research/issue-40-trading-utility
