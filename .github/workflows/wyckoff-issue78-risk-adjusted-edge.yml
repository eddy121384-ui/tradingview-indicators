name: Wyckoff Issue 78 risk-adjusted edge

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-risk-adjusted-edge.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_risk_adjusted_edge.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-risk-adjusted-edge-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-risk-adjusted-edge-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-risk-adjusted-edge-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check analyzer
        run: python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_risk_adjusted_edge.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_risk_adjusted_edge.py
          grep -F "EXPECTED_EVENTS=68118" "$FILE"
          grep -F "EXPECTED_EPISODES=1624" "$FILE"
          grep -F '"formal_hold"' "$FILE"
          grep -F '"progressive_warning"' "$FILE"
          grep -F "equal_vol_scale_vs_formal" "$FILE"
          git diff --check
