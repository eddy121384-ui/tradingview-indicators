name: Apply Issue 50 History Accuracy Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-history-accuracy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Separate pre-result and post-result rules
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('indicators/hidden-regime-map/research/issue-50-rates-experiment-spec.md')
          text = spec.read_text(encoding='utf-8')
          text = text.replace(
              '- does not allow an unstable candidate to enter `trading_winners` or `risk_winners`.\n',
              '',
          )
          anchor = '### Interpretation consequence\n'
          safeguard = '''### Post-result promotion safeguard

          After the first formal result was observed, review identified a general evaluator defect: if only one candidate were unstable, that candidate could still enter `trading_winners` or `risk_winners`. The evaluator was corrected to exclude every unstable candidate from promotion while still allowing a stable peer to be evaluated.

          This safeguard was added after result observation. It did not change the current Issue #50 output because both candidates are unstable and both winner dictionaries were already empty. It is not part of the frozen pre-result rule set and must not be described as preregistered.

          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit(f'spec interpretation anchor count: {text.count(anchor)}')
          text = text.replace(anchor, safeguard + anchor)
          old_list = '''1. **Frozen evaluator outcome:** applies both implementation-frozen rule sets.
          2. **Frozen implementation without the occupancy override:** retains the numerical exploratory-contradiction rules but ignores the 1% instability classification.
          3. **Original written-spec outcome:** indeterminate because both “instability” and “material contradiction” lacked complete numerical definitions.
          '''.replace('          ', '')
          new_list = '''1. **Frozen pre-result evaluator outcome:** applies the implementation-frozen occupancy classification and exploratory-contradiction rules.
          2. **Current corrected evaluator outcome:** adds the post-result safeguard excluding isolated unstable winners; it produces the same result on this sample.
          3. **Frozen implementation without the occupancy override:** retains the numerical exploratory-contradiction rules but ignores the 1% instability classification.
          4. **Original written-spec outcome:** indeterminate because both “instability” and “material contradiction” lacked complete numerical definitions.
          '''.replace('          ', '')
          if text.count(old_list) != 1:
              raise SystemExit(f'spec interpretation list count: {text.count(old_list)}')
          spec.write_text(text.replace(old_list, new_list), encoding='utf-8')

          diagnosis = Path('indicators/hidden-regime-map/research/decisions/issue-50-rates-static-fit-diagnosis.md')
          text = diagnosis.read_text(encoding='utf-8')
          anchor = 'Neither rule was introduced after final-period observation, but the written protocol cannot independently reproduce the classification.'
          addition = '''The rule excluding an individually unstable candidate from winner qualification was added later as a post-result safety correction. It does not alter this sample because both candidates are unstable and the winner dictionaries were already empty. It is not included among the frozen pre-result rules.

          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit(f'diagnosis protocol anchor count: {text.count(anchor)}')
          text = text.replace(anchor, addition + anchor)
          text = text.replace(
              '- neither candidate beat at least two strong baselines under the written promotion gates;',
              '- under the frozen implementation’s numerical exploratory-contradiction rules, neither candidate retained at least two qualified passes; raw final gates alone gave K=3 three trading passes and two risk passes, and K=4 two of each, so the original written specification remains indeterminate;',
          )
          text = text.replace(
              '- an unstable candidate cannot enter `trading_winners` or `risk_winners`, even when another candidate remains stable;',
              '- a post-result safety correction now prevents an unstable candidate from entering `trading_winners` or `risk_winners`, even when another candidate remains stable; this did not alter the current result;',
          )
          diagnosis.write_text(text, encoding='utf-8')
          PY

      - name: Commit history correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/issue-50-rates-experiment-spec.md \
                  indicators/hidden-regime-map/research/decisions/issue-50-rates-static-fit-diagnosis.md
          git commit -m "Separate Issue 50 pre-result and post-result rules"
          git push origin HEAD:research/issue-50-rates-regime-utility
