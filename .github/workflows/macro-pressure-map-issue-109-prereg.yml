name: Macro Pressure Map Issue 109 Action Layer Prereg

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/decisions/issue-109-*"
      - "indicators/macro-pressure-map/research/test_issue_109_*.py"
      - ".github/workflows/macro-pressure-map-issue-109-prereg.yml"

permissions:
  contents: read

jobs:
  prereg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install pytest
        run: python -m pip install "pytest==9.1.1"

      - name: Validate Issue 109 preregistration
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_109_action_layer_prereg.py

      - name: Validate JSON source contract
        working-directory: indicators/macro-pressure-map/research
        run: python -m json.tool decisions/issue-109-phase-a0-source-contract.json > /dev/null
