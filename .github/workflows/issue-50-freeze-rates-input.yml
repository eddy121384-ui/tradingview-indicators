name: Freeze Issue 50 Rates Input

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-freeze-rates-input.yml

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Download acquisition artifact from Run 7
        uses: actions/download-artifact@v4
        with:
          name: issue-50-rates-utility
          path: frozen-artifact
          github-token: ${{ github.token }}
          repository: eddy121384-ui/tradingview-indicators
          run-id: 30782628320

      - name: Verify and stage frozen files
        run: |
          test -f frozen-artifact/input/issue-50-rates-2007-2026.csv.gz
          test -f frozen-artifact/input/issue-50-rates-2007-2026.sha256
          test -f frozen-artifact/input/issue-50-rates-manifest.json
          python - <<'PY'
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('frozen-artifact/input')
          expected = (root / 'issue-50-rates-2007-2026.sha256').read_text(encoding='utf-8').split()[0]
          digest = hashlib.sha256()
          with gzip.open(root / 'issue-50-rates-2007-2026.csv.gz', 'rb') as handle:
              while chunk := handle.read(1024 * 1024):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f'candidate rates SHA mismatch: {expected} != {actual}')
          if actual != 'f85a37d574f58ed927c1b490f14d0057a2f1c295c7061cf2a5d08b433995c104':
              raise SystemExit(f'unexpected acquisition digest: {actual}')
          print(actual)
          PY
          mkdir -p indicators/hidden-regime-map/research/data
          cp frozen-artifact/input/issue-50-rates-2007-2026.csv.gz \
             indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026.csv.gz
          cp frozen-artifact/input/issue-50-rates-2007-2026.sha256 \
             indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026.sha256
          cp frozen-artifact/input/issue-50-rates-manifest.json \
             indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026-manifest.json

      - name: Commit frozen input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026.csv.gz \
                  indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026.sha256 \
                  indicators/hidden-regime-map/research/data/issue-50-rates-2007-2026-manifest.json
          git commit -m "Freeze Issue 50 rates input"
          git push origin HEAD:research/issue-50-rates-regime-utility
