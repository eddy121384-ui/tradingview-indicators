name: Macro Pressure Map Issue 101 State Dependent Reaction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_101_*"
      - "indicators/macro-pressure-map/research/test_issue_101_*"
      - "indicators/macro-pressure-map/research/decisions/issue-101-*"
      - ".github/workflows/macro-pressure-map-issue-101.yml"
permissions:
  contents: read
jobs:
  state-dependent-reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install "numpy==2.4.6" "pandas==3.0.5" "openpyxl==3.1.5" "pytest==9.1.1"
      - name: Revalidate prereg
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_101_prereg.py
      - name: Unit tests
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_101_state_dependent_policy_reaction.py
      - name: Generate Issue 101 evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-101
          python issue_101_state_dependent_policy_reaction.py --output-dir generated/issue-101
      - name: Enforce boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/issue-101/issue-101-manifest.json").read_text())
          assert m["preregistration_preceded_outcomes"] is True
          assert m["treasury_outcomes_loaded"] is False
          assert m["portfolio_results_computed"] is False
          assert m["production_v66_modified"] is False
          assert m["oos"]["forecast_origins"]==426
          assert m["oos"]["identical_proxy_effr_samples"] is True
          print(m["proxy_primary_deltas"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-101-state-dependent-reaction
          path: indicators/macro-pressure-map/research/generated/issue-101
          retention-days: 3
