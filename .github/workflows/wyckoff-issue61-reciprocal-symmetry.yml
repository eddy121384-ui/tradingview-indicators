name: Wyckoff Issue 61 Reciprocal Symmetry Audit

on:
  push:
    branches:
      - research/issue-61-stage-aware-position-lifecycle
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_v06_reciprocal_symmetry_v2.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_v06_reciprocal_symmetry.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py'
      - 'indicators/wyckoff-regime-radar/research/v06_boundary_scores.py'
      - 'indicators/wyckoff-regime-radar/research/price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-canonical-manifest.json'
      - 'indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-*'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-61-reciprocal-symmetry-audit-freeze.md'
      - '.github/workflows/wyckoff-issue61-reciprocal-symmetry.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_v06_reciprocal_symmetry_v2.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_v06_reciprocal_symmetry.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py'
      - 'indicators/wyckoff-regime-radar/research/v06_boundary_scores.py'
      - 'indicators/wyckoff-regime-radar/research/price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-canonical-manifest.json'
      - 'indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-*'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-61-reciprocal-symmetry-audit-freeze.md'
      - '.github/workflows/wyckoff-issue61-reciprocal-symmetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reciprocal-symmetry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile diagnostic and tests
        run: |
          python -m py_compile diagnose_v06_reciprocal_symmetry_v2.py
          python -m py_compile test_diagnose_v06_reciprocal_symmetry.py
      - name: Run reciprocal symmetry contract tests
        run: python -m unittest -v test_diagnose_v06_reciprocal_symmetry
      - name: Run frozen reciprocal symmetry audit
        run: |
          python diagnose_v06_reciprocal_symmetry_v2.py \
            --json reports/issue-61-v06-reciprocal-symmetry.json \
            --markdown reports/issue-61-v06-reciprocal-symmetry.md
          cat reports/issue-61-v06-reciprocal-symmetry.md
      - name: Commit diagnostic report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-61-stage-aware-position-lifecycle'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-v06-reciprocal-symmetry.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-v06-reciprocal-symmetry.md
          if git diff --cached --quiet; then
            echo "No reciprocal symmetry report changes to commit"
          else
            git commit -m "research: record Issue 61 reciprocal symmetry audit"
            git push
          fi
