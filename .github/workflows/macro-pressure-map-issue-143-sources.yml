name: Macro Pressure Map Issue 143 IPI Sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_143_ipi_source_acquisition.py"
      - ".github/workflows/macro-pressure-map-issue-143-sources.yml"

permissions:
  contents: read

jobs:
  ipi-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Issue 143 branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy requests beautifulsoup4 openpyxl yfinance
      - name: Static validation
        run: python -m py_compile indicators/macro-pressure-map/research/issue_143_ipi_source_acquisition.py
      - name: Acquire signal inputs only
        run: |
          rm -rf indicators/macro-pressure-map/research/generated/issue-143-source
          python indicators/macro-pressure-map/research/issue_143_ipi_source_acquisition.py \
            --output-dir indicators/macro-pressure-map/research/generated/issue-143-source
      - name: Firewall assertion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("indicators/macro-pressure-map/research/generated/issue-143-source/issue-143-source-manifest.json")
          r=json.loads(p.read_text())
          assert r["exact_v66_signal_loaded"] is False
          assert r["outcome_data_loaded"] is False
          PY
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-143-ipi-source-snapshot
          path: indicators/macro-pressure-map/research/generated/issue-143-source
          retention-days: 3
          if-no-files-found: error
