name: Wyckoff Issue 68 Phase B3.4R A-vs-C Resume

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b34_exposure_bakeoff_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b34r_ac_resume_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_b34_exposure_bakeoff_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b34-resume-ac-semantic-preregistration.md"
      - ".github/workflows/wyckoff-issue68-phase-b34r-ac-resume.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b34r_ac_resume_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b34-resume-ac-semantic-preregistration.md"
      - ".github/workflows/wyckoff-issue68-phase-b34r-ac-resume.yml"

permissions:
  contents: write

jobs:
  ac-resume-static-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile B3.4/B3.4R tooling
        run: |
          python -m py_compile generate_issue68_phase_b34_exposure_bakeoff_audit_pine.py
          python -m py_compile generate_issue68_phase_b34r_ac_resume_audit_pine.py
          python -m py_compile test_issue68_phase_b34_exposure_bakeoff_audit_pine.py
      - name: Preserve original B3.4 contracts
        run: python -m unittest -v test_issue68_phase_b34_exposure_bakeoff_audit_pine
      - name: Generate B3.4R TradingView audit Pine
        run: |
          python generate_issue68_phase_b34r_ac_resume_audit_pine.py \
            --output generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          test -s generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          grep -q 'Issue #68 B3.4R resumed human semantic gate' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          grep -q 'A Formal-family exposure' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          grep -q 'B Flat-Action exposure' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          grep -q 'C Stateful exposure' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          grep -q 'showIssue68B34B = input.bool(false' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          ! grep -q 'strategy\.' generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          echo 'B3.4R A-vs-C resume Pine contract PASS'
      - name: Commit B3.4R artifact on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-phase-b34r-ac-resume-audit.pine
          if git diff --cached --quiet; then
            echo "B3.4R artifact already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 B3.4R A-vs-C resume audit [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
