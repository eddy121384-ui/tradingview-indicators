name: Wyckoff v0.6 Phase C State Cardinality

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_state_cardinality.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_state_cardinality.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_c_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.*"
      - ".github/workflows/wyckoff-v06-phase-c.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_state_cardinality.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_state_cardinality.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_c_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.*"
      - ".github/workflows/wyckoff-v06-phase-c.yml"

permissions:
  contents: write

jobs:
  state-cardinality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Phase C modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/diagnose_v06_state_cardinality.py \
            indicators/wyckoff-regime-radar/research/test_diagnose_v06_state_cardinality.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_c_report.py
      - name: Run Phase C mapping tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m unittest -v test_diagnose_v06_state_cardinality
      - name: Generate deterministic Phase C report
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/reports
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_c_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_c_report.py \
            --json-output /tmp/issue-57-phase-c-state-cardinality.json \
            --md-output /tmp/issue-57-phase-c-state-cardinality.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.json /tmp/issue-57-phase-c-state-cardinality.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.md /tmp/issue-57-phase-c-state-cardinality.md
      - name: Commit Phase C report on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-c-state-cardinality.md
          if git diff --cached --quiet; then
            echo "Issue #57 Phase C report already current."
          else
            git commit -m "Record Issue #57 Phase C state-cardinality audit"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
