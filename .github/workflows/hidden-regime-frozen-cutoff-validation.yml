name: Hidden Regime Frozen Cutoff Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - indicators/hidden-regime-map/research/check_k8_cutoff_stability.py
      - indicators/hidden-regime-map/research/test_check_k8_cutoff_stability.py
      - .github/workflows/hidden-regime-frozen-cutoff-validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-spy-cutoffs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: indicators/hidden-regime-map/requirements-research.txt

      - name: Install research dependencies
        run: python -m pip install -r indicators/hidden-regime-map/requirements-research.txt

      - name: Run focused tests
        run: python -m unittest discover -s indicators/hidden-regime-map/research -p 'test_check_k8_cutoff_stability.py'

      - name: Download frozen Run 58 SPY artifact
        uses: actions/download-artifact@v4
        with:
          name: hidden-regime-SPY
          path: frozen-run58
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: eddy121384-ui/tradingview-indicators
          run-id: 30077475634

      - name: Verify frozen input
        run: |
          test -f frozen-run58/ohlc.csv
          echo "016448a0492769c527a8dc8e24d60fbda4c4e0e4bbdbcf27506caf30b76dddc4  frozen-run58/ohlc.csv" | sha256sum --check

      - name: Run expanded restart cutoff gate
        run: |
          mkdir -p frozen-result
          python indicators/hidden-regime-map/research/check_k8_cutoff_stability.py \
            --input frozen-run58/ohlc.csv \
            --output-dir frozen-result \
            --symbol SPY \
            --timeframe 1D \
            --cutoffs 5 \
            | tee frozen-result/run.log

      - name: Verify audit completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("frozen-result/k8-cutoff-stability.json").read_text())
          attempts = sum(
              len(group["restart_attempts"])
              for cutoff in result["cutoffs"]
              if cutoff["status"] == "ok"
              for group in cutoff["seed_diagnostics"]
          )
          if attempts != 135:
              raise SystemExit(f"expected 135 retained attempts, got {attempts}")
          if result["method"]["restart_offsets"] != list(range(9)):
              raise SystemExit("restart offsets are not the frozen [0..8] schedule")
          if result["scope"]["seeds"] != [42, 84, 126]:
              raise SystemExit("seed groups are not the frozen [42,84,126] sequence")
          print(json.dumps(result["decision"], indent=2))
          PY

      - name: Write workflow summary
        if: always()
        run: |
          if [ -f frozen-result/k8-cutoff-stability.md ]; then
            cat frozen-result/k8-cutoff-stability.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-regime-frozen-run58-cutoff-gate
          path: frozen-result
          retention-days: 14
          if-no-files-found: error
