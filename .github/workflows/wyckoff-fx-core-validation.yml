name: Wyckoff FX Core Validation

on:
  push:
    branches:
      - research/issue-55-wyckoff-fx-core-validation
    paths:
      - "indicators/wyckoff-regime-radar/research/**"
      - ".github/workflows/wyckoff-fx-core-validation.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/**"
      - ".github/workflows/wyckoff-fx-core-validation.yml"

permissions:
  contents: write

jobs:
  price-only-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile research modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/pine_math.py \
            indicators/wyckoff-regime-radar/research/price_only_core.py \
            indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py \
            indicators/wyckoff-regime-radar/research/generate_2024_deep_diagnostic_pine.py \
            indicators/wyckoff-regime-radar/research/compare_tradingview_parity.py \
            indicators/wyckoff-regime-radar/research/compare_reference_feed.py \
            indicators/wyckoff-regime-radar/research/diagnose_2024_divergence.py \
            indicators/wyckoff-regime-radar/research/freeze_static_fx_canonical_data.py \
            indicators/wyckoff-regime-radar/research/test_price_only_core.py \
            indicators/wyckoff-regime-radar/research/test_generate_price_only_parity_pine.py \
            indicators/wyckoff-regime-radar/research/test_generate_2024_deep_diagnostic_pine.py \
            indicators/wyckoff-regime-radar/research/test_compare_tradingview_parity.py \
            indicators/wyckoff-regime-radar/research/test_freeze_static_fx_canonical_data.py
      - name: Run research tests
        run: python -m unittest discover -s indicators/wyckoff-regime-radar/research -p "test_*.py" -v
      - name: Freeze or verify canonical static FX inputs
        run: |
          MANIFEST=indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-canonical-manifest.json
          if [ -f "$MANIFEST" ]; then
            python indicators/wyckoff-regime-radar/research/freeze_static_fx_canonical_data.py verify
          else
            python indicators/wyckoff-regime-radar/research/freeze_static_fx_canonical_data.py freeze
          fi
      - name: Generate TradingView parity harness
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/generated
          python indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py \
            --output indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-price-only-parity.pine
      - name: Verify generated parity harness is deterministic
        run: |
          python indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py \
            --output /tmp/wyckoff-issue-55-price-only-parity.pine
          cmp \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-price-only-parity.pine \
            /tmp/wyckoff-issue-55-price-only-parity.pine
      - name: Generate focused 2024 TradingView diagnostic harness
        run: |
          python indicators/wyckoff-regime-radar/research/generate_2024_deep_diagnostic_pine.py \
            --output indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-2024-deep-diagnostic.pine
          python indicators/wyckoff-regime-radar/research/generate_2024_deep_diagnostic_pine.py \
            --output /tmp/wyckoff-issue-55-2024-deep-diagnostic.pine
          cmp \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-2024-deep-diagnostic.pine \
            /tmp/wyckoff-issue-55-2024-deep-diagnostic.pine
      - name: Commit frozen inputs and generated harnesses on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/data/issue-55-static-fx-canonical-manifest.json \
            indicators/wyckoff-regime-radar/research/data/frozen/issue-55-*-static-d1.csv \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-price-only-parity.pine \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue-55-2024-deep-diagnostic.pine
          if git diff --cached --quiet; then
            echo "Frozen inputs and generated harnesses already current."
          else
            git commit -m "Freeze Issue #55 canonical FX research fixture"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
