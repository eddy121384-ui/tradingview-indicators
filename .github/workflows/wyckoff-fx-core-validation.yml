name: Wyckoff FX Core Validation

# Issue #55 is complete and its Final OOS is burned. Keep this workflow as a
# reproducibility harness, but never rerun it automatically from later research
# PRs. Manual dispatch preserves the historical experiment without consuming CI
# or accidentally presenting the old Final OOS as fresh validation evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-only-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Issue 55 research modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/pine_math.py \
            indicators/wyckoff-regime-radar/research/price_only_core.py \
            indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py \
            indicators/wyckoff-regime-radar/research/generate_2024_deep_diagnostic_pine.py \
            indicators/wyckoff-regime-radar/research/compare_tradingview_parity.py \
            indicators/wyckoff-regime-radar/research/freeze_static_fx_canonical_data.py \
            indicators/wyckoff-regime-radar/research/evaluate_regime_paths_pre_final.py \
            indicators/wyckoff-regime-radar/research/evaluate_regime_episodes_pre_final.py \
            indicators/wyckoff-regime-radar/research/evaluate_state_separation_pre_final.py \
            indicators/wyckoff-regime-radar/research/evaluate_confidence_calibration_pre_final.py \
            indicators/wyckoff-regime-radar/research/evaluate_trading_utility_exploratory.py \
            indicators/wyckoff-regime-radar/research/evaluate_final_oos.py
      - name: Run historical research tests
        run: python -m unittest discover -s indicators/wyckoff-regime-radar/research -p "test_*.py" -v
      - name: Verify canonical static FX inputs
        run: python indicators/wyckoff-regime-radar/research/freeze_static_fx_canonical_data.py verify
      - name: Reproduce Issue 55 Development and Exploratory OOS reports
        run: |
          mkdir -p /tmp/issue55-reproduction
          python indicators/wyckoff-regime-radar/research/evaluate_regime_paths_pre_final.py \
            --json-output /tmp/issue55-reproduction/pre-final-regime-paths.json \
            --md-output /tmp/issue55-reproduction/pre-final-regime-paths.md
          python indicators/wyckoff-regime-radar/research/evaluate_regime_episodes_pre_final.py \
            --json-output /tmp/issue55-reproduction/pre-final-regime-episodes.json \
            --md-output /tmp/issue55-reproduction/pre-final-regime-episodes.md
          python indicators/wyckoff-regime-radar/research/evaluate_state_separation_pre_final.py \
            --json-output /tmp/issue55-reproduction/pre-final-state-separation.json \
            --md-output /tmp/issue55-reproduction/pre-final-state-separation.md
          python indicators/wyckoff-regime-radar/research/evaluate_confidence_calibration_pre_final.py \
            --json-output /tmp/issue55-reproduction/pre-final-confidence-calibration.json \
            --md-output /tmp/issue55-reproduction/pre-final-confidence-calibration.md
          python indicators/wyckoff-regime-radar/research/evaluate_trading_utility_exploratory.py \
            --json-output /tmp/issue55-reproduction/exploratory-trading-utility.json \
            --md-output /tmp/issue55-reproduction/exploratory-trading-utility.md
      - name: Reproduce burned one-shot Final OOS for audit only
        run: |
          echo "WARNING: this Final OOS is burned historical evidence, not a fresh validation sample."
          python indicators/wyckoff-regime-radar/research/evaluate_final_oos.py \
            --json-output /tmp/issue55-reproduction/final-oos.json \
            --md-output /tmp/issue55-reproduction/final-oos.md
      - name: Reproduce deterministic TradingView diagnostic harnesses
        run: |
          python indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py \
            --output /tmp/issue55-reproduction/wyckoff-issue-55-price-only-parity.pine
          python indicators/wyckoff-regime-radar/research/generate_2024_deep_diagnostic_pine.py \
            --output /tmp/issue55-reproduction/wyckoff-issue-55-2024-deep-diagnostic.pine
