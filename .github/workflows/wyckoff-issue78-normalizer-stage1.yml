name: Wyckoff Issue 78 normalizer challenge stage 1

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-normalizer-stage1.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_normalizer_stage1.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-normalizer-challenge-stage1-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-normalizer-challenge-stage1-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-normalizer-stage1-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas scipy
      - name: Syntax check analyzer
        run: python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_normalizer_stage1.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_normalizer_stage1.py
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'NORMALIZERS = ("atr", "sigma20", "medabs20")' "$FILE"
          grep -F 'CHECKPOINTS = (5, 10)' "$FILE"
          grep -F 'np.std(previous_moves, ddof=1)' "$FILE"
          grep -F 'np.median(np.abs(previous_moves))' "$FILE"
          git diff --check
