name: Apply Issue 40 Code Review Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-40-final-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-40-trading-utility

      - name: Apply evaluator and test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              target.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          evaluator = "indicators/hidden-regime-map/research/evaluate_trading_utility.py"
          replace_between(
              evaluator,
              '        for _, episode in active_frame.groupby("episode_id", sort=True):\n',
              '                completed_round_trips += 1\n',
              '''        for _, episode in active_frame.groupby("episode_id", sort=True):
              first_location = int(frame.index.get_indexer([episode.index[0]])[0])
              last_location = int(frame.index.get_indexer([episode.index[-1]])[0])
              episode_growth = float((1.0 + episode["net_return"]).prod())
              if last_location < len(frame) - 1 and float(position.iloc[last_location + 1]) <= 0.0:
                  episode_growth *= 1.0 + float(frame["net_return"].iloc[last_location + 1])
              episode_returns.append(episode_growth - 1.0)
              episode_days.append(int(len(episode)))
              if first_location > 0 and last_location < len(frame) - 1:
                  completed_round_trips += 1
          ''',
          )

          tests_path = Path("indicators/hidden-regime-map/research/test_evaluate_trading_utility.py")
          tests = tests_path.read_text(encoding="utf-8")
          old = '        expected_median = ((1.10 * 0.95 - 1.0) + (1.02 * 1.03 - 1.0)) / 2.0\n'
          new = (
              '        first_payoff = 1.10 * 0.95 * (1.0 - 0.0005) - 1.0\n'
              '        second_payoff = 1.02 * 1.03 * (1.0 - 0.0005) - 1.0\n'
              '        expected_median = (first_payoff + second_payoff) / 2.0\n'
          )
          if tests.count(old) != 1:
              raise SystemExit("expected one trade-payoff test line")
          tests_path.write_text(tests.replace(old, new), encoding="utf-8")
          PY

      - name: Commit code fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_trading_utility.py \
                  indicators/hidden-regime-map/research/test_evaluate_trading_utility.py
          git commit -m "Charge exit costs in Issue 40 trade evidence"
          git push origin HEAD:research/issue-40-trading-utility
