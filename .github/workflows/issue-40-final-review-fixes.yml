name: Apply Issue 40 Final Review Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-40-final-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-40-trading-utility

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              target.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          evaluator = "indicators/hidden-regime-map/research/evaluate_trading_utility.py"
          replace_between(
              evaluator,
              '        for _, episode in active_frame.groupby("episode_id", sort=True):\n',
              '                completed_round_trips += 1\n',
              '''        for _, episode in active_frame.groupby("episode_id", sort=True):
              first_location = int(frame.index.get_indexer([episode.index[0]])[0])
              last_location = int(frame.index.get_indexer([episode.index[-1]])[0])
              episode_growth = float((1.0 + episode["net_return"]).prod())
              if last_location < len(frame) - 1 and float(position.iloc[last_location + 1]) <= 0.0:
                  episode_growth *= 1.0 + float(frame["net_return"].iloc[last_location + 1])
              episode_returns.append(episode_growth - 1.0)
              episode_days.append(int(len(episode)))
              if first_location > 0 and last_location < len(frame) - 1:
                  completed_round_trips += 1
          ''',
          )

          tests_path = Path("indicators/hidden-regime-map/research/test_evaluate_trading_utility.py")
          tests = tests_path.read_text(encoding="utf-8")
          old = '        expected_median = ((1.10 * 0.95 - 1.0) + (1.02 * 1.03 - 1.0)) / 2.0\n'
          new = (
              '        first_payoff = 1.10 * 0.95 * (1.0 - 0.0005) - 1.0\n'
              '        second_payoff = 1.02 * 1.03 * (1.0 - 0.0005) - 1.0\n'
              '        expected_median = (first_payoff + second_payoff) / 2.0\n'
          )
          if tests.count(old) != 1:
              raise SystemExit("expected one trade-payoff test line")
          tests_path.write_text(tests.replace(old, new), encoding="utf-8")

          workflow_path = Path(".github/workflows/hidden-regime-trading-utility.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          anchor = '      - indicators/hidden-regime-map/research/issue-40-experiment-spec.md\n'
          dependency_lines = (
              '      - indicators/hidden-regime-map/research/train_hmm.py\n'
              '      - indicators/hidden-regime-map/research/compare_state_counts.py\n'
              '      - indicators/hidden-regime-map/research/compare_feature_sets.py\n'
              '      - indicators/hidden-regime-map/requirements-research.txt\n'
          )
          if dependency_lines not in workflow:
              if workflow.count(anchor) != 1:
                  raise SystemExit("experiment-spec path anchor not unique")
              workflow = workflow.replace(anchor, anchor + dependency_lines)
          workflow_path.write_text(workflow, encoding="utf-8")

          replacement = '''          committed = pd.read_csv(key_path)
              regenerated = pd.read_csv(generated_csv_path)
              keys = ["candidate", "baseline", "role", "period"]
              expected_keys = {
                  ("non_hmm", "buy_and_hold", "no_hmm", "final"),
                  ("non_hmm", "buy_and_hold", "sma200_filter", "final"),
                  ("non_hmm", "trend_100", "no_hmm", "final"),
                  ("non_hmm", "momentum_63", "no_hmm", "final"),
                  ("k8_baseline_er_downside", "buy_and_hold", "defensive_switch", "final"),
                  ("k8_baseline_er_downside", "trend_100", "defensive_switch", "final"),
                  ("k8_baseline_er_downside", "momentum_63", "defensive_switch", "final"),
                  ("k3_baseline", "buy_and_hold", "size_modifier", "final"),
                  ("k8_baseline_er_downside", "trend_100", "size_modifier", "final"),
              }
              committed_keys = set(committed[keys].itertuples(index=False, name=None))
              assert committed_keys == expected_keys
              regenerated_keys = pd.MultiIndex.from_frame(regenerated[keys])
              projection = regenerated.loc[regenerated_keys.isin(expected_keys), committed.columns]
              projection_keys = set(projection[keys].itertuples(index=False, name=None))
              assert projection_keys == expected_keys
              committed = committed.sort_values(keys).reset_index(drop=True)
              projection = projection.sort_values(keys).reset_index(drop=True)
              numeric = [column for column in committed.columns if column not in keys]
              for column in numeric:
                  left = committed[column].to_numpy(dtype=float)
                  right = projection[column].to_numpy(dtype=float)
                  assert np.allclose(left, right, rtol=0.0, atol=1e-12, equal_nan=True), column
          '''
          replace_between(
              ".github/workflows/hidden-regime-trading-utility.yml",
              '          committed = pd.read_csv(key_path)\n',
              '              assert np.allclose(left, right, rtol=0.0, atol=1e-12, equal_nan=True), column\n',
              replacement,
          )

          Path(".github/workflows/issue-40-final-review-fixes.yml").unlink()
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_trading_utility.py \
                  indicators/hidden-regime-map/research/test_evaluate_trading_utility.py \
                  .github/workflows/hidden-regime-trading-utility.yml \
                  .github/workflows/issue-40-final-review-fixes.yml
          git commit -m "Address final Issue 40 review findings"
          git push origin HEAD:research/issue-40-trading-utility
