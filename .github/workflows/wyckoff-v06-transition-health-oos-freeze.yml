name: Wyckoff v0.6 Transition Health OOS Freeze

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/freeze_transition_health_independent_oos.py'
      - 'indicators/wyckoff-regime-radar/research/test_freeze_transition_health_independent_oos.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-independent-oos-freeze.md'
      - '.github/workflows/wyckoff-v06-transition-health-oos-freeze.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/freeze_transition_health_independent_oos.py'
      - 'indicators/wyckoff-regime-radar/research/test_freeze_transition_health_independent_oos.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-transition-health-independent-oos-freeze.md'
      - '.github/workflows/wyckoff-v06-transition-health-oos-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-oos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-57-wyckoff-v0.6-robustness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile freezer
        run: |
          python -m py_compile freeze_transition_health_independent_oos.py
          python -m py_compile test_freeze_transition_health_independent_oos.py
      - name: Run freezer tests
        run: python -m unittest -v test_freeze_transition_health_independent_oos
      - name: Freeze independent FX snapshot
        run: |
          python freeze_transition_health_independent_oos.py \
            --output-dir data \
            --manifest data/issue-57-transition-health-independent-oos-manifest.json
      - name: Commit frozen snapshot
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/data/issue-57-transition-health-independent-oos-*.csv
          git add indicators/wyckoff-regime-radar/research/data/issue-57-transition-health-independent-oos-manifest.json
          if git diff --cached --quiet; then
            echo "No frozen-data changes to commit"
          else
            git commit -m "research: freeze transition health independent OOS data"
            git push origin HEAD:feat/issue-57-wyckoff-v0.6-robustness
          fi
