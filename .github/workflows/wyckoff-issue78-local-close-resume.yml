name: Wyckoff Issue 78 local close resume challenger

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-local-close-resume.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_local_close_resume_challenger.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-local-close-resume-challenger-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-local-close-resume-challenger-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-local-close-resume-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas
      - name: Syntax check analyzers
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_resume_trigger_stage1.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_local_close_resume_challenger.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_local_close_resume_challenger.py
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'EXPECTED_CANDIDATES = 236' "$FILE"
          grep -F 'R1_CloseExtreme' "$FILE"
          grep -F 'R5_LocalClose' "$FILE"
          grep -F 'retest_segment.close_coord' "$FILE"
          git diff --check
