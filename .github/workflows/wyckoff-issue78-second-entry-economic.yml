name: Wyckoff Issue 78 second-entry economic policy

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-second-entry-economic.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_second_entry_economic_policy.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-second-entry-add-risk-economic-policy-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-second-entry-add-risk-economic-policy-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-second-entry-economic-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas scipy

      - name: Syntax check analyzers
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_retest_path_stage1.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_second_entry_economic_policy.py

      - name: Import smoke check
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import analyze_issue78_second_entry_economic_policy as m
          assert m.EXPECTED_EVENTS == 68118
          assert m.EXPECTED_EPISODES == 1624
          assert m.EXPECTED_B3_EVENTS == 997
          assert m.EXPECTED_P12 == 236
          assert m.PROBE == 0.25
          assert m.FULL == 1.0
          assert m.CANDIDATES == (
              "R0_Immediate",
              "R5_LocalClose",
              "R1_CloseExtreme",
              "R4_Progress05",
          )
          print("second-entry economic policy contract import OK")
          PY

      - name: Static causal-contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_second_entry_economic_policy.py
          grep -F 'P0_NoTouch' "$FILE"
          grep -F 'P3_FailedAcceptance' "$FILE"
          grep -F 'R0_Immediate' "$FILE"
          grep -F 'R5_LocalClose' "$FILE"
          grep -F 'R1_CloseExtreme' "$FILE"
          grep -F 'R4_Progress05' "$FILE"
          grep -F 'foregone_add_return_vs_R0' "$FILE"
          grep -F 'mfe_lt4' "$FILE"
          grep -F 'mfe_ge8' "$FILE"
          git diff --check
