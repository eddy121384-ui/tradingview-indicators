name: Wyckoff Issue 68 Phase B Lifecycle Pine

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b_lifecycle_pine.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_b_lifecycle_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b2_lifecycle_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_b2_lifecycle_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/issue68_lifecycle_v2.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_a_lifecycle_transplant.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1_parity_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_price_only_parity_pine.py"
      - "indicators/wyckoff-regime-radar/research/src/chase-risk-market-regime-radar-v0.5.2.1.pine"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b-*.md"
      - ".github/workflows/wyckoff-issue68-phase-b-lifecycle-pine.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b_lifecycle_pine.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_b_lifecycle_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_phase_b2_lifecycle_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/test_issue68_phase_b2_lifecycle_audit_pine.py"
      - ".github/workflows/wyckoff-issue68-phase-b-lifecycle-pine.yml"

permissions:
  contents: write

jobs:
  phase-b-lifecycle-pine-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          # Human-review artifacts must be written to the actual research branch,
          # not the detached synthetic pull-request merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile Phase B tooling
        run: |
          python -m py_compile generate_issue68_phase_b_lifecycle_pine.py
          python -m py_compile test_issue68_phase_b_lifecycle_pine.py
          python -m py_compile generate_issue68_phase_b2_lifecycle_audit_pine.py
          python -m py_compile test_issue68_phase_b2_lifecycle_audit_pine.py
      - name: Reconfirm Phase A lifecycle contract
        run: python -m unittest -v test_issue68_phase_a_lifecycle_transplant
      - name: Run Phase B one-body Pine contract
        run: python -m unittest -v test_issue68_phase_b_lifecycle_pine
      - name: Run Phase B2 semantic-audit transport contract
        run: python -m unittest -v test_issue68_phase_b2_lifecycle_audit_pine
      - name: Generate Phase B strategy previews and Phase B2 audit indicator
        run: |
          python generate_issue68_phase_b_lifecycle_pine.py \
            --visual-output generated/wyckoff-issue68-phase-b-lifecycle-visual-preview.pine \
            --performance-output generated/wyckoff-issue68-phase-b-lifecycle-performance-preview.pine
          python generate_issue68_phase_b2_lifecycle_audit_pine.py \
            --output generated/wyckoff-issue68-phase-b2-lifecycle-semantic-audit.pine
          test -s generated/wyckoff-issue68-phase-b-lifecycle-visual-preview.pine
          test -s generated/wyckoff-issue68-phase-b-lifecycle-performance-preview.pine
          test -s generated/wyckoff-issue68-phase-b2-lifecycle-semantic-audit.pine
          grep -q 'Issue #68 Lifecycle Visual Review' generated/wyckoff-issue68-phase-b-lifecycle-visual-preview.pine
          grep -q 'Issue #68 Lifecycle Performance Preview' generated/wyckoff-issue68-phase-b-lifecycle-performance-preview.pine
          grep -q 'Issue #68 Lifecycle Semantic Audit' generated/wyckoff-issue68-phase-b2-lifecycle-semantic-audit.pine
          ! grep -q 'strategy\.' generated/wyckoff-issue68-phase-b2-lifecycle-semantic-audit.pine
      - name: Commit generated Phase B/B2 Pine to research branch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-phase-b-lifecycle-visual-preview.pine
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-phase-b-lifecycle-performance-preview.pine
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-phase-b2-lifecycle-semantic-audit.pine
          if git diff --cached --quiet; then
            echo "Phase B/B2 Pine artifacts already current."
          else
            git commit -m "research: record Issue 68 Phase B/B2 lifecycle Pine artifacts [skip ci]"
            # Another Issue #68 workflow may have committed a report while this
            # job was running. Rebase the generated artifact commit instead of
            # racing or force-pushing the research branch.
            git pull --rebase origin "${TARGET_BRANCH}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
