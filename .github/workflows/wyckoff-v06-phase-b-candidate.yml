name: Wyckoff v0.6 Phase B Stale-Decay Candidate

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/test_generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_persistence_candidate.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_decay_sweep.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_candidate_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_decay_sweep_report.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.*"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.*"
      - ".github/workflows/wyckoff-v06-phase-b-candidate.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/test_generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_persistence_candidate.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_decay_sweep.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_candidate_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_decay_sweep_report.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.*"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.*"
      - ".github/workflows/wyckoff-v06-phase-b-candidate.yml"

permissions:
  contents: write

jobs:
  stale-decay-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Phase B candidate modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py \
            indicators/wyckoff-regime-radar/research/test_generate_v06_phase_b_core.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_persistence_candidate.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_decay_sweep.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_candidate_report.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_decay_sweep_report.py
      - name: Run Phase B candidate tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m unittest -v test_generate_v06_phase_b_core
      - name: Generate deterministic Phase B candidate report
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/reports
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_candidate_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_candidate_report.py \
            --json-output /tmp/issue-57-phase-b-stale-decay-candidate.json \
            --md-output /tmp/issue-57-phase-b-stale-decay-candidate.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.json /tmp/issue-57-phase-b-stale-decay-candidate.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.md /tmp/issue-57-phase-b-stale-decay-candidate.md
      - name: Generate deterministic stale-decay horizon sweep
        run: |
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_decay_sweep_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_decay_sweep_report.py \
            --json-output /tmp/issue-57-phase-b-decay-horizon-sweep.json \
            --md-output /tmp/issue-57-phase-b-decay-horizon-sweep.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.json /tmp/issue-57-phase-b-decay-horizon-sweep.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.md /tmp/issue-57-phase-b-decay-horizon-sweep.md
      - name: Commit Phase B candidate reports on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-stale-decay-candidate.md \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-decay-horizon-sweep.md
          if git diff --cached --quiet; then
            echo "Issue #57 Phase B candidate reports already current."
          else
            git commit -m "Record Issue #57 Phase B stale-decay engineering sweep"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
