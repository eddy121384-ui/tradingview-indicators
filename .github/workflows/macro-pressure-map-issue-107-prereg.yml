name: Macro Pressure Map Issue 107 Prereg
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/decisions/issue-107-*"
      - "indicators/macro-pressure-map/research/test_issue_107_*"
      - ".github/workflows/macro-pressure-map-issue-107-prereg.yml"
permissions:
  contents: read
jobs:
  prereg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest==9.1.1"
      - name: Validate preregistration
        working-directory: indicators/macro-pressure-map/research
        run: python -m pytest -q test_issue_107_continuous_policy_prereg.py
      - name: Confirm historical prereg preceded outcome evaluator
        run: |
          PREREG_SHA=65db3acb61a894c9a71588235c1324085ba53547
          git cat-file -e "$PREREG_SHA:indicators/macro-pressure-map/research/decisions/issue-107-continuous-policy-reaction-preregistered.json"
          if git ls-tree -r "$PREREG_SHA" --name-only | grep -Fxq 'indicators/macro-pressure-map/research/issue_107_continuous_policy_reaction.py'; then
            echo "Outcome evaluator existed in prereg commit"
            exit 1
          fi
          if git ls-tree -r "$PREREG_SHA" --name-only | grep -Fxq 'indicators/macro-pressure-map/research/policy_pressure_proxy.py'; then
            echo "Display formula existed in prereg commit"
            exit 1
          fi
          echo "Historical prereg cleanly precedes outcome evaluation and display-formula design."
