name: Wyckoff v0.6 Transition Formation and Regime Decay

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_transition_formation_and_regime_decay.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_transition_formation_and_regime_decay.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_decay_exit_policy.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_decay_exit_policy.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_formation_transition_paths.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_formation_transition_paths.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-formation-path-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_bridge_formation_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_bridge_formation_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-bridge-formation-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_handoff_weight_behavior.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_handoff_weight_behavior.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-handoff-weight-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_post_handoff_companion_progression.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_post_handoff_companion_progression.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-post-handoff-companion-progression-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_post_handoff_hold_persistence.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_post_handoff_hold_persistence.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-post-handoff-hold-persistence-map.md'
      - '.github/workflows/wyckoff-v06-transition-formation-decay.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_transition_formation_and_regime_decay.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_transition_formation_and_regime_decay.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_decay_exit_policy.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_decay_exit_policy.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_formation_transition_paths.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_formation_transition_paths.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-formation-path-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_bridge_formation_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_bridge_formation_outcomes.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-bridge-formation-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_handoff_weight_behavior.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_handoff_weight_behavior.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-handoff-weight-behavior-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_post_handoff_companion_progression.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_post_handoff_companion_progression.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-post-handoff-companion-progression-map.md'
      - 'indicators/wyckoff-regime-radar/research/diagnose_post_handoff_hold_persistence.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_post_handoff_hold_persistence.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-post-handoff-hold-persistence-map.md'
      - '.github/workflows/wyckoff-v06-transition-formation-decay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  behavior-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostics
        run: |
          python -m py_compile diagnose_transition_formation_and_regime_decay.py
          python -m py_compile test_diagnose_transition_formation_and_regime_decay.py
          python -m py_compile diagnose_decay_exit_policy.py
          python -m py_compile test_diagnose_decay_exit_policy.py
          python -m py_compile diagnose_formation_transition_paths.py
          python -m py_compile test_diagnose_formation_transition_paths.py
          python -m py_compile diagnose_bridge_formation_outcomes.py
          python -m py_compile test_diagnose_bridge_formation_outcomes.py
          python -m py_compile diagnose_handoff_weight_behavior.py
          python -m py_compile test_diagnose_handoff_weight_behavior.py
          python -m py_compile diagnose_post_handoff_companion_progression.py
          python -m py_compile test_diagnose_post_handoff_companion_progression.py
          python -m py_compile diagnose_post_handoff_hold_persistence.py
          python -m py_compile test_diagnose_post_handoff_hold_persistence.py
      - name: Run contract tests
        run: |
          python -m unittest -v test_diagnose_transition_formation_and_regime_decay
          python -m unittest -v test_diagnose_decay_exit_policy
          python -m unittest -v test_diagnose_formation_transition_paths
          python -m unittest -v test_diagnose_bridge_formation_outcomes
          python -m unittest -v test_diagnose_handoff_weight_behavior
          python -m unittest -v test_diagnose_post_handoff_companion_progression
          python -m unittest -v test_diagnose_post_handoff_hold_persistence
      - name: Run burned-data behavior map
        run: |
          python diagnose_transition_formation_and_regime_decay.py \
            --json-output reports/issue-57-transition-formation-and-regime-decay.json \
            --md-output reports/issue-57-transition-formation-and-regime-decay.md
      - name: Compare warning exit with regime-change exit
        run: |
          python diagnose_decay_exit_policy.py \
            --json-output reports/issue-57-decay-exit-policy.json \
            --md-output reports/issue-57-decay-exit-policy.md
      - name: Map formation transition paths
        run: |
          python diagnose_formation_transition_paths.py \
            --json-output reports/issue-57-formation-transition-paths.json \
            --md-output reports/issue-57-formation-transition-paths.md
      - name: Map early bridge formation outcomes
        run: |
          python diagnose_bridge_formation_outcomes.py \
            --json-output reports/issue-57-bridge-formation-outcomes.json \
            --md-output reports/issue-57-bridge-formation-outcomes.md
      - name: Map bridge handoff weights
        run: |
          python diagnose_handoff_weight_behavior.py \
            --json-output reports/issue-57-handoff-weight-behavior.json \
            --md-output reports/issue-57-handoff-weight-behavior.md
      - name: Map post-handoff companion progression
        run: |
          python diagnose_post_handoff_companion_progression.py \
            --json-output reports/issue-57-post-handoff-companion-progression.json \
            --md-output reports/issue-57-post-handoff-companion-progression.md
      - name: Map post-handoff hold persistence
        run: |
          python diagnose_post_handoff_hold_persistence.py \
            --json-output reports/issue-57-post-handoff-hold-persistence.json \
            --md-output reports/issue-57-post-handoff-hold-persistence.md
      - name: Commit behavior-map reports on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-formation-and-regime-decay.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-transition-formation-and-regime-decay.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-decay-exit-policy.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-decay-exit-policy.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-formation-transition-paths.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-formation-transition-paths.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-bridge-formation-outcomes.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-bridge-formation-outcomes.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-handoff-weight-behavior.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-handoff-weight-behavior.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-post-handoff-companion-progression.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-post-handoff-companion-progression.md
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-post-handoff-hold-persistence.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-post-handoff-hold-persistence.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record transition behavior maps"
            git push
          fi
