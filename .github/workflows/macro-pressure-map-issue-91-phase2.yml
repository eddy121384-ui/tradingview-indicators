name: Macro Pressure Map Issue 91 Phase 2 Asset Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_91_phase2_*"
      - "indicators/macro-pressure-map/research/test_issue_91_phase2_*"
      - "indicators/macro-pressure-map/research/decisions/issue-91-phase2-*"
      - ".github/workflows/macro-pressure-map-issue-91-phase2.yml"

permissions:
  contents: read

jobs:
  phase2-asset-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Phase 2 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "pandas==3.0.5" "lxml==6.1.3" "openpyxl==3.1.5" "pytest==9.1.1"

      - name: Validate Phase 2 preregistration
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q test_issue_91_phase2_prereg.py

      - name: Run Phase 2 unit tests
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q test_issue_91_phase2_asset_validation.py

      - name: Generate preregistered Phase 2 evidence
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-91-phase2
          python issue_91_phase2_asset_validation.py --output-dir generated/issue-91-phase2

      - name: Enforce Phase 2 research boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m=json.loads(Path("generated/issue-91-phase2/issue-91-phase2-manifest.json").read_text())
          assert m["preregistration_preceded_asset_implementation"] is True
          assert m["hmra_freeze_validated_before_asset_join"] is True
          assert m["production_v66_modified"] is False
          assert m["etfs_used"] is False
          assert m["portfolio_policy_evaluated"] is False
          assert m["pairings"]["structural"]["rows"] == 98
          assert m["pairings"]["strict_causal_t_plus_2"]["last_return_year"] == 2025
          assert m["structural_verdict_committed"] is True
          print({
              "pairings":m["pairings"],
              "diagnostic_counts":m["diagnostic_counts"],
              "cross_source_overall":m["cross_source_overall"],
          })
          PY

      - name: Validate durable Phase 2 finding
        working-directory: indicators/macro-pressure-map/research
        run: |
          python issue_91_phase2_completion_validation.py --evidence-dir generated/issue-91-phase2

      - name: Upload Phase 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-91-phase2-asset-validation
          path: indicators/macro-pressure-map/research/generated/issue-91-phase2
          retention-days: 3
          if-no-files-found: error
