name: Wyckoff Issue 68 Symmetric S1 S4 CTX

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_current_context_symmetric_s1_s4_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-current-context-symmetric-s1-s4-preregistration.md"
      - ".github/workflows/wyckoff-issue68-current-context-symmetric-s1-s4.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_current_context_symmetric_s1_s4_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-current-context-symmetric-s1-s4-preregistration.md"
      - ".github/workflows/wyckoff-issue68-current-context-symmetric-s1-s4.yml"

permissions:
  contents: write

jobs:
  symmetric-s1-s4-ctx:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python -m py_compile generate_issue68_current_context_symmetric_s1_s4_audit_pine.py
      - name: Generate TradingView symmetric S1/S4 audit
        run: |
          python generate_issue68_current_context_symmetric_s1_s4_audit_pine.py \
            --output generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          test -s generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'SYMMETRIC CTX' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'min(DownEx,Bear)' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'min(UpEx,Bull)' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'EXACT MIRROR' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'Fresh retained' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          grep -q 'Other removed' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          ! grep -q 'strategy\.entry' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          ! grep -q 'strategy\.close' generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          echo 'Symmetric S1/S4 current-context audit contract PASS'
      - name: Commit generated artifact on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-current-context-symmetric-s1-s4-audit.pine
          if git diff --cached --quiet; then
            echo "Symmetric S1/S4 artifact already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 symmetric S1/S4 audit [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
