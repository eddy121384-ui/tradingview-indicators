name: Macro Pressure Map Issue 149 Inflation Comp Sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_149_inflation_comp_source.py"
      - ".github/workflows/macro-pressure-map-issue-149-sources.yml"

permissions:
  contents: read

jobs:
  source-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas requests beautifulsoup4 openpyxl

      - name: Static validation
        run: python -m py_compile indicators/macro-pressure-map/research/issue_149_inflation_comp_source.py

      - name: Freeze Cleveland source only
        run: |
          rm -rf indicators/macro-pressure-map/research/generated/issue-149-source
          python indicators/macro-pressure-map/research/issue_149_inflation_comp_source.py \
            --output-dir indicators/macro-pressure-map/research/generated/issue-149-source

      - name: Firewall assertion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("indicators/macro-pressure-map/research/generated/issue-149-source/issue-149-source-manifest.json")
          r=json.loads(p.read_text())
          assert r["exact_v66_signal_loaded"] is False
          assert r["outcome_data_loaded"] is False
          assert r["coverage"]["first_finite_period"] <= "1982-01"
          assert r["coverage"]["last_finite_period"] >= "2026-03"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue-149-inflation-comp-source
          path: indicators/macro-pressure-map/research/generated/issue-149-source
          retention-days: 3
          if-no-files-found: error
