name: Wyckoff Issue 61 Stage Lifecycle Base

on:
  push:
    branches:
      - research/issue-61-stage-aware-position-lifecycle
    paths:
      - 'indicators/wyckoff-regime-radar/research/evaluate_stage_lifecycle_base.py'
      - 'indicators/wyckoff-regime-radar/research/test_evaluate_stage_lifecycle_base.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-61-phase-a-timing-decision.md'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py'
      - 'indicators/wyckoff-regime-radar/research/v06_boundary_scores.py'
      - '.github/workflows/wyckoff-issue61-stage-lifecycle-base.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/evaluate_stage_lifecycle_base.py'
      - 'indicators/wyckoff-regime-radar/research/test_evaluate_stage_lifecycle_base.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-61-phase-a-timing-decision.md'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_price_only_core.py'
      - 'indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py'
      - 'indicators/wyckoff-regime-radar/research/v06_boundary_scores.py'
      - '.github/workflows/wyckoff-issue61-stage-lifecycle-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-lifecycle-base:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile lifecycle evaluator
        run: |
          python -m py_compile evaluate_stage_lifecycle_base.py
          python -m py_compile test_evaluate_stage_lifecycle_base.py
      - name: Run lifecycle contract tests
        run: python -m unittest -v test_evaluate_stage_lifecycle_base
      - name: Evaluate frozen base lifecycle
        run: |
          python evaluate_stage_lifecycle_base.py \
            --json-output reports/issue-61-stage-lifecycle-base.json \
            --md-output reports/issue-61-stage-lifecycle-base.md
      - name: Commit lifecycle report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-61-stage-aware-position-lifecycle'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-stage-lifecycle-base.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-61-stage-lifecycle-base.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record Issue #61 base lifecycle result"
            git push
          fi
