name: Macro Pressure Map Issue 145 IPI v2 Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue-145-ipi-v2-bridge-prereg.md"
      - "indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py"
      - "indicators/macro-pressure-map/research/issue_145_ipi_v2_bridge.py"
      - "indicators/macro-pressure-map/research/test_issue_145_ipi_v2_bridge.py"
      - ".github/workflows/macro-pressure-map-issue-145-sources.yml"
      - ".github/workflows/macro-pressure-map-issue-145-bridge.yml"

permissions:
  contents: read

jobs:
  v2-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Issue 145 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout frozen exact V6.6 monthly snapshot
        uses: actions/checkout@v4
        with:
          ref: 752755d423c1a13415d8ad3647c3def74adaa2d8
          path: issue133

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy pandas requests beautifulsoup4 openpyxl pytest

      - name: Validate preregistration freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/issue-145-ipi-v2-bridge-prereg.md")
          s=p.read_text(encoding="utf-8")
          required=[
              "FROZEN BEFORE ANY ISSUE #145 ANALOGUE-vs-EXACT BRIDGE METRIC",
              "848a7ba847b3637b3b8b4715df7b555598c6a7a3bcced76d85aed1e42b29ecaa",
              "first month in which every IPI v2 component score is finite is frozen as:",
              "1990-02",
              "Issue #145 deliberately reuses the **same frozen Issue #141 pass criteria**",
              "trigger F1 within +/-1 month >= 0.60",
              "validated_for_outcome_testing",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          PY

      - name: Static and unit tests
        run: |
          python -m py_compile current/indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py
          python -m py_compile current/indicators/macro-pressure-map/research/issue_145_ipi_v2_bridge.py
          cd current/indicators/macro-pressure-map/research
          pytest -q test_issue_145_ipi_v2_bridge.py

      - name: Rebuild frozen v2 source snapshot
        run: |
          rm -rf current/indicators/macro-pressure-map/research/generated/issue-145-source
          python current/indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py \
            --output-dir current/indicators/macro-pressure-map/research/generated/issue-145-source

      - name: Verify normalized v2 source freeze
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("current/indicators/macro-pressure-map/research/generated/issue-145-source")
          panel=root/"issue-145-v2-source-panel.csv"
          sha=hashlib.sha256(panel.read_bytes()).hexdigest()
          assert sha == "848a7ba847b3637b3b8b4715df7b555598c6a7a3bcced76d85aed1e42b29ecaa", sha
          m=json.loads((root/"issue-145-source-manifest.json").read_text())
          assert m["exact_v66_signal_loaded"] is False
          assert m["outcome_data_loaded"] is False
          assert m["v2_panel"]["first_complete_period"] == "1988-12"
          assert m["v2_panel"]["last_complete_period"] == "2026-03"
          PY

      - name: Run frozen IPI Bridge v2
        run: |
          rm -rf current/indicators/macro-pressure-map/research/generated/issue-145
          python current/indicators/macro-pressure-map/research/issue_145_ipi_v2_bridge.py \
            --source-dir current/indicators/macro-pressure-map/research/generated/issue-145-source \
            --issue133-root issue133/indicators/macro-pressure-map/research \
            --output-dir current/indicators/macro-pressure-map/research/generated/issue-145

      - name: Validate result contract and firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/generated/issue-145/issue-145-result.json")
          r=json.loads(p.read_text())
          assert r["issue"] == 145
          assert r["outcome_data_loaded"] is False
          assert r["production_authorized"] is False
          assert r["verdict"] in {
              "signal_bridge_v2_passed",
              "signal_bridge_v2_failed",
              "signal_bridge_v2_inconclusive_sample",
          }
          assert r["validated_for_outcome_testing"] == (
              r["verdict"] == "signal_bridge_v2_passed"
          )
          print({
              "verdict": r["verdict"],
              "validated": r["validated_for_outcome_testing"],
              "holdout": r["holdout"],
              "subsegments": r["holdout_subsegments"],
              "gates": r["gates"],
              "historical": r["historical_window"],
              "vs_issue141": r["comparison_to_issue141"],
          })
          PY

      - name: Upload Issue 145 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-145-ipi-v2-bridge
          path: |
            current/indicators/macro-pressure-map/research/generated/issue-145
            current/indicators/macro-pressure-map/research/generated/issue-145-source/issue-145-source-manifest.json
          retention-days: 3
          if-no-files-found: error
