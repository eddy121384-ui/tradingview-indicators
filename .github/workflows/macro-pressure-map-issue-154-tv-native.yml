name: Macro Pressure Map Issue 154 TV-native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue-154-tv-native-v66-prereg.md"
      - "indicators/macro-pressure-map/research/issue_154_tv_native_v66.py"
      - "indicators/macro-pressure-map/research/test_issue_154_tv_native_v66.py"
      - "indicators/macro-pressure-map/research/generated/issue-154-source/**"
      - ".github/workflows/macro-pressure-map-issue-154-tv-native.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Issue 154 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout frozen Issue 133 exact target
        uses: actions/checkout@v4
        with:
          ref: 752755d423c1a13415d8ad3647c3def74adaa2d8
          path: issue133

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy pandas pytest

      - name: Validate frozen preregistration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/issue-154-tv-native-v66-prereg.md")
          s=p.read_text(encoding="utf-8")
          required=[
              "FROZEN BEFORE ANY ISSUE #154 RECONSTRUCTION PARITY METRIC",
              "FRED:T10YIE",
              "ddof=0",
              "GPI correlation >= 0.995",
              "IPI correlation >= 0.995",
              "async-turn trigger F1 >= 0.80",
              "No historical asset-outcome test.",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          PY

      - name: Static and unit tests
        run: |
          python -m py_compile current/indicators/macro-pressure-map/research/issue_154_tv_native_v66.py
          cd current/indicators/macro-pressure-map/research
          pytest -q test_v6_6_core.py test_issue_154_tv_native_v66.py

      - name: Run frozen TradingView-native reconstruction parity
        run: |
          rm -rf current/indicators/macro-pressure-map/research/generated/issue-154
          python current/indicators/macro-pressure-map/research/issue_154_tv_native_v66.py \
            --source-dir current/indicators/macro-pressure-map/research/generated/issue-154-source \
            --issue133-root issue133/indicators/macro-pressure-map/research \
            --output-dir current/indicators/macro-pressure-map/research/generated/issue-154

      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/generated/issue-154/issue-154-parity-result.json")
          r=json.loads(p.read_text())
          assert r["issue"] == 154
          assert r["outcome_data_loaded"] is False
          assert r["production_authorized"] is False
          assert r["autopsy_authorized"] == (r["verdict"] == "tv_native_reconstruction_passed")
          assert r["verdict"] in {
              "tv_native_reconstruction_passed",
              "tv_native_reconstruction_failed",
              "tv_native_reconstruction_inconclusive_sample",
          }
          print({
              "verdict":r["verdict"],
              "metrics":r["metrics"],
              "gates":r["gates"],
              "autopsy_authorized":r["autopsy_authorized"],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue-154-tv-native-parity
          path: current/indicators/macro-pressure-map/research/generated/issue-154
          retention-days: 3
          if-no-files-found: error
