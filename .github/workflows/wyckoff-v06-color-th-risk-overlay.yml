name: Wyckoff v0.6 Color-first TH Risk Overlay

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_color_first_th_overlay.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_color_first_th_overlay.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-color-first-transition-health-risk-overlay.md'
      - '.github/workflows/wyckoff-v06-color-th-risk-overlay.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_color_first_th_overlay.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_color_first_th_overlay.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-color-first-transition-health-risk-overlay.md'
      - '.github/workflows/wyckoff-v06-color-th-risk-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  color-first-th-overlay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic
        run: |
          python -m py_compile diagnose_color_first_th_overlay.py
          python -m py_compile test_diagnose_color_first_th_overlay.py
      - name: Run contract tests
        run: python -m unittest -v test_diagnose_color_first_th_overlay
      - name: Evaluate color-first TH overlay
        run: |
          python diagnose_color_first_th_overlay.py \
            --json-output reports/issue-57-color-first-th-overlay.json \
            --md-output reports/issue-57-color-first-th-overlay.md
      - name: Commit report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-color-first-th-overlay.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-color-first-th-overlay.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record color-first TH overlay results"
            git push
          fi
