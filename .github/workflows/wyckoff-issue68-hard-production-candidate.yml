name: Wyckoff Issue 68 HARD Production Candidate

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_hard_current_context_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-hard-current-context-production-readiness-audit.md"
      - ".github/workflows/wyckoff-issue68-hard-production-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_hard_current_context_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-hard-current-context-production-readiness-audit.md"
      - ".github/workflows/wyckoff-issue68-hard-production-candidate.yml"

permissions:
  contents: write

jobs:
  hard-production-candidate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production-candidate generator
        run: python -m py_compile generate_issue68_hard_current_context_production_candidate_pine.py

      - name: Generate full C-2 HARD production candidate and deterministic diff
        run: |
          python generate_issue68_hard_current_context_production_candidate_pine.py \
            --output generated/wyckoff-issue68-hard-current-context-production-candidate.pine \
            --diff-output generated/wyckoff-issue68-hard-current-context-production-candidate.diff

          test -s generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          test -s generated/wyckoff-issue68-hard-current-context-production-candidate.diff

          grep -q 'currentBearGate = f_gate(bearBg, 35.0, 75.0)' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'currentBullGate = f_gate(bullBg, 35.0, 75.0)' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'ctxDownExGate = math.min(downsideExhaustionGate, currentBearGate)' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'ctxUpExGate = math.min(upsideExhaustionGate, currentBullGate)' generated/wyckoff-issue68-hard-current-context-production-candidate.pine

          grep -q 'volumeMode = input.string("Auto", "Volume Mode"' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'mtfMode = input.string("Observe Only", "MTF Mode"' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'divMode = input.string("Observe Only", "Divergence Mode"' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'witnessStageBiasMode = input.string("Balanced", "Witness Stage Bias Mode"' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q '// Visuals' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'alertcondition(formalChanged' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          grep -q 'request.security_lower_tf' generated/wyckoff-issue68-hard-current-context-production-candidate.pine

          ! grep -q 'Issue #66 forced price-only' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          ! grep -q 'PARITY prob_acc' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          ! grep -q 'Issue #68 Fresh-S1' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          ! grep -q 'STATEFUL CTX' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          ! grep -q 'strategy\.entry' generated/wyckoff-issue68-hard-current-context-production-candidate.pine
          ! grep -q 'strategy\.close' generated/wyckoff-issue68-hard-current-context-production-candidate.pine

          echo 'Issue #68 full-C2 HARD production candidate contract PASS'
          cat generated/wyckoff-issue68-hard-current-context-production-candidate.diff

      - name: Commit generated candidate and diff on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-hard-current-context-production-candidate.pine \
            indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-hard-current-context-production-candidate.diff
          if git diff --cached --quiet; then
            echo "Issue #68 HARD production candidate artifacts already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 HARD production candidate [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
