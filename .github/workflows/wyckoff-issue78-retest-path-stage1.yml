name: Wyckoff Issue 78 retest acceptance path stage 1

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-retest-path-stage1.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_retest_path_stage1.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-retest-acceptance-path-stage1-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-retest-acceptance-path-stage1-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-retest-path-stage1-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas scipy
      - name: Syntax check analyzer
        run: python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_retest_path_stage1.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_retest_path_stage1.py
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'LOOKBACK = 5' "$FILE"
          grep -F 'P1_WickHold' "$FILE"
          grep -F 'P2_Reclaim' "$FILE"
          grep -F 'P3_FailedAcceptance' "$FILE"
          grep -F 'len(frame) != 997' "$FILE"
          git diff --check
