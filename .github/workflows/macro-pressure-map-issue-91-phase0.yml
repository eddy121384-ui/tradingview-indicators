name: Macro Pressure Map Issue 91 Phase 0 Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_91_phase0_*"
      - "indicators/macro-pressure-map/research/test_issue_91_phase0_*"
      - "indicators/macro-pressure-map/research/decisions/issue-91-phase0-*"
      - ".github/workflows/macro-pressure-map-issue-91-phase0.yml"

permissions:
  contents: read

jobs:
  phase0-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Phase 0 audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==3.0.5" "lxml==6.1.3" "openpyxl==3.1.5" "pytest==9.1.1"

      - name: Run Phase 0 unit tests
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q test_issue_91_phase0_data_audit.py

      - name: Audit and hash long-history sources
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-91-phase0
          python issue_91_phase0_data_audit.py --output-dir generated/issue-91-phase0

      - name: Validate Phase 0 output boundary
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("generated/issue-91-phase0/issue-91-phase0-source-audit.json")
          audit=json.loads(p.read_text())
          assert audit["issue"] == 91
          assert audit["phase"] == "0-source-audit"
          assert audit["regime_conditioned_asset_results_computed"] is False
          assert audit["portfolio_results_computed"] is False
          assert audit["etfs_used"] is False
          assert audit["raw_third_party_files_committed"] is False
          assert audit["required_source_failures"] == []
          assert all(source["etf"] is False for source in audit["sources"])
          print({
              "sources": [(x["id"],x["audit_status"]) for x in audit["sources"]],
              "required_failures": audit["required_source_failures"],
          })
          PY

      - name: Validate durable Phase 0 source freeze
        working-directory: indicators/macro-pressure-map/research
        run: |
          python issue_91_phase0_completion_validation.py --evidence-dir generated/issue-91-phase0

      - name: Upload Phase 0 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pressure-map-issue-91-phase0-source-audit
          path: indicators/macro-pressure-map/research/generated/issue-91-phase0
          retention-days: 7
          if-no-files-found: error
