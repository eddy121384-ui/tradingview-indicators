name: Wyckoff Issue 68 Phase B3.12 Structure Step
on:
  push:
    branches: [research/issue-68-lifecycle-retest-symmetry-repaired]
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b312_structure_step_ma_cross.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b312_structure_step_ma_cross.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b312-structure-step-ma-cross-preregistration.md'
      - '.github/workflows/wyckoff-issue68-phase-b312-structure-step.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b312_structure_step_ma_cross.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b312_structure_step_ma_cross.py'
      - '.github/workflows/wyckoff-issue68-phase-b312-structure-step.yml'
permissions: {contents: write}
jobs:
  structure-step-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pandas
      - name: Compile and synthetic contracts
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m py_compile diagnose_issue68_phase_b312_structure_step_ma_cross.py test_issue68_phase_b312_structure_step_ma_cross.py
          python test_issue68_phase_b312_structure_step_ma_cross.py
      - name: Frozen-FX Structure step forensic
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python diagnose_issue68_phase_b312_structure_step_ma_cross.py \
            --report-json reports/issue-68-phase-b312-structure-step-ma-cross.json \
            --report-md reports/issue-68-phase-b312-structure-step-ma-cross.md
      - name: Diagnostic-only guard
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import json
          s=json.dumps(json.load(open('reports/issue-68-phase-b312-structure-step-ma-cross.json'))).lower()
          bad=[x for x in ('sharpe','sortino','profit_factor','net_profit','strategy_return') if x in s]
          assert not bad,bad
          print('B3.12 diagnostic-only boundary PASS')
          PY
      - name: Commit report
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/reports/issue-68-phase-b312-structure-step-ma-cross.*
          git diff --cached --quiet || (git commit -m 'research(issue-68): refresh B3.12 structure step report' && git push)
