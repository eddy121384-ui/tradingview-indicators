name: Macro Pressure Map Issue 123 Reflation Policy Rematch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_123_reflation_policy_rematch.py"
      - "indicators/macro-pressure-map/research/test_issue_123_reflation_policy_rematch.py"
      - "indicators/macro-pressure-map/research/issue_123_completion_validation.py"
      - "indicators/macro-pressure-map/research/decisions/issue-123-*"
      - ".github/workflows/macro-pressure-map-issue-123.yml"

permissions:
  contents: read

jobs:
  policy-rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen-compatible research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "pandas==3.0.5" "lxml==6.1.3" "openpyxl==3.1.5" "pytest==9.1.1"

      - name: Validate Issue 123 preregistration and evaluator
        working-directory: indicators/macro-pressure-map/research
        run: |
          python -m pytest -q test_issue_123_reflation_policy_rematch.py
          python -m py_compile issue_123_reflation_policy_rematch.py

      - name: Run Issue 123 Reflation policy rematch
        working-directory: indicators/macro-pressure-map/research
        run: |
          rm -rf generated/issue-123
          python issue_123_reflation_policy_rematch.py --output-dir generated/issue-123

      - name: Validate result contract
        working-directory: indicators/macro-pressure-map/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("generated/issue-123/issue-123-result.json").read_text())
          assert r["issue"] == 123
          assert r["sample"]["rows"] == 96
          assert r["sample"]["return_year_last"] == 2025
          assert r["policy"]["base"] == {"equity":0.5,"treasury":0.5}
          assert r["policy"]["reflation"] == {"equity":0.55,"treasury":0.45}
          assert r["policy"]["primary_cost_bps"] == 5.0
          assert len(r["gate"]) == 10
          assert r["verdict"] in {
              "long_history_reflation_policy_candidate",
              "economically_positive_but_policy_robustness_failed",
              "no_material_policy_value",
              "inconclusive_policy_sample",
          }
          assert r["production_authorized"] is False
          print({
              "verdict":r["verdict"],
              "gate":r["gate"],
              "full":r["full"],
              "broad":{k:v["action_minus_c0"] for k,v in r["broad_eras"].items()},
              "fine":r["fine_era_leaveouts"],
              "episode":r["episode_robustness"],
          })
          PY

      - name: Validate durable Issue 123 finding
        working-directory: indicators/macro-pressure-map/research
        run: |
          python issue_123_completion_validation.py --result generated/issue-123/issue-123-result.json

      - name: Upload Issue 123 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-123-reflation-policy-rematch
          path: indicators/macro-pressure-map/research/generated/issue-123
          retention-days: 30
          if-no-files-found: error
