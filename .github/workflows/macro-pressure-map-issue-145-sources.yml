name: Macro Pressure Map Issue 145 IPI v2 Sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py"
      - ".github/workflows/macro-pressure-map-issue-145-sources.yml"

permissions:
  contents: read

jobs:
  v2-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Issue 145 branch
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy pandas requests beautifulsoup4 openpyxl

      - name: Static validation
        run: python -m py_compile indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py

      - name: Acquire v2 signal sources only
        run: |
          rm -rf indicators/macro-pressure-map/research/generated/issue-145-source
          python indicators/macro-pressure-map/research/issue_145_ipi_v2_source_acquisition.py \
            --output-dir indicators/macro-pressure-map/research/generated/issue-145-source

      - name: Firewall and coverage assertion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("indicators/macro-pressure-map/research/generated/issue-145-source/issue-145-source-manifest.json")
          r=json.loads(p.read_text())
          assert r["exact_v66_signal_loaded"] is False
          assert r["outcome_data_loaded"] is False
          assert r["dbiq"]["ticker"] == "DBLCDBCE"
          assert r["dbiq"]["historical_inception"] == "1988-12-02"
          assert r["dbiq"]["monthly_level_rows_through_source_end"] >= 445
          assert r["v2_panel"]["first_complete_period"] == "1988-12"
          assert r["v2_panel"]["last_complete_period"] == "2026-03"
          PY

      - name: Upload Issue 145 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-145-ipi-v2-source-snapshot
          path: indicators/macro-pressure-map/research/generated/issue-145-source
          retention-days: 3
          if-no-files-found: error
