name: Wyckoff Issue 68 Phase B3.8 Mirror Residual

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b38_component_mirror_residual.py"
      - ".github/workflows/wyckoff-issue68-phase-b38-mirror-residual.yml"

permissions:
  contents: write

jobs:
  mirror-residual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-68-lifecycle-retest-symmetry-repaired
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Persist B3.8 per-component reciprocal residuals
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python diagnose_issue68_phase_b38_component_mirror_residual.py \
            --output reports/issue-68-phase-b38-component-mirror-residual.json
      - name: Commit one-shot residual report
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/issue-68-phase-b38-component-mirror-residual.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research(issue-68): persist B3.8 mirror residual report"
          git pull --rebase origin research/issue-68-lifecycle-retest-symmetry-repaired
          git push origin HEAD:research/issue-68-lifecycle-retest-symmetry-repaired
