name: Wyckoff v0.6 Phase B Live-Window Decision

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/v06_live_window.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_live_window.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_live_report.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.*"
      - ".github/workflows/wyckoff-v06-phase-b-live.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/v06_live_window.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_live_window.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_live_report.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.*"
      - ".github/workflows/wyckoff-v06-phase-b-live.yml"

permissions:
  contents: write

jobs:
  live-window-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile live-window modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/v06_live_window.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_phase_b_live_window.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_live_report.py
      - name: Generate deterministic warmup-excluded Phase B report
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/reports
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_live_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_b_live_report.py \
            --json-output /tmp/issue-57-phase-b-live-window.json \
            --md-output /tmp/issue-57-phase-b-live-window.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.json /tmp/issue-57-phase-b-live-window.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.md /tmp/issue-57-phase-b-live-window.md
      - name: Commit warmup-excluded Phase B report on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-b-live-window.md
          if git diff --cached --quiet; then
            echo "Issue #57 Phase B live-window report already current."
          else
            git commit -m "Record Issue #57 Phase B live-window decision report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
