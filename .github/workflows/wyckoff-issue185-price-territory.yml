name: Wyckoff Issue 185 Price Territory Engineering Review

on:
  push:
    branches:
      - research/issue-185-price-territory-engineering-review
    paths:
      - '.github/workflows/wyckoff-issue185-price-territory.yml'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_charts.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_range_regime.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_real_cohort.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-185-price-territory-*.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue185-price-territory.yml'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_charts.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_range_regime.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_real_cohort.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-185-price-territory-*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas pillow==12.3.0 pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory_charts.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_addon_policy.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_range_regime.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue185_real_cohort.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py

      - name: PTM engineering review tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m pytest -q test_issue185_price_territory.py
          python -m pytest -q test_issue185_addon_policy.py

      - name: Artifact reproducibility (text artifacts, byte-for-byte)
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python analyze_issue185_price_territory.py --outdir /tmp/issue185_out
          python analyze_issue185_price_territory.py --outdir /tmp/issue185_out2
          # issue185_real_cohort_manifest.json is OPERATOR-SIDE provenance: it is
          # produced by analyze_issue185_real_cohort.py against private market
          # data that CI does not have, so it is committed but never regenerated
          # here. Everything else must reproduce byte-for-byte.
          diff -r --exclude=charts \
                  --exclude=issue185_real_cohort_manifest.json \
                  artifacts/issue185_price_territory /tmp/issue185_out
          echo "text artifacts reproduce byte-for-byte"

      - name: Chart determinism and structural sanity
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          # Charts are rendered with Pillow's bundled default font so that the
          # renderer has no OS-dependent font lookup; PNG bytes are compared
          # between two runs on this runner rather than across platforms.
          diff -r /tmp/issue185_out/charts /tmp/issue185_out2/charts
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          charts = sorted(Path("/tmp/issue185_out/charts").glob("*.png"))
          assert len(charts) == 10, f"expected 10 charts, found {len(charts)}"
          for p in charts:
              with Image.open(p) as im:
                  assert im.size == (1180, 980) or im.size == (1180, 650), (p.name, im.size)
          print(f"chart artifacts ok: {len(charts)}")
          PY

      - name: Phase-2 evidence artifacts present and self-consistent
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out = Path("/tmp/issue185_out")
          # The two artifacts that carry the phase-2 evidence must exist.
          for name in ("issue185_ptm_phase2_comparison.csv",
                       "issue185_ptm_promotion_clock.csv"):
              assert (out / name).is_file(), f"missing {name}"

          summary = json.loads((out / "issue185_ptm_summary.json").read_text("utf-8"))

          # The published v0.2 readouts must still be reproduced exactly.
          assert summary["reproduction"]["all_episodes_match"] is True
          assert summary["reproduction"]["all_novelty_match"] is True

          # The phase-2 guards must be ON by default in the frozen configuration.
          assert summary["config_fingerprint"]["apply_phase2_guards"] is True

          # The blocking wide-box false release must be closed ...
          po = summary["phase2_outcomes"]
          assert po["long_period_box_v02_claim_bars"] > 0
          assert po["long_period_box_phase2_claim_bars"] == 0

          # ... the genuine-trend cost must still be reported, not silently dropped.
          assert po["genuine_trends_refused_certification"], "cost must be reported"

          # A guard must never add waiting bars, and PTM must not be charged a
          # delay against the corrected B3 baseline.
          assert po["max_added_delay_vs_v02_bars"] == 0
          assert po["max_ptm_extra_delay_vs_corrected_model_baseline_bars"] == 0
          # ... and that headline is scoped to fixtures that still claim, because
          # a suppressed fixture has no fixed-signal first claim at all.
          assert "unbounded" in po["max_added_delay_vs_v02_bars_scope"]

          # Audit hardening: each A1 ENVELOPE sub-guard must be pinned by a
          # fixture that trips ONLY that sub-guard. Without these two fixtures
          # either envelope guard can be deleted with the whole suite still
          # green (the phase-2 audit demonstrated exactly that with mutants).
          with (out / "issue185_ptm_phase2_comparison.csv").open(newline="") as fh:
              cmp_rows = {r["fixture"]: r for r in csv.DictReader(fh)}
          for name, needle in (("envelope_gap_only", "unobserved price gap"),
                               ("envelope_coverage_only", "envelope fraction")):
              row = cmp_rows[name]
              assert row["validity"] == "DEGRADED_REFERENCE_ADEQUACY", (name, row)
              assert int(row["validity_reason_count"]) == 1, (name, row)
              assert needle in row["validity_reasons"], (name, row)
              assert int(row["phase2_claim_bars_total"]) == 0, (name, row)
              assert int(row["v02_claim_bars_total"]) > 0, (name, row)

          # The old probe+3 baseline must be shown to be wrong.
          with (out / "issue185_ptm_promotion_clock.csv").open(newline="") as fh:
              rows = {r["scenario"]: r for r in csv.DictReader(fh)}
          r = rows["breakout_10_bars_after_probe"]
          assert float(r["eligible_promotion_t"]) == 133.0, r
          assert float(r["naive_probe_plus_three_t"]) == 123.0, r
          assert float(r["naive_baseline_error_bars"]) == 10.0, r
          print("phase-2 evidence artifacts ok")
          PY

      - name: C1-only convergence evidence (dispositions, stratum, retirement)
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out = Path("/tmp/issue185_out")
          for name in ("issue185_ptm_addon_policy.csv",
                       "issue185_ptm_omin_sensitivity.csv",
                       "issue185_ptm_parent_provenance.json"):
              assert (out / name).is_file(), f"missing {name}"

          summary = json.loads((out / "issue185_ptm_summary.json").read_text("utf-8"))
          addon = summary["addon_policy"]

          # ---- 1. Exactly one ACTIVE challenger: C1. C2 is retired. ----------
          assert addon["active_challengers"] == ["C1_PTM_GUARD"], addon["active_challengers"]
          assert addon["active_challenger_count"] == 1
          assert addon["retired_challengers"] == ["C2_PTM_GUARD_DWELL"]
          assert addon["dwell_bars_omin_historical"] == 3
          assert "claim-PERSISTENCE" in addon["retired_note"], addon["retired_note"]
          assert "never be described as occupancy" in addon["retired_note"], \
              addon["retired_note"]
          assert "not an active candidate" in addon["retired_note"], addon["retired_note"]

          # ---- 2. Disposition taxonomy: every category declared & enumerated.
          assert len(addon["declared_dispositions"]) == 7, addon["declared_dispositions"]
          dist = addon["c1_disposition_distribution"]
          assert set(addon["declared_dispositions"]) <= set(dist), dist
          entitled = addon["fixtures_with_parent_addon_entitlement"]
          not_eligible = addon["fixtures_without_parent_entitlement"]
          counted = sum(v for k, v in dist.items() if not k.startswith("_"))
          assert counted == addon["fixtures_evaluated"] == entitled + not_eligible, \
              (counted, addon["fixtures_evaluated"], entitled, not_eligible)
          assert addon["c1_parent_not_eligible"] == not_eligible
          # The entitled episodes must split exactly into the four outcomes.
          assert (addon["c1_promoted"] + addon["c1_observation_right_censored"]
                  + addon["c1_policy_withheld_through_expiry"]
                  + addon["c1_baseline_de_risk_before_release"]) == entitled, addon

          # ---- 3. THE central correction: censoring != permanent withholding.
          #      The synthetic set cannot establish a definite withholding, so
          #      60.9% is withdrawn and the withheld share is a vacuous 0.
          assert addon["c1_superseded_figure"]["status"] == "WITHDRAWN"
          assert "60.9%" in addon["c1_superseded_figure"]["value"]
          assert addon["c1_definite_withholding_estimable_from_synthetics"] is False
          assert addon["c1_policy_withheld_through_expiry"] == 0
          assert addon["c1_fixtures_reaching_expiry"] >= 1
          assert addon["c1_fixtures_reaching_expiry"] < entitled
          assert addon["c1_evaluable_episodes"] == (
              addon["c1_promoted"] + addon["c1_policy_withheld_through_expiry"]
              + addon["c1_baseline_de_risk_before_release"]), addon
          assert addon["c1_withheld_share_of_evaluable"] == 0.0, addon[
              "c1_withheld_share_of_evaluable"]
          assert "CANNOT estimate" in addon["c1_horizon_adequacy_note"]
          assert "right-censored" in addon["c1_horizon_adequacy_note"]
          # The denominator rule must name BOTH the numerator and the denominator.
          denom = addon["c1_denominator_note"].lower()
          assert "numerator" in denom and "denominator" in denom, denom
          assert "60.9%" in addon["c1_denominator_note"]
          assert "withdrawn" in denom

          # The zero "signal contradiction" count is an INVARIANT, not evidence.
          assert addon["c1_signal_gate_invariant_holds"] is True
          assert addon["c1_signal_gate_invariant_violations"] == []
          note = addon["c1_signal_gate_invariant_note"].lower()
          assert "invariant, not evidence" in note and "tautology" in note

          # ---- 4. The three fixtures the review named by hand ----------------
          with (out / "issue185_ptm_addon_policy.csv").open(newline="") as fh:
              rows = {r["fixture"]: r for r in csv.DictReader(fh)}
          for name in ("gappy_reference", "one_tick_breakout",
                       "crossed_but_not_closed"):
              row = rows[name]
              assert row["c1_disposition"] == "OBSERVATION_RIGHT_CENSORED", (name, row)
              assert row["c1_followup_complete"] == "False", (name, row)
              assert row["c1_withheld_definite"] == "False", (name, row)
              assert float(row["last_observed_bar"]) < float(row["eligible_promotion_bar"]), \
                  (name, row)

          # ---- 5. Censoring-aware invariants over every row -------------------
          for row in rows.values():
              # A withheld add-on is never rendered as 0 bars of delay.
              if row["c1_censored"] == "True":
                  assert row["c1_extra_delay_bars"] == "", (row["fixture"])
                  assert row["c1_first_executable_bar"] == "", (row["fixture"])
              # A definite withholding requires a complete follow-up horizon.
              if row["c1_withheld_definite"] == "True":
                  assert row["c1_followup_complete"] == "True", (row["fixture"])
                  assert row["c1_disposition"] == "POLICY_WITHHELD_THROUGH_EXPIRY"
              # PARENT_NOT_ELIGIBLE is never counted as a PTM cost.
              if row["parent_earns_addon"] == "False":
                  assert row["c1_withheld_definite"] == "False", (row["fixture"])
                  assert row["c1_censored"] == "False", (row["fixture"])

          # The blocking wide-box false release must also lose its ADD-ON.
          lpb = rows["long_period_box"]
          assert lpb["c1_disposition"] in ("POLICY_WITHHELD_THROUGH_EXPIRY",
                                           "OBSERVATION_RIGHT_CENSORED"), lpb
          assert lpb["c1_extra_delay_bars"] == "", lpb

          # ---- 6. The ex-ante stratum (Sophira S2) ---------------------------
          w = addon["wide_box_stratum"]
          assert w["feature"] == "width_atr", w
          # A tautological criterion yields exactly 1 distinct value.
          assert w["synthetic_distinct_width_atr_values"] > 1, w
          assert w["discriminates"] is True, w
          assert w["sustained_escape_is_outcome_only"] is True, w
          assert w["width_atr_edges_frozen"] == [7.368, 11.9931], w
          assert w["atr_window_bars"] == 14 and w["reference_bars"] == 120, w
          # The three superseded criteria must be named as superseded.
          sup = w["superseded_criteria"]
          assert "IDENTITY" in sup["spread_over_w"], sup
          assert "sparse" in sup["R_le_1_plus_claim"].lower(), sup
          assert "outcome-only" in sup["sustained_escape_stratum"], sup
          for row in rows.values():
              assert row["range_status"] in ("OK", "UNAVAILABLE"), row
              if row["range_status"] == "UNAVAILABLE":
                  assert row["width_bin"] == "" and row["range_reason"], row
              else:
                  assert row["width_bin"] in ("NARROW", "MID", "WIDE"), row

          # ---- 7. The trusted-abstain scope correction ----------------------
          ab = addon["abstain_branch"]
          assert ab["reachable"] is False, ab["counterexamples"]
          assert ab["counterexamples"] == []
          assert "WRONG" in ab["scope_correction"], ab
          assert "BASELINE_ON_DEGRADED_ALTERNATIVE" in ab["prereg_consequence"], ab
          assert "cannot be exercised" not in ab["prereg_consequence"]

          # ---- 8. Retired o_min sensitivity is not a decision surface --------
          sens = {int(r["o_min"]): r for r in summary["omin_sensitivity"]}
          for row in sens.values():
              assert row["status"] == "RETIRED_NOT_AN_ACTIVE_CHALLENGER", row

          # ---- 9. Parent (#78) provenance ------------------------------------
          prov = summary["parent_event_provenance"]
          assert prov["event_source_marker"] == "ISSUE76|schema=1"
          assert prov["baseline_policy"] == "R0_Immediate"
          assert prov["parity_constants"] == {
              "EXPECTED_EVENTS": 68118, "EXPECTED_EPISODES": 1624,
              "EXPECTED_B3_EVENTS": 997, "EXPECTED_P12": 236}
          assert prov["rehearsal"]["all_four_constants_match"] is True
          comp = prov["path_composition_from_rehearsal"]
          assert comp["adds_at_t3"] + comp["never_adds"] == 997, comp
          assert comp["P1_WickHold"] + comp["P2_Reclaim"] == 236, comp
          assert (comp["P0_NoTouch"] + comp["P1_WickHold"] + comp["P2_Reclaim"]
                  == comp["adds_at_t3"]), comp
          assert prov["freeze_status"] == "PENDING_SOPHIRA_APPROVAL"
          assert "NOT committed" in prov["export_note"]
          # The private manifest is OPTIONAL: CI has no private export. If it is
          # present it must be internally consistent; if absent, nothing is
          # fabricated. Either way this step must not require the raw data.
          m = prov.get("real_input_manifest")
          if m is not None:
              assert m["feature_only"] is True and m["outcomes_computed"] is False
              assert m["raw_data_committed"] is False
              assert m["parity"]["observed"]["b3_events"] == 997
              assert m["width_atr_tertile_edges"] == [7.368, 11.9931], m[
                  "width_atr_tertile_edges"]
          print("C1-only convergence evidence ok")
          PY

      - name: Private export is never a CI requirement
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          # The real-cohort script must fail loudly when pointed at data whose
          # parity disagrees, and must exit 2 (not crash) when no export exists,
          # so CI stays green without the private market data.
          python - <<'PY'
          import subprocess, sys, tempfile
          from pathlib import Path

          empty = Path(tempfile.mkdtemp())
          r = subprocess.run(
              [sys.executable, "analyze_issue185_real_cohort.py",
               "--export-glob", str(empty / "definitely-not-here-*.csv"),
               "--outdir", str(empty / "out")],
              capture_output=True, text=True, encoding="utf-8", errors="replace")
          assert r.returncode == 2, (r.returncode, r.stdout[-500:], r.stderr[-800:])
          combined = (r.stdout + r.stderr).lower()
          assert "private" in combined or "operator" in combined or "export" in combined, \
              combined[-800:]
          assert not (empty / "out").exists() or not any(
              (empty / "out").iterdir()), "no artifact may be written without data"
          print("private export correctly optional")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue185-price-territory-artifacts
          path: indicators/wyckoff-regime-radar/research/artifacts/issue185_price_territory

      - name: Diff check
        run: git diff --check
