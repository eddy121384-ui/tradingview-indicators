name: Wyckoff Issue 185 Price Territory Engineering Review

on:
  push:
    branches:
      - research/issue-185-price-territory-engineering-review
      - research/issue-185-c1-prereg-sophira
    paths:
      - '.github/workflows/wyckoff-issue185-price-territory.yml'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_charts.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_c1_prereg.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_c1_prereg.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-185-price-territory-*.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue185-price-territory.yml'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_territory_charts.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/ptm_c1_prereg.py'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue185_c1_prereg.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-185-price-territory-*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas pillow==12.3.0 pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory_fixtures.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_territory_charts.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_promotion_clock.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_addon_policy.py
          python -m py_compile indicators/wyckoff-regime-radar/research/ptm_c1_prereg.py
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue185_price_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue185_price_territory.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue185_addon_policy.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue185_c1_prereg.py

      - name: PTM engineering review tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m pytest -q test_issue185_price_territory.py
          python -m pytest -q test_issue185_addon_policy.py
          python -m pytest -q test_issue185_c1_prereg.py

      - name: Artifact reproducibility (text artifacts, byte-for-byte)
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python analyze_issue185_price_territory.py --outdir /tmp/issue185_out
          python analyze_issue185_price_territory.py --outdir /tmp/issue185_out2
          diff -r --exclude=charts artifacts/issue185_price_territory /tmp/issue185_out
          echo "text artifacts reproduce byte-for-byte"

      - name: Chart determinism and structural sanity
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          # Charts are rendered with Pillow's bundled default font so that the
          # renderer has no OS-dependent font lookup; PNG bytes are compared
          # between two runs on this runner rather than across platforms.
          diff -r /tmp/issue185_out/charts /tmp/issue185_out2/charts
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          charts = sorted(Path("/tmp/issue185_out/charts").glob("*.png"))
          assert len(charts) == 10, f"expected 10 charts, found {len(charts)}"
          for p in charts:
              with Image.open(p) as im:
                  assert im.size == (1180, 980) or im.size == (1180, 650), (p.name, im.size)
          print(f"chart artifacts ok: {len(charts)}")
          PY

      - name: Phase-2 evidence artifacts present and self-consistent
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out = Path("/tmp/issue185_out")
          # The two artifacts that carry the phase-2 evidence must exist.
          for name in ("issue185_ptm_phase2_comparison.csv",
                       "issue185_ptm_promotion_clock.csv"):
              assert (out / name).is_file(), f"missing {name}"

          summary = json.loads((out / "issue185_ptm_summary.json").read_text("utf-8"))

          # The published v0.2 readouts must still be reproduced exactly.
          assert summary["reproduction"]["all_episodes_match"] is True
          assert summary["reproduction"]["all_novelty_match"] is True

          # The phase-2 guards must be ON by default in the frozen configuration.
          assert summary["config_fingerprint"]["apply_phase2_guards"] is True

          # The blocking wide-box false release must be closed ...
          po = summary["phase2_outcomes"]
          assert po["long_period_box_v02_claim_bars"] > 0
          assert po["long_period_box_phase2_claim_bars"] == 0

          # ... the genuine-trend cost must still be reported, not silently dropped.
          assert po["genuine_trends_refused_certification"], "cost must be reported"

          # A guard must never add waiting bars, and PTM must not be charged a
          # delay against the corrected B3 baseline.
          assert po["max_added_delay_vs_v02_bars"] == 0
          assert po["max_ptm_extra_delay_vs_corrected_model_baseline_bars"] == 0
          # ... and that headline is scoped to fixtures that still claim, because
          # a suppressed fixture has no fixed-signal first claim at all.
          assert "unbounded" in po["max_added_delay_vs_v02_bars_scope"]

          # Audit hardening: each A1 ENVELOPE sub-guard must be pinned by a
          # fixture that trips ONLY that sub-guard. Without these two fixtures
          # either envelope guard can be deleted with the whole suite still
          # green (the phase-2 audit demonstrated exactly that with mutants).
          with (out / "issue185_ptm_phase2_comparison.csv").open(newline="") as fh:
              cmp_rows = {r["fixture"]: r for r in csv.DictReader(fh)}
          for name, needle in (("envelope_gap_only", "unobserved price gap"),
                               ("envelope_coverage_only", "envelope fraction")):
              row = cmp_rows[name]
              assert row["validity"] == "DEGRADED_REFERENCE_ADEQUACY", (name, row)
              assert int(row["validity_reason_count"]) == 1, (name, row)
              assert needle in row["validity_reasons"], (name, row)
              assert int(row["phase2_claim_bars_total"]) == 0, (name, row)
              assert int(row["v02_claim_bars_total"]) > 0, (name, row)

          # The old probe+3 baseline must be shown to be wrong.
          with (out / "issue185_ptm_promotion_clock.csv").open(newline="") as fh:
              rows = {r["scenario"]: r for r in csv.DictReader(fh)}
          r = rows["breakout_10_bars_after_probe"]
          assert float(r["eligible_promotion_t"]) == 133.0, r
          assert float(r["naive_probe_plus_three_t"]) == 123.0, r
          assert float(r["naive_baseline_error_bars"]) == 10.0, r
          print("phase-2 evidence artifacts ok")
          PY

      - name: Prereg-clarification evidence present and self-consistent
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out = Path("/tmp/issue185_out")
          for name in ("issue185_ptm_addon_policy.csv",
                       "issue185_ptm_omin_sensitivity.csv",
                       "issue185_ptm_parent_provenance.json"):
              assert (out / name).is_file(), f"missing {name}"

          summary = json.loads((out / "issue185_ptm_summary.json").read_text("utf-8"))
          addon = summary["addon_policy"]

          # C1 must never withhold an add-on that the phase-2 signal itself
          # endorsed with a claim at or after the eligibility bar.
          assert addon["c1_newly_introduced_suppression_count"] == 0, addon[
              "c1_newly_introduced_suppressions"]

          # The central honesty invariant: a withheld add-on is CENSORED.  Its
          # delay is unbounded and must never be rendered as 0 bars.
          assert addon["censored_never_reported_as_zero"] is True
          with (out / "issue185_ptm_addon_policy.csv").open(newline="") as fh:
              rows = {r["fixture"]: r for r in csv.DictReader(fh)}
          for row in rows.values():
              for tag in ("c1", "c2"):
                  if row[f"{tag}_censored"] == "True":
                      assert row[f"{tag}_extra_delay_bars"] == "", (row["fixture"], tag)
                      assert row[f"{tag}_first_executable_bar"] == "", (row["fixture"], tag)

          # The blocking wide-box false release must also lose its ADD-ON, not
          # merely its informational NEW claim.
          assert rows["long_period_box"]["c1_status"] == "WITHHOLD_CENSORED", rows["long_period_box"]

          # The declared genuine-trend cost must stay visible and censored.
          assert "one_way_reference_genuine_trend" in addon[
              "c1_censored_genuine_sustained_escapes"]
          assert rows["one_way_reference_genuine_trend"]["c1_extra_delay_bars"] == ""

          # o_min must not be degenerate, and must sit before the cliff.
          sens = {int(r["o_min"]): r for r in summary["omin_sensitivity"]}
          assert sens[1]["is_degenerate_equals_c1"] is True
          assert sens[3]["equals_parent_confirmation_bars"] is True
          assert sens[3]["is_degenerate_equals_c1"] is False
          assert sens[3]["released"] == sens[2]["released"], sens
          assert sens[4]["released"] < sens[3]["released"], sens

          # Parent (#78) provenance: the frozen parity constants and the causal
          # path composition must be internally consistent.
          prov = summary["parent_event_provenance"]
          assert prov["event_source_marker"] == "ISSUE76|schema=1"
          assert prov["baseline_policy"] == "R0_Immediate"
          assert prov["parity_constants"] == {
              "EXPECTED_EVENTS": 68118, "EXPECTED_EPISODES": 1624,
              "EXPECTED_B3_EVENTS": 997, "EXPECTED_P12": 236}
          assert prov["rehearsal"]["all_four_constants_match"] is True
          comp = prov["path_composition_from_rehearsal"]
          assert comp["adds_at_t3"] + comp["never_adds"] == 997, comp
          assert comp["P1_WickHold"] + comp["P2_Reclaim"] == 236, comp
          assert (comp["P0_NoTouch"] + comp["P1_WickHold"] + comp["P2_Reclaim"]
                  == comp["adds_at_t3"]), comp
          assert prov["freeze_status"] == "PENDING_SOPHIRA_APPROVAL"
          print("prereg-clarification evidence ok")
          PY

      - name: C1-only prereg synthetic audit (no outcomes)
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python ptm_c1_prereg.py > /tmp/issue185_c1_prereg.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/issue185_c1_prereg.json").read_text())
          assert d["active_challengers"] == ["C1_PTM_GUARD"]
          assert len(d["rows"]) == 33
          r = {x["fixture"]: x["disposition"] for x in d["rows"]}
          for key in ("gappy_reference", "one_tick_breakout", "crossed_but_not_closed"):
              assert r[key]["status"] == "OBSERVATION_RIGHT_CENSORED", (key, r[key])
              assert not r[key]["established_policy_missed_addon"], (key, r[key])
          assert sum(d["disposition_counts"].values()) == 33
          print("C1-only dispositions (synthetic, not market):", d["disposition_counts"])
          print("C1-only ex-ante range/censoring audit ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue185-price-territory-artifacts
          path: |
            indicators/wyckoff-regime-radar/research/artifacts/issue185_price_territory
            /tmp/issue185_c1_prereg.json

      - name: Diff check
        run: git diff --check
