name: Wyckoff Issue 78 Bloomberg Equity OOS2

on:
  push:
    branches:
      - research/issue-78-equity-oos2-diagnostic
    paths:
      - '.github/workflows/wyckoff-issue78-bbg-equity-oos2.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_bbg_equity_oos2.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_bbg_equity_oos2.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-bloomberg-300-stock-diagnostic-amendment.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue78-bbg-equity-oos2.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_bbg_equity_oos2.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_bbg_equity_oos2.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-bloomberg-300-stock-diagnostic-amendment.md'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas scipy pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_bbg_equity_oos2.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_bbg_equity_oos2.py

      - name: Frozen analyzer tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m pytest -q test_issue78_bbg_equity_oos2.py

      - name: Diff check
        run: git diff --check
