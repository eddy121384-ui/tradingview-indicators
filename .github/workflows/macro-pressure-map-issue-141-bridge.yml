name: Macro Pressure Map Issue 141 Signal Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "indicators/macro-pressure-map/research/issue-141-monthly-analogue-bridge-prereg.md"
      - "indicators/macro-pressure-map/research/issue_141_source_acquisition.py"
      - "indicators/macro-pressure-map/research/issue_141_signal_bridge.py"
      - "indicators/macro-pressure-map/research/test_issue_141_signal_bridge.py"
      - ".github/workflows/macro-pressure-map-issue-141-bridge.yml"

permissions:
  contents: read

jobs:
  signal-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Issue 141 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout frozen exact V6.6 signal snapshot
        uses: actions/checkout@v4
        with:
          ref: 752755d423c1a13415d8ad3647c3def74adaa2d8
          path: issue133

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signal-bridge dependencies
        run: python -m pip install numpy pandas requests beautifulsoup4 openpyxl pytest

      - name: Validate preregistration freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/issue-141-monthly-analogue-bridge-prereg.md")
          s=p.read_text(encoding="utf-8")
          required=[
              "FROZEN BEFORE ANY ANALOGUE-vs-EXACT BRIDGE METRIC",
              "zLen = 12",
              "fastLen = 1",
              "midLen = 3",
              "2017-01 through latest common completed exact/analogue month",
              "GPI Pearson correlation >= 0.70",
              "trigger F1 within +/-1 month >= 0.60",
              "validated_for_outcome_testing",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          PY

      - name: Static and unit tests
        run: |
          python -m py_compile current/indicators/macro-pressure-map/research/issue_141_source_acquisition.py
          python -m py_compile current/indicators/macro-pressure-map/research/issue_141_signal_bridge.py
          cd current/indicators/macro-pressure-map/research
          pytest -q test_issue_141_signal_bridge.py

      - name: Run frozen signal-only bridge
        run: |
          rm -rf current/indicators/macro-pressure-map/research/generated/issue-141
          python current/indicators/macro-pressure-map/research/issue_141_signal_bridge.py \
            --issue133-root issue133/indicators/macro-pressure-map/research \
            --output-dir current/indicators/macro-pressure-map/research/generated/issue-141

      - name: Validate research firewall and result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("current/indicators/macro-pressure-map/research/generated/issue-141/issue-141-result.json")
          r=json.loads(p.read_text())
          assert r["issue"] == 141
          assert r["outcome_data_loaded"] is False
          assert r["production_authorized"] is False
          assert r["bridge"]["verdict"] in {
              "signal_bridge_passed",
              "signal_bridge_failed",
              "signal_bridge_inconclusive_sample",
          }
          assert r["bridge"]["validated_for_outcome_testing"] == (
              r["bridge"]["verdict"] == "signal_bridge_passed"
          )
          print({
              "verdict": r["bridge"]["verdict"],
              "validated": r["bridge"]["validated_for_outcome_testing"],
              "holdout": r["bridge"]["holdout"],
              "gates": r["bridge"]["gates"],
              "historical": r["historical_signal_sample"],
          })
          PY

      - name: Upload Issue 141 bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-141-signal-bridge
          path: current/indicators/macro-pressure-map/research/generated/issue-141
          retention-days: 3
          if-no-files-found: error
