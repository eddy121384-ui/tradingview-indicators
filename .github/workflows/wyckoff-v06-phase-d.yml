name: Wyckoff v0.6 Phase D Canonical Strength

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - "indicators/wyckoff-regime-radar/research/v06_state_mapping.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_canonical_strength.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_canonical_strength.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_d_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.*"
      - ".github/workflows/wyckoff-v06-phase-d.yml"
  pull_request:
    paths:
      - "indicators/wyckoff-regime-radar/research/v06_state_mapping.py"
      - "indicators/wyckoff-regime-radar/research/diagnose_v06_canonical_strength.py"
      - "indicators/wyckoff-regime-radar/research/test_diagnose_v06_canonical_strength.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue57_phase_d_report.py"
      - "indicators/wyckoff-regime-radar/research/generate_v06_phase_b_core.py"
      - "indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.*"
      - ".github/workflows/wyckoff-v06-phase-d.yml"

permissions:
  contents: write

jobs:
  canonical-strength:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r indicators/wyckoff-regime-radar/research/requirements.txt
      - name: Compile Phase D modules
        run: |
          python -m py_compile \
            indicators/wyckoff-regime-radar/research/v06_state_mapping.py \
            indicators/wyckoff-regime-radar/research/diagnose_v06_canonical_strength.py \
            indicators/wyckoff-regime-radar/research/test_diagnose_v06_canonical_strength.py \
            indicators/wyckoff-regime-radar/research/generate_issue57_phase_d_report.py
      - name: Run Phase D tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m unittest -v test_diagnose_v06_canonical_strength
      - name: Generate deterministic Phase D report
        run: |
          mkdir -p indicators/wyckoff-regime-radar/research/reports
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_d_report.py \
            --json-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.json \
            --md-output indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.md
          python indicators/wyckoff-regime-radar/research/generate_issue57_phase_d_report.py \
            --json-output /tmp/issue-57-phase-d-canonical-strength.json \
            --md-output /tmp/issue-57-phase-d-canonical-strength.md
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.json /tmp/issue-57-phase-d-canonical-strength.json
          cmp indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.md /tmp/issue-57-phase-d-canonical-strength.md
      - name: Commit Phase D report on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.json \
            indicators/wyckoff-regime-radar/research/reports/issue-57-phase-d-canonical-strength.md
          if git diff --cached --quiet; then
            echo "Issue #57 Phase D report already current."
          else
            git commit -m "Record Issue #57 Phase D canonical strength audit"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
