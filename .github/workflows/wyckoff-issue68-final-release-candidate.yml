name: Wyckoff Issue 68 Final Release Candidate

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_final_release_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_yield_safe_hard_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_hard_current_context_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-yield-safe-hard-six-market-regression-final-finding.md"
      - ".github/workflows/wyckoff-issue68-final-release-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_final_release_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_yield_safe_hard_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/generate_issue68_hard_current_context_production_candidate_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-yield-safe-hard-six-market-regression-final-finding.md"
      - ".github/workflows/wyckoff-issue68-final-release-candidate.yml"

permissions:
  contents: write

jobs:
  final-release-candidate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator chain
        run: |
          python -m py_compile generate_issue68_hard_current_context_production_candidate_pine.py
          python -m py_compile generate_issue68_yield_safe_hard_production_candidate_pine.py
          python -m py_compile generate_issue68_final_release_candidate_pine.py

      - name: Generate clean RC source
        run: |
          python generate_issue68_final_release_candidate_pine.py \
            --output ../src/chase-risk-market-regime-radar-issue68-rc.pine

          test -s ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'Issue #68 RC' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'autoYieldLevel = syminfo.type == "bond" and syminfo.currency == "NONE"' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'ctxDownExGate = math.min(downsideExhaustionGate, currentBearGate)' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'ctxUpExGate = math.min(upsideExhaustionGate, currentBullGate)' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'linestyle=plot.linestyle_dashed' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'color.rgb(110, 190, 135)' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'color.rgb(245, 140, 45)' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          grep -q 'alertcondition(formalChanged' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          ! grep -q 'issue68AB' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          ! grep -q '#68 A Baseline TOP' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          ! grep -q 'strategy\.entry' ../src/chase-risk-market-regime-radar-issue68-rc.pine
          echo 'Issue #68 final release-candidate contract PASS'

      - name: Commit generated RC source on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/src/chase-risk-market-regime-radar-issue68-rc.pine
          if git diff --cached --quiet; then
            echo "Final RC source already current."
            exit 0
          fi
          git commit -m "release: generate Issue 68 final RC source [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
