name: Wyckoff Issue 66 Symmetry Phase C2

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_c2_stage14_conflict_core.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c1_candidate_conflict_preaudit.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c1_candidate_conflict_preaudit.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c_persistence_localization_v3.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c_persistence_localization.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c2-stage14-conflict-repair-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c2.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_c2_stage14_conflict_core.py'
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_c2_stage14_conflict.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-c2-stage14-conflict-repair-plan.md'
      - '.github/workflows/wyckoff-issue66-symmetry-phase-c2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase-c2-stage14-conflict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile Phase C2 experiment
        run: |
          python -m py_compile generate_issue66_phase_c2_stage14_conflict_core.py
          python -m py_compile diagnose_issue66_phase_c2_stage14_conflict.py
          python -m py_compile test_issue66_phase_c2_stage14_conflict.py
      - name: Reconfirm accepted Phase C persistence contract
        run: python -m unittest -v test_issue66_phase_c_persistence_localization
      - name: Reconfirm Phase C1 conflict attribution contract
        run: python -m unittest -v test_issue66_phase_c1_candidate_conflict_preaudit
      - name: Run Phase C2 Stage1-4 conflict contract
        run: python -m unittest -v test_issue66_phase_c2_stage14_conflict
      - name: Run Phase C2 A/B diagnostic
        run: |
          python diagnose_issue66_phase_c2_stage14_conflict.py \
            --json reports/issue-66-phase-c2-stage14-conflict-ab.json \
            --markdown reports/issue-66-phase-c2-stage14-conflict-ab.md
          cat reports/issue-66-phase-c2-stage14-conflict-ab.md
      - name: Commit Phase C2 reports on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-66-wyckoff-directional-symmetry-repair'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c2-stage14-conflict-ab.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-66-phase-c2-stage14-conflict-ab.md
          if git diff --cached --quiet; then
            echo "No Issue 66 Phase C2 report changes to commit"
          else
            git commit -m "research: record Issue 66 Phase C2 Stage1-4 conflict A/B [skip ci]"
            git push
          fi
