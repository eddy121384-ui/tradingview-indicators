name: Wyckoff Issue 78 Equity Early-Proof Replication

on:
  push:
    branches:
      - research/issue-78-equity-early-proof-replication
    paths:
      - '.github/workflows/wyckoff-issue78-equity-early-proof-replication.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_equity_early_proof_replication.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_equity_early_proof_replication.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-equity-early-proof-replication-preregistration.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue78-equity-early-proof-replication.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_equity_early_proof_replication.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_equity_early_proof_replication.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-equity-early-proof-replication-preregistration.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas scipy pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_equity_early_proof_replication.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_equity_early_proof_replication.py

      - name: Frozen replication tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m pytest -q test_issue78_equity_early_proof_replication.py

      - name: Diff check
        run: git diff --check
