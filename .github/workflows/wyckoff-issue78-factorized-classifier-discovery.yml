name: Wyckoff Issue 78 Factorized Classifier Discovery

on:
  push:
    branches:
      - research/issue-78-factorized-classifier-architecture
    paths:
      - '.github/workflows/wyckoff-issue78-factorized-classifier-discovery.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_factorized_classifier_discovery.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_factorized_classifier_discovery.py'
      - 'indicators/wyckoff-regime-radar/research/build_issue78_factorized_classifier_oos4_universe.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-factorized-classifier-architecture-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-factorized-classifier-discovery-amendment.md'
  pull_request:
    paths:
      - '.github/workflows/wyckoff-issue78-factorized-classifier-discovery.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_factorized_classifier_discovery.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue78_factorized_classifier_discovery.py'
      - 'indicators/wyckoff-regime-radar/research/build_issue78_factorized_classifier_oos4_universe.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas scipy pytest

      - name: Syntax
        run: |
          python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_factorized_classifier_discovery.py
          python -m py_compile indicators/wyckoff-regime-radar/research/test_issue78_factorized_classifier_discovery.py
          python -m py_compile indicators/wyckoff-regime-radar/research/build_issue78_factorized_classifier_oos4_universe.py

      - name: Discovery tests
        working-directory: indicators/wyckoff-regime-radar/research
        run: python -m pytest -q test_issue78_factorized_classifier_discovery.py

      - name: Diff check
        run: git diff --check
