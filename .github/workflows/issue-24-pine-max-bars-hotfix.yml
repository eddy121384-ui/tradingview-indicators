name: Apply Issue 24 Pine max-bars hotfix

on:
  pull_request:
    branches:
      - research/issue-50-rates-regime-utility
    paths:
      - .github/workflows/issue-24-pine-max-bars-hotfix.yml

permissions:
  contents: write

jobs:
  patch-generated-pine:
    if: github.head_ref == 'feat/issue-24-rates-k6-visual-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-24-rates-k6-visual-prototype

      - name: Enforce TradingView max_bars_back limit
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('indicators/hidden-regime-map/research/generate_rates_k6_pine.py')
          pine = Path('indicators/hidden-regime-map/pine/hidden-regime-map-us-rates-k6-visual.pine')
          workflow = Path('.github/workflows/hidden-regime-rates-k6-visual.yml')

          old = 'max_bars_back = 10000'
          new = 'max_bars_back = 5000'

          for path in (generator, pine):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one invalid max_bars_back value')
              path.write_text(text.replace(old, new), encoding='utf-8')

          text = workflow.read_text(encoding='utf-8')
          anchor = "          grep -F 'indicator(\"Hidden Regime Map — U.S. Rates K=6 Visual\"' \"$OUTPUT/pine/hidden-regime-map-us-rates-k6-visual.pine\"\n"
          checks = (
              anchor
              + "          grep -F 'max_bars_back = 5000' \"$OUTPUT/pine/hidden-regime-map-us-rates-k6-visual.pine\"\n"
              + "          if grep -F 'max_bars_back = 10000' \"$OUTPUT/pine/hidden-regime-map-us-rates-k6-visual.pine\"; then exit 1; fi\n"
          )
          if 'max_bars_back = 5000' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('generation workflow: indicator grep anchor not found exactly once')
              workflow.write_text(text.replace(anchor, checks), encoding='utf-8')
          PY

      - name: Verify hotfix
        run: |
          grep -F 'max_bars_back = 5000' indicators/hidden-regime-map/research/generate_rates_k6_pine.py
          grep -F 'max_bars_back = 5000' indicators/hidden-regime-map/pine/hidden-regime-map-us-rates-k6-visual.pine
          if grep -R -F 'max_bars_back = 10000' \
            indicators/hidden-regime-map/research/generate_rates_k6_pine.py \
            indicators/hidden-regime-map/pine/hidden-regime-map-us-rates-k6-visual.pine; then
            exit 1
          fi

      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            indicators/hidden-regime-map/research/generate_rates_k6_pine.py \
            indicators/hidden-regime-map/pine/hidden-regime-map-us-rates-k6-visual.pine \
            .github/workflows/hidden-regime-rates-k6-visual.yml
          git commit -m 'fix: respect Pine max_bars_back limit'
          git push origin HEAD:feat/issue-24-rates-k6-visual-prototype
