name: Wyckoff Issue 66 Phase D2 Visual Review

on:
  push:
    branches:
      - research/issue-66-wyckoff-directional-symmetry-repair
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d2_visual_review_pine.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_d2_visual_review.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-66-phase-d2-visual-review-plan.md'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1_parity_pine.py'
      - 'indicators/wyckoff-regime-radar/research/pine_math.py'
      - 'indicators/wyckoff-regime-radar/src/chase-risk-market-regime-radar-v0.5.2.1.pine'
      - '.github/workflows/wyckoff-issue66-phase-d2-visual-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d2_visual_review_pine.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue66_phase_d2_visual_review.py'
      - 'indicators/wyckoff-regime-radar/research/generate_issue66_phase_d1_parity_pine.py'
      - 'indicators/wyckoff-regime-radar/research/pine_math.py'
      - 'indicators/wyckoff-regime-radar/src/chase-risk-market-regime-radar-v0.5.2.1.pine'
      - '.github/workflows/wyckoff-issue66-phase-d2-visual-review.yml'

permissions:
  contents: write

jobs:
  phase-d2-visual-review-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile D2 tooling
        run: |
          python -m py_compile generate_issue66_phase_d2_visual_review_pine.py
          python -m py_compile test_issue66_phase_d2_visual_review.py
      - name: Reconfirm Phase C closeout parent
        run: python -m unittest -v test_issue66_phase_c3_residual_forensic
      - name: Reconfirm D1 parity contracts
        run: |
          python -m unittest -v test_issue66_phase_d1_parity_pine
          python -m unittest -v test_issue66_phase_d1_tradingview_parity
      - name: Run D2 visual integration contract
        run: python -m unittest -v test_issue66_phase_d2_visual_review
      - name: Generate D2 visual-review Pine
        run: |
          python generate_issue66_phase_d2_visual_review_pine.py \
            --output generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          test -s generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          grep -q 'Issue #66 C-2 Visual Review' generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          grep -q '// Dashboard Table' generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          grep -q 'Issue #57 Phase-B stale-pressure persistence' generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          if grep -q 'PARITY formal_id' generated/wyckoff-issue66-phase-d2-c2-visual-review.pine; then
            echo 'Unexpected D1 parity export in D2 build' >&2
            exit 1
          fi
      - name: Commit generated D2 review build on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-66-wyckoff-directional-symmetry-repair'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue66-phase-d2-c2-visual-review.pine
          if git diff --cached --quiet; then
            echo "Generated D2 visual-review build already current."
          else
            git commit -m "research: record Issue 66 Phase D2 visual review build [skip ci]"
            git push
          fi
