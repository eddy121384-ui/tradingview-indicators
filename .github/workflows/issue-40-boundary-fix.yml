name: Apply Issue 40 Boundary Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-40-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-40-trading-utility

      - name: Apply boundary-aware trade metrics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"replacement not unique in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          evaluator = "indicators/hidden-regime-map/research/evaluate_trading_utility.py"
          replace_once(
              evaluator,
              'def trade_episode_metrics(frame: pd.DataFrame) -> dict[str, Any]:\n',
              'def trade_episode_metrics(\n    frame: pd.DataFrame, previous_position: float = 0.0\n) -> dict[str, Any]:\n',
          )
          replace_once(
              evaluator,
              '''    position = frame["position"].astype(float)
              active = position > 0.0
              starts = active & ~active.shift(1, fill_value=False)
              exits = active & ~active.shift(-1, fill_value=False)
              episode_id = starts.cumsum()
              left_censored = bool(active.iloc[0])
              right_censored = bool(active.iloc[-1])
          ''',
              '''    position = frame["position"].astype(float)
              active = position > 0.0
              prior_active = bool(previous_position > 0.0)
              previous_active = active.shift(1, fill_value=prior_active)
              starts = active & ~previous_active
              exits = active & ~active.shift(-1, fill_value=False)
              episode_id = starts.cumsum()
              left_censored = bool(active.iloc[0] and prior_active)
              right_censored = bool(active.iloc[-1])
          ''',
          )
          replace_once(
              evaluator,
              '''            if first_location > 0 and last_location < len(frame) - 1:
                  completed_round_trips += 1
          ''',
              '''            started_within_period = first_location > 0 or not prior_active
              exited_within_period = last_location < len(frame) - 1
              if started_within_period and exited_within_period:
                  completed_round_trips += 1
          ''',
          )
          replace_once(
              evaluator,
              '        "new_entries_within_period": int(starts.iloc[1:].sum()) if len(starts) > 1 else 0,\n',
              '        "new_entries_within_period": int(starts.sum()),\n',
          )
          replace_once(
              evaluator,
              'def performance_metrics(frame: pd.DataFrame) -> dict[str, Any]:\n',
              'def performance_metrics(\n    frame: pd.DataFrame, previous_position: float = 0.0\n) -> dict[str, Any]:\n',
          )
          replace_once(
              evaluator,
              '    metrics.update(trade_episode_metrics(frame))\n',
              '    metrics.update(trade_episode_metrics(frame, previous_position))\n',
          )
          replace_once(
              evaluator,
              '        metrics = performance_metrics(executed.iloc[period_slice])\n',
              '''        previous_position = (
              float(executed["position"].iloc[period_slice.start - 1])
              if period_slice.start and period_slice.start > 0
              else 0.0
          )
              metrics = performance_metrics(
                  executed.iloc[period_slice], previous_position=previous_position
              )
          ''',
          )

          tests = "indicators/hidden-regime-map/research/test_evaluate_trading_utility.py"
          replace_once(
              tests,
              '''        self.assertEqual(metrics["new_entries_within_period"], 1)
              self.assertEqual(metrics["exits_within_period"], 2)
              self.assertEqual(metrics["completed_round_trips"], 1)
              self.assertTrue(metrics["left_censored_trade"])
          ''',
              '''        self.assertEqual(metrics["new_entries_within_period"], 2)
              self.assertEqual(metrics["exits_within_period"], 2)
              self.assertEqual(metrics["completed_round_trips"], 2)
              self.assertFalse(metrics["left_censored_trade"])
          ''',
          )
          replace_once(
              tests,
              '        metrics = utility.trade_episode_metrics(frame)\n        self.assertEqual(metrics["trade_episode_count"], 1)\n',
              '        metrics = utility.trade_episode_metrics(frame, previous_position=1.0)\n        self.assertEqual(metrics["trade_episode_count"], 1)\n',
          )
          PY

      - name: Commit boundary fix
        run: |
          python -m py_compile indicators/hidden-regime-map/research/evaluate_trading_utility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/evaluate_trading_utility.py \
                  indicators/hidden-regime-map/research/test_evaluate_trading_utility.py
          git commit -m "Preserve Issue 40 period-boundary entries"
          git push origin HEAD:research/issue-40-trading-utility
