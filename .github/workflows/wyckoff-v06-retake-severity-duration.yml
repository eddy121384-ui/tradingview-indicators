name: Wyckoff v0.6 Retake Severity Duration

on:
  push:
    branches:
      - feat/issue-57-wyckoff-v0.6-robustness
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_retake_severity_duration.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_retake_severity_duration.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-retake-severity-duration-map.md'
      - '.github/workflows/wyckoff-v06-retake-severity-duration.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_retake_severity_duration.py'
      - 'indicators/wyckoff-regime-radar/research/test_diagnose_retake_severity_duration.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-57-retake-severity-duration-map.md'
      - '.github/workflows/wyckoff-v06-retake-severity-duration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  severity-duration-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic
        run: |
          python -m py_compile diagnose_retake_severity_duration.py
          python -m py_compile test_diagnose_retake_severity_duration.py
      - name: Run contract tests
        run: python -m unittest -v test_diagnose_retake_severity_duration
      - name: Map retake severity and duration
        run: |
          python diagnose_retake_severity_duration.py \
            --json-output reports/issue-57-retake-severity-duration.json \
            --md-output reports/issue-57-retake-severity-duration.md
      - name: Commit report on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/issue-57-wyckoff-v0.6-robustness'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-retake-severity-duration.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-57-retake-severity-duration.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "research: record retake severity duration map"
            git push
          fi
