name: Wyckoff Issue 68 Fresh S1 Preserve

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_downex_current_context_fresh_s1_preserve_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-downex-current-context-fresh-s1-preserve-preregistration.md"
      - ".github/workflows/wyckoff-issue68-downex-current-context-fresh-s1-preserve.yml"
  pull_request:
    branches: [main]
    paths:
      - "indicators/wyckoff-regime-radar/research/generate_issue68_downex_current_context_fresh_s1_preserve_audit_pine.py"
      - "indicators/wyckoff-regime-radar/research/decisions/issue-68-downex-current-context-fresh-s1-preserve-preregistration.md"
      - ".github/workflows/wyckoff-issue68-downex-current-context-fresh-s1-preserve.yml"

permissions:
  contents: write

jobs:
  fresh-s1-preserve:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: indicators/wyckoff-regime-radar/research
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python -m py_compile generate_issue68_downex_current_context_fresh_s1_preserve_audit_pine.py
      - name: Generate TradingView Fresh-S1 preserve audit
        run: |
          python generate_issue68_downex_current_context_fresh_s1_preserve_audit_pine.py \
            --output generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          test -s generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          grep -q 'Fresh-S1 semantic anchor' generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          grep -q 'Fresh retained S1' generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          grep -q 'Other S1 removed' generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          grep -q 'NO LOOKAHEAD' generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          ! grep -q 'strategy\.' generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          echo 'Fresh-S1 preserve audit contract PASS'
      - name: Commit generated artifact on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/issue-68-lifecycle-retest-symmetry-repaired'
        working-directory: .
        env:
          TARGET_BRANCH: research/issue-68-lifecycle-retest-symmetry-repaired
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/wyckoff-regime-radar/research/generated/wyckoff-issue68-downex-current-context-fresh-s1-preserve-audit.pine
          if git diff --cached --quiet; then
            echo "Fresh-S1 preserve artifact already current."
            exit 0
          fi
          git commit -m "research: generate Issue 68 Fresh-S1 preserve audit [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          exit 1
