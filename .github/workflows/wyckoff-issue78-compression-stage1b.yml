name: Wyckoff Issue 78 compression structure stage 1B

on:
  push:
    branches:
      - research/issue-78-trend-capture-frontier
    paths:
      - '.github/workflows/wyckoff-issue78-compression-stage1b.yml'
      - 'indicators/wyckoff-regime-radar/research/analyze_issue78_compression_structure_stage1b.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-compression-structure-stage1b-preregistration.md'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-78-compression-structure-stage1b-finding.md'
      - 'indicators/wyckoff-regime-radar/research/data/derived/issue78-compression-stage1b-*.csv'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas scipy
      - name: Syntax check analyzer
        run: python -m py_compile indicators/wyckoff-regime-radar/research/analyze_issue78_compression_structure_stage1b.py
      - name: Static contract checks
        run: |
          FILE=indicators/wyckoff-regime-radar/research/analyze_issue78_compression_structure_stage1b.py
          grep -F 'EXPECTED_EVENTS = 68118' "$FILE"
          grep -F 'EXPECTED_EPISODES = 1624' "$FILE"
          grep -F 'LOOKBACK = 5' "$FILE"
          grep -F 'mean_pairwise_iou' "$FILE"
          grep -F 'close[t] > box_high' indicators/wyckoff-regime-radar/research/decisions/issue-78-compression-structure-stage1b-preregistration.md
          git diff --check
