name: Wyckoff Issue 68 Phase B3.11 Trace Persistence

on:
  push:
    branches:
      - research/issue-68-lifecycle-retest-symmetry-repaired
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b311_trace_persistence_decay.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b311_trace_persistence_decay.py'
      - 'indicators/wyckoff-regime-radar/research/decisions/issue-68-phase-b311-trace-persistence-decay-preregistration.md'
      - '.github/workflows/wyckoff-issue68-phase-b311-trace-persistence.yml'
  pull_request:
    paths:
      - 'indicators/wyckoff-regime-radar/research/diagnose_issue68_phase_b311_trace_persistence_decay.py'
      - 'indicators/wyckoff-regime-radar/research/test_issue68_phase_b311_trace_persistence_decay.py'
      - '.github/workflows/wyckoff-issue68-phase-b311-trace-persistence.yml'

permissions:
  contents: write

jobs:
  trace-persistence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Compile B3.11 diagnostics
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python -m py_compile diagnose_issue68_phase_b311_trace_persistence_decay.py
          python -m py_compile test_issue68_phase_b311_trace_persistence_decay.py

      - name: Run B3.11 synthetic contracts
        working-directory: indicators/wyckoff-regime-radar/research
        run: python test_issue68_phase_b311_trace_persistence_decay.py

      - name: Run frozen-FX Trace persistence forensic
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python diagnose_issue68_phase_b311_trace_persistence_decay.py \
            --report-json reports/issue-68-phase-b311-trace-persistence-decay.json \
            --report-md reports/issue-68-phase-b311-trace-persistence-decay.md

      - name: Guard diagnostic-only boundary
        working-directory: indicators/wyckoff-regime-radar/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/issue-68-phase-b311-trace-persistence-decay.json')
          data = json.loads(p.read_text())
          text = json.dumps(data).lower()
          forbidden = ('sharpe', 'sortino', 'profit_factor', 'net_profit', 'strategy_return')
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f'performance leakage in B3.11 report: {bad}')
          print('B3.11 diagnostic-only boundary PASS')
          PY

      - name: Commit refreshed B3.11 report artifacts
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicators/wyckoff-regime-radar/research/reports/issue-68-phase-b311-trace-persistence-decay.json
          git add indicators/wyckoff-regime-radar/research/reports/issue-68-phase-b311-trace-persistence-decay.md
          if git diff --cached --quiet; then
            echo 'No B3.11 report changes to commit.'
          else
            git commit -m 'research(issue-68): refresh B3.11 trace persistence report'
            git push
          fi
