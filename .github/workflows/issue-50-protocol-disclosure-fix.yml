name: Apply Issue 50 Protocol Disclosure Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-50-protocol-disclosure-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-50-rates-regime-utility

      - name: Disclose all outcome-affecting omissions
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('indicators/hidden-regime-map/research/issue-50-rates-experiment-spec.md')
          text = spec.read_text(encoding='utf-8')
          text = text.replace(
              'Status: pre-result specification with a documented protocol omission',
              'Status: pre-result specification with documented protocol omissions',
          )
          start = text.index('## Protocol-omission disclosure\n')
          end = text.index('## Fixed state-to-duration mapping\n', start)
          disclosure = '''## Protocol-omission disclosure

          The evaluator committed before the formal final-period run already contained two outcome-affecting rule sets that the original written specification did not define numerically.

          ### State-occupancy rule

          The frozen evaluator:

          - calculates soft-posterior state occupancy separately in the fit and final OOS periods;
          - classifies a candidate as unstable when any state has occupancy below 1% in either period;
          - emits `inconclusive_instability` when every HMM candidate is unstable;
          - does not allow an unstable candidate to enter `trading_winners` or `risk_winners`.

          The original written specification listed occupancy as a metric but omitted the 1% threshold, the tested periods, and its effect on the primary outcome.

          ### Exploratory-contradiction rule

          For each HMM-versus-baseline pair, the frozen evaluator marks a material exploratory-OOS contradiction when either:

          - HMM cash-excess Sharpe is more than 0.10 below the baseline; or
          - HMM annualized return is more than 2 percentage points below the baseline.

          A raw final-period trading or risk pass is qualified only when neither contradiction condition is met.

          The original written specification said only that promotion must avoid a “material contradiction” and did not define these two thresholds.

          ### Interpretation consequence

          Neither rule was added, relaxed, or tuned after observing the final period; both existed in the frozen evaluator beforehand. Nevertheless, the written protocol was incomplete and cannot independently reproduce the primary classification.

          The durable interpretation must therefore distinguish:

          1. **Frozen evaluator outcome:** applies both implementation-frozen rule sets.
          2. **Frozen implementation without the occupancy override:** retains the numerical exploratory-contradiction rules but ignores the 1% instability classification.
          3. **Original written-spec outcome:** indeterminate because both “instability” and “material contradiction” lacked complete numerical definitions.

          This disclosure is not a retroactive preregistration claim. Future experiments must place every outcome-affecting threshold in both the code and written specification before execution.

          '''.replace('          ', '')
          spec.write_text(text[:start] + disclosure + text[end:], encoding='utf-8')

          diagnosis = Path('indicators/hidden-regime-map/research/decisions/issue-50-rates-static-fit-diagnosis.md')
          text = diagnosis.read_text(encoding='utf-8')
          text = text.replace(
              'Written promotion-gate outcome without the omitted occupancy rule:\n\n`no_incremental_value`\n\nThe difference between these labels is a documented protocol defect, not an economic contradiction. Under either interpretation, HMM utility was not established and Issue #41 cannot advance.',
              'Frozen implementation outcome without the occupancy override, but retaining the numerical exploratory-contradiction rules:\n\n`no_incremental_value`\n\nOriginal written-spec outcome:\n\n`indeterminate_protocol`\n\nThe original written specification did not numerically define either state instability or a material exploratory contradiction. Under every reproducible interpretation, HMM utility was not established and Issue #41 cannot advance.',
          )
          start = text.index('## Protocol integrity\n')
          end = text.index('## Corrected implementation\n', start)
          integrity = '''## Protocol integrity

          The evaluator committed before the formal final-period run contained two outcome-affecting implementation rule sets that were incompletely described in the original written specification.

          ### Occupancy classification

          The frozen evaluator:

          - evaluates soft-posterior state occupancy in the fit and final OOS periods;
          - marks a candidate unstable if any state occupies less than 1% in either period;
          - emits `inconclusive_instability` when every candidate is unstable;
          - excludes unstable candidates from promotion.

          The original written experiment specification listed occupancy as a metric but omitted the numerical threshold, the periods to which it applied, and its effect on the primary outcome.

          ### Exploratory contradiction

          The frozen evaluator marks an HMM-versus-baseline pair contradictory when exploratory-OOS HMM Sharpe is more than 0.10 below the baseline or HMM annualized return is more than 2 percentage points below the baseline. A raw final-period pass is qualified only when neither condition holds.

          The original written specification said only to avoid a “material contradiction” and omitted these numerical thresholds.

          Neither rule was introduced after final-period observation, but the written protocol cannot independently reproduce the classification. Therefore this report preserves three distinct interpretations:

          1. frozen evaluator: `inconclusive_instability`;
          2. frozen implementation with the occupancy override disabled but exploratory thresholds retained: `no_incremental_value`;
          3. original written specification alone: `indeterminate_protocol`.

          None of the three interpretations establishes HMM utility. The omissions are protocol defects and must remain visible.

          '''.replace('          ', '')
          text = text[:start] + integrity + text[end:]
          text = text.replace(
              'Both candidates violate the implementation-frozen 1% state-occupancy stability rule. The omission of that rule from the original written specification is disclosed above.',
              'Both candidates violate the implementation-frozen 1% state-occupancy stability rule. The written protocol also omitted the frozen numerical exploratory-contradiction thresholds; both omissions are disclosed above.',
          )
          text = text.replace(
              '`complete_inconclusive_static_fit_with_protocol_defect`',
              '`complete_inconclusive_static_fit_with_protocol_defects`',
          )
          diagnosis.write_text(text, encoding='utf-8')
          PY

      - name: Commit disclosure correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators/hidden-regime-map/research/issue-50-rates-experiment-spec.md \
                  indicators/hidden-regime-map/research/decisions/issue-50-rates-static-fit-diagnosis.md
          git commit -m "Disclose Issue 50 classification protocol omissions"
          git push origin HEAD:research/issue-50-rates-regime-utility
