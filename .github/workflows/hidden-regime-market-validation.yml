name: Hidden Regime Market Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - indicators/hidden-regime-map/**
      - .github/workflows/hidden-regime-market-validation.yml
  push:
    branches:
      - research/hidden-regime-pine-parity-spike
    paths:
      - indicators/hidden-regime-map/**
      - .github/workflows/hidden-regime-market-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ticker: [SPY, TLT]
    env:
      TICKER: ${{ matrix.ticker }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: indicators/hidden-regime-map/requirements-research.txt

      - name: Install research dependencies
        run: python -m pip install -r indicators/hidden-regime-map/requirements-research.txt

      - name: Run Hidden Regime unit tests
        run: python -m unittest discover -s indicators/hidden-regime-map/research -p 'test_*.py'

      - name: Validate committed research decision JSON
        run: >-
          python -m json.tool
          indicators/hidden-regime-map/research/decisions/issue-39-research-core-status.json
          > /dev/null

      - name: Download adjusted daily OHLC
        run: |
          python indicators/hidden-regime-map/research/download_yfinance.py \
            --ticker "$TICKER" \
            --start 2010-01-01 \
            --output "artifacts/$TICKER/ohlc.csv"

      - name: Train and evaluate HMM
        id: train
        continue-on-error: true
        run: |
          mkdir -p "artifacts/$TICKER/output"
          python indicators/hidden-regime-map/research/train_hmm.py \
            --input "artifacts/$TICKER/ohlc.csv" \
            --output-dir "artifacts/$TICKER/output" \
            --symbol "$TICKER" \
            --timeframe 1D \
            > "artifacts/$TICKER/output/train.log" 2>&1
          status=$?
          cat "artifacts/$TICKER/output/train.log"
          exit $status

      - name: Characterize fitted states
        id: characterize
        if: steps.train.outcome == 'success'
        continue-on-error: true
        run: |
          python indicators/hidden-regime-map/research/characterize_states.py \
            --posteriors "artifacts/$TICKER/output/filtered-posteriors.csv" \
            --diagnostics "artifacts/$TICKER/output/state-diagnostics.csv" \
            --model "artifacts/$TICKER/output/model-parameters.json" \
            --events indicators/hidden-regime-map/research/event-windows.json \
            --output-dir "artifacts/$TICKER/output" \
            --symbol "$TICKER" \
            > "artifacts/$TICKER/output/characterize.log" 2>&1
          status=$?
          cat "artifacts/$TICKER/output/characterize.log"
          exit $status

      - name: Compare SPY feature sets and state counts
        id: compare_feature_sets
        if: matrix.ticker == 'SPY'
        continue-on-error: true
        run: |
          python indicators/hidden-regime-map/research/compare_feature_sets.py \
            --input "artifacts/$TICKER/ohlc.csv" \
            --output-dir "artifacts/$TICKER/state-count-comparison" \
            --symbol SPY \
            --timeframe 1D \
            > "artifacts/$TICKER/state-count-comparison.log" 2>&1
          status=$?
          cat "artifacts/$TICKER/state-count-comparison.log"
          exit $status

      - name: Check SPY K8 cutoff stability
        id: check_k8_cutoffs
        if: matrix.ticker == 'SPY'
        continue-on-error: true
        run: |
          mkdir -p "artifacts/$TICKER/k8-cutoff-stability"
          python indicators/hidden-regime-map/research/check_k8_cutoff_stability.py \
            --input "artifacts/$TICKER/ohlc.csv" \
            --output-dir "artifacts/$TICKER/k8-cutoff-stability" \
            --symbol SPY \
            --timeframe 1D \
            --cutoffs 5 \
            > "artifacts/$TICKER/k8-cutoff-stability.log" 2>&1
          status=$?
          cat "artifacts/$TICKER/k8-cutoff-stability.log"
          exit $status

      - name: Write workflow summary
        if: always()
        run: |
          root="artifacts/$TICKER/output"
          if [ -f "$root/characterization.md" ]; then
            cat "$root/characterization.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## $TICKER Hidden Regime validation"
              echo
              echo "State characterization was not produced."
              echo
              echo '```text'
              if [ -f "$root/train.log" ]; then tail -40 "$root/train.log"; fi
              if [ -f "$root/characterize.log" ]; then tail -40 "$root/characterize.log"; fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "artifacts/$TICKER/state-count-comparison/feature-set-decision.md" ]; then
            cat "artifacts/$TICKER/state-count-comparison/feature-set-decision.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "artifacts/$TICKER/k8-cutoff-stability/k8-cutoff-stability.md" ]; then
            cat "artifacts/$TICKER/k8-cutoff-stability/k8-cutoff-stability.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-regime-${{ matrix.ticker }}
          path: artifacts/${{ matrix.ticker }}
          retention-days: 14
          if-no-files-found: error

      - name: Fail job when research validation failed
        if: steps.train.outcome == 'failure' || steps.characterize.outcome == 'failure' || steps.compare_feature_sets.outcome == 'failure' || steps.check_k8_cutoffs.outcome == 'failure'
        run: exit 1
